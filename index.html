  const togglePos = (t: ServiceTask, pos: string) => {
    const positions = t.positions.includes(pos) ? t.positions.filter(p => p !== pos) : [...t.positions, pos];
    update(t.id, { positions, qty: Math.max(1, positions.length) });
  };

  const setMechanic = (t: ServiceTask, id: string) => {
    const m = id === 'free' || id === '' ? null : mechanics.find(x => x.id === id);
    update(t.id, { mechanicId: id, mechanic: m ? m.name : '' });
  };

  const grandTotal = tasks.reduce((s, t) => s + taskTotal(t), 0);
  const serviceTotal = tasks.reduce((s, t) => s + taskServiceAmount(t), 0);

  // Un paquete de mantención crea de una vez todas las tareas que lo componen.
  const packages = getServicePackages();
  const addPackage = (pkg: ServicePackage) => {
    const names = packageServices(pkg);
    if (!names.length) { toast.error(`El paquete “${pkg.name}” no tiene servicios válidos. Revísalo en Configuración.`); return; }
    const stamp = Date.now();
    const nuevas: ServiceTask[] = names.map((name, i) => ({
      id: `T-${stamp}-${i}-${Math.random().toString(36).slice(2, 5)}`,
      service: name, positions: [], detail: '', qty: 1,
      servicePrice: servicePriceOf(name, defCat), suppliesPrice: 0, supplyCode: '',
      priceCategory: defCat, mechanicId: '', mechanic: '', status: 'pendiente',
      packageName: pkg.name,
    } as ServiceTask));
    onChange([...tasks, ...nuevas]);
    toast.success(`${pkg.name}: ${names.length} servicios agregados`);
  };

  return (
    <div className="space-y-3">
      {packages.length > 0 && (
        <div className="bg-blue-50 border border-blue-200 rounded-lg p-3">
          <p className="text-xs font-semibold text-blue-900 mb-2">Paquetes de mantención — agregan todos sus servicios de una vez</p>
          <div className="grid gap-1.5" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))' }}>
            {packages.map(p => (
              <button key={p.id} type="button" onClick={() => addPackage(p)}
                className="text-left bg-white border border-blue-300 rounded-lg px-3 py-2 hover:border-blue-500 transition-colors">
                <span className="block text-sm font-semibold text-blue-800">{p.name}</span>
                <span className="block text-[11px] text-gray-500">{packageServices(p).length} servicios</span>
              </button>
            ))}
          </div>
        </div>
      )}

      {tasks.length === 0 && (
        <p className="text-sm text-gray-500 bg-gray-50 border border-dashed border-gray-300 rounded-lg p-4 text-center">
          Aún no hay tareas. Agregue al menos una.
        </p>
      )}

      {tasks.map((t, idx) => {
        const usesPos = serviceUsesPositions(t.service);
        return (
          <div key={t.id} className="border border-gray-200 rounded-lg p-3 space-y-3 bg-white">
            <div className="flex items-center justify-between">
              <span className="text-xs font-semibold text-gray-500">Tarea {idx + 1}</span>
              <button type="button" onClick={() => remove(t.id)} className="text-red-500 hover:text-red-700 text-sm flex items-center gap-1">
                <Trash2 className="w-4 h-4" /> Quitar
              </button>
            </div>

            <div>
              <label className="block text-xs font-medium text-gray-600 mb-1">Servicio</label>
              <ServicePicker value={t.service} priceCategory={t.priceCategory || defCat} onPick={(name) => setService(t, name)} />
              {serviceIsFullInspection(t.service) && (
                <p className="text-xs text-blue-600 mt-1">Inspección completa: trae todos los ítems del checklist técnico.</p>
              )}
            </div>

            {usesPos && (
              <div>
                <label className="block text-xs font-medium text-gray-600 mb-1">¿En qué posición?</label>
                <div className="grid grid-cols-4 gap-1.5">
                  {TASK_POSITIONS.map(pos => (
                    <button key={pos} type="button" onClick={() => togglePos(t, pos)}
                      className={`px-2 py-1.5 rounded-md border text-xs transition-colors ${t.positions.includes(pos) ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-600 border-gray-300'}`}>
                      {pos}
                    </button>
                  ))}
                </div>
              </div>
            )}

            <div>
              <label className="block text-xs font-medium text-gray-600 mb-1">Insumo — código o nombre <span className="text-gray-400">(autocompleta el precio)</span></label>
              <div className="relative">
                <input type="text" value={supplyQuery[t.id] ?? (t.supplyCode || '')}
                  onChange={(e) => {
                    const val = e.target.value;
                    setSupplyQuery(q => ({ ...q, [t.id]: val }));
                    const exact = catalog.find(p => (p.code || '').toLowerCase() === val.trim().toLowerCase());
                    if (exact) setSupply(t, exact);
                  }}
                  placeholder="Ej: 110851 o “145 R12”…"
                  className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" />
                {(() => {
                  const raw = (supplyQuery[t.id] ?? '').trim().toLowerCase();
                  if (!raw) return null;
                  const ms = catalog.filter(p => `${p.code} ${p.name}`.toLowerCase().includes(raw)).slice(0, 8);
                  if (!ms.length) return null;
                  return (
                    <div className="absolute z-10 left-0 right-0 mt-1 border border-gray-200 rounded-lg bg-white shadow-lg max-h-60 overflow-auto divide-y divide-gray-100">
                      {ms.map(p => (
                        <button key={p.code + p.name} type="button" onClick={() => setSupply(t, p)}
                          className="w-full text-left px-3 py-2 hover:bg-blue-50 flex items-center justify-between gap-2">
                          <span className="min-w-0">
                            <span className="font-medium text-gray-800 block truncate">{p.name}</span>
                            {p.code && <span className="text-gray-400 text-xs">{p.code}</span>}
                          </span>
                          <span className="text-gray-600 text-sm shrink-0">{formatCLP(productPriceOf(p, t.priceCategory || defCat))}</span>
                        </button>
                      ))}
                    </div>
                  );
                })()}
              </div>
              {t.supplyCode && (
                <p className="text-[11px] text-gray-500 mt-1">Código <span className="font-medium text-gray-700">{t.supplyCode}</span> · precio de insumo autocompletado</p>
              )}
            </div>

            <div>
              <label className="block text-xs font-medium text-gray-600 mb-1">Detalle del insumo / tarea <span className="text-gray-400">(lo ve el mecánico)</span></label>
              <input type="text" value={t.detail || ''} onChange={(e) => update(t.id, { detail: e.target.value })}
                placeholder="Ej: batería 12V 65Ah, marca, rueda de repuesto…"
                className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" />
            </div>

            {categories.length > 1 && (
              <div>
                <label className="block text-xs font-medium text-gray-600 mb-1">Canal / medio de pago</label>
                <select value={t.priceCategory || defCat} onChange={(e) => setCategory(t, e.target.value)}
                  className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                  {categories.map(c => <option key={c} value={c}>{c}</option>)}
                </select>
              </div>
            )}

            <div className="grid grid-cols-3 gap-2">
              <div>
                <label className="block text-xs font-medium text-gray-600 mb-1">Cantidad{usesPos ? ' (neumáticos)' : ''}</label>
                {usesPos ? (
                  <div className="w-full px-3 py-2 border border-gray-200 bg-gray-50 rounded-lg text-sm text-gray-700 flex items-center justify-between">
                    <span className="font-semibold">{t.qty}</span>
                    <span className="text-[10px] text-gray-400 uppercase tracking-wide">Auto</span>
                  </div>
                ) : (
                  <input type="number" min="1" value={t.qty}
                    onChange={(e) => update(t.id, { qty: Math.max(1, parseInt(e.target.value) || 1) })}
                    className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" />
                )}
              </div>
              <div>
                <label className="block text-xs font-medium text-gray-600 mb-1">P. servicio (c/u)</label>
                <input type="number" min="0" value={t.servicePrice || ''}
                  onChange={(e) => update(t.id, { servicePrice: parseFloat(e.target.value) || 0 })}
                  placeholder="0" className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" />
              </div>
              <div>
                <label className="block text-xs font-medium text-gray-600 mb-1">P. insumo (c/u)</label>
                <input type="number" min="0" value={t.suppliesPrice || ''}
                  onChange={(e) => update(t.id, { suppliesPrice: parseFloat(e.target.value) || 0 })}
                  placeholder="0" className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" />
              </div>
            </div>

            <div>
              <label className="block text-xs font-medium text-gray-600 mb-1">Mecánico de esta tarea</label>
              <select value={t.mechanicId} onChange={(e) => setMechanic(t, e.target.value)}
                className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                <option value="">Sin asignar (se asigna luego)</option>
                <option value="free">Libre — cualquier mecánico</option>
                {mechanics.map(m => <option key={m.id} value={m.id}>{m.name} · {m.branch}</option>)}
              </select>
            </div>

            <div className="text-right text-xs text-gray-500">
              Subtotal tarea: <span className="font-semibold text-gray-800">{formatCLP(taskTotal(t))}</span>
              {' '}<span className="text-gray-400">(servicio {formatCLP(taskServiceAmount(t))})</span>
            </div>
          </div>
        );
      })}

      <button type="button" onClick={add}
        className="w-full border-2 border-dashed border-blue-300 text-blue-600 py-2.5 rounded-lg text-sm font-medium hover:bg-blue-50 transition-colors flex items-center justify-center gap-2">
        <Plus className="w-4 h-4" /> Agregar tarea
      </button>

      {tasks.length > 0 && (
        <div className="bg-gray-50 border border-gray-200 rounded-lg p-3 flex items-center justify-between">
          <div>
            <p className="text-xs text-gray-500">Servicio (comisionable)</p>
            <p className="text-sm font-semibold text-gray-700">{formatCLP(serviceTotal)}</p>
          </div>
          <div className="text-right">
            <p className="text-xs text-gray-500">Total a cobrar</p>
            <p className="text-xl font-bold text-green-600">{formatCLP(grandTotal)}</p>
          </div>
        </div>
      )}
    </div>
  );
}

// Editor de productos de una venta. El vendedor busca un producto por código o
// nombre; el precio se autocompleta desde la lista cargada por administración según
// la categoría de precio elegida (web, presencial, medio de pago…) y queda editable
// para excepciones. Los productos NO cuentan para comisiones.
function ProductEditor({ products, onChange }: { products: SaleProduct[]; onChange: (p: SaleProduct[]) => void }) {
  const catalog = getProducts();
  const categories = getPriceCategories();
  const defCat = categories[0] || '';
  const [query, setQuery] = useState('');
  const q = query.trim().toLowerCase();
  const matches = q ? catalog.filter(p => `${p.code} ${p.name}`.toLowerCase().includes(q)).slice(0, 8) : [];

  const addProduct = (p: { code: string; name: string; prices: Record<string, number> }) => {
    onChange([...products, { code: p.code, name: p.name, qty: 1, unitPrice: productPriceOf(p, defCat), category: defCat }]);
    setQuery('');
  };
  const addManual = () => {
    onChange([...products, { code: '', name: query.trim() || 'Producto', qty: 1, unitPrice: 0, category: defCat }]);
    setQuery('');
  };
  const update = (i: number, patch: Partial<SaleProduct>) => onChange(products.map((p, idx) => idx === i ? { ...p, ...patch } : p));
  const remove = (i: number) => onChange(products.filter((_, idx) => idx !== i));
  const setCategory = (i: number, cat: string) => {
    const cp = findProductByCode(products[i].code);
    update(i, { category: cat, ...(cp ? { unitPrice: productPriceOf(cp, cat) } : {}) });
  };

  const total = products.reduce((s, p) => s + productTotal(p), 0);

  return (
    <div className="space-y-3">
      <div className="relative">
        <input value={query} onChange={(e) => setQuery(e.target.value)}
          placeholder="Buscar producto por código o nombre…"
          className="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
        {q && (
          <div className="absolute z-10 left-0 right-0 mt-1 border border-gray-200 rounded-lg bg-white shadow-lg max-h-60 overflow-auto divide-y divide-gray-100">
            {matches.map(p => (
              <button key={p.code} type="button" onClick={() => addProduct(p)}
                className="w-full text-left px-3 py-2 hover:bg-blue-50 flex items-center justify-between gap-2">
                <span className="min-w-0">
                  <span className="font-medium text-gray-800 block truncate">{p.name}</span>
                  {p.code && <span className="text-gray-400 text-xs">{p.code}</span>}
                </span>
                <span className="text-gray-600 text-sm shrink-0">{formatCLP(productPriceOf(p, defCat))}</span>
              </button>
            ))}
            <button type="button" onClick={addManual}
              className="w-full text-left px-3 py-2 text-blue-600 hover:bg-blue-50 text-sm flex items-center gap-1.5">
              <Plus className="w-4 h-4" /> Agregar “{query.trim()}” como producto manual
            </button>
          </div>
        )}
      </div>

      {products.length === 0 && (
        <p className="text-sm text-gray-500 bg-gray-50 border border-dashed border-gray-300 rounded-lg p-4 text-center">
          Aún no hay productos. Busca uno arriba para agregarlo.
        </p>
      )}

      {products.map((p, i) => (
        <div key={i} className="border border-gray-200 rounded-lg p-3 space-y-2 bg-white">
          <div className="flex items-start justify-between gap-2">
            <div className="min-w-0">
              <span className="text-sm font-medium text-gray-800 block">{p.name}</span>
              {p.code && <span className="text-xs text-gray-400">Código {p.code}</span>}
            </div>
            <button type="button" onClick={() => remove(i)} className="text-red-500 hover:text-red-700 text-sm flex items-center gap-1 shrink-0">
              <Trash2 className="w-4 h-4" /> Quitar
            </button>
          </div>
          <div className="grid grid-cols-3 gap-2">
            {categories.length > 0 && (
              <div>
                <label className="block text-xs font-medium text-gray-600 mb-1">Precio</label>
                <select value={p.category || ''} onChange={(e) => setCategory(i, e.target.value)}
                  className="w-full px-2 py-2 border border-gray-300 rounded-lg text-sm">
                  {categories.map(c => <option key={c} value={c}>{c}</option>)}
                </select>
              </div>
            )}
            <div>
              <label className="block text-xs font-medium text-gray-600 mb-1">Cantidad</label>
              <input type="number" min="1" value={p.qty}
                onChange={(e) => update(i, { qty: Math.max(1, parseInt(e.target.value) || 1) })}
                className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" />
            </div>
            <div>
              <label className="block text-xs font-medium text-gray-600 mb-1">P. unitario</label>
              <input type="number" min="0" value={p.unitPrice || ''}
                onChange={(e) => update(i, { unitPrice: parseFloat(e.target.value) || 0 })}
                placeholder="0" className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" />
            </div>
          </div>
          <div className="text-right text-xs text-gray-500">
            Subtotal: <span className="font-semibold text-gray-800">{formatCLP(productTotal(p))}</span>
          </div>
        </div>
      ))}

      {catalog.length === 0 && (
        <p className="text-xs text-amber-600 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">
          No hay lista de productos cargada. Un Administrador Central puede subirla en <span className="font-medium">Usuarios → Precios</span>. Mientras tanto puedes agregar productos manualmente.
        </p>
      )}

      {products.length > 0 && (
        <div className="bg-gray-50 border border-gray-200 rounded-lg p-3 flex items-center justify-between">
          <p className="text-xs text-gray-500">Total productos</p>
          <p className="text-lg font-bold text-green-600">{formatCLP(total)}</p>
        </div>
      )}
    </div>
  );
}

// Envuelve un ítem de evaluación (barra, texto, etc.) con su propia tira de fotos.
// Permite adjuntar/tomar las fotos que se necesiten para ESE ítem, sin secciones aparte.
// Las fotos se guardan en el mapa `photos` bajo claves "<baseKey>__p<timestamp>"
// (y también reconoce una foto antigua guardada directamente en "<baseKey>").
function EvalItem({ baseKey, photos, onAddPhoto, onRemovePhoto, children }: {
  baseKey: string;
  photos: Record<string, string>;
  onAddPhoto: (baseKey: string) => void;
  onRemovePhoto: (key: string) => void;
  children: React.ReactNode;
}) {
  const keys = Object.keys(photos).filter((k) => k === baseKey || k.indexOf(baseKey + '__p') === 0);
  return (
    <div className="border border-gray-200 rounded-lg p-3">
      {children}
      <div className="flex flex-wrap items-center gap-2 mt-2.5">
        {keys.map((k) => (
          <div key={k} className="relative w-16 h-16">
            <img src={photos[k]} alt="" className="w-full h-full object-cover rounded-md border border-gray-200" />
            <button type="button" onClick={() => onRemovePhoto(k)}
              className="absolute -top-1.5 -right-1.5 bg-red-600 text-white rounded-full w-5 h-5 flex items-center justify-center shadow hover:bg-red-700" title="Quitar foto">
              <X className="w-3 h-3" />
            </button>
          </div>
        ))}
        <button type="button" onClick={() => onAddPhoto(baseKey)}
          className="w-16 h-16 border-2 border-dashed border-gray-300 rounded-md flex flex-col items-center justify-center gap-0.5 text-gray-400 hover:border-blue-500 hover:text-blue-600 hover:bg-blue-50 transition-colors">
          <Camera className="w-5 h-5" />
          <span className="text-[9px] leading-none">Foto</span>
        </button>
      </div>
    </div>
  );
}

// Barra de condición 0-100. Siempre editable (sin marcar/desmarcar): arrastra y listo.
// Si no se toca (valor -1) muestra "No evaluado" y no aparece en el informe.
function CondBar({ label, value, onChange }: { label: string; value: number; onChange: (v: number) => void }) {
  const evaluated = value >= 0;
  return (
    <div>
      <div className="flex items-center justify-between mb-2">
        <label className="text-sm font-medium text-gray-700">{label}: {evaluated ? `${value}%` : <span className="text-gray-400">Desliza para evaluar</span>}</label>
        {evaluated && (
          <button type="button" onClick={() => onChange(-1)} className="text-xs text-gray-400 hover:text-gray-600">Limpiar</button>
        )}
      </div>
      <input type="range" min="0" max="100" value={evaluated ? value : 0}
        onChange={(e) => onChange(parseInt(e.target.value))}
        className={`w-full h-2 rounded-lg appearance-none cursor-pointer accent-blue-600 ${evaluated ? 'bg-gray-200' : 'bg-gray-100'}`} />
    </div>
  );
}

// Botonera de calificación Bueno / Regular / Malo (vacío = no evaluado, no sale en el informe).
function RatingBar({ label, value, onChange }: { label: string; value: string; onChange: (v: string) => void }) {
  const opts: { v: string; cls: string }[] = [
    { v: 'Bueno', cls: 'bg-green-600' },
    { v: 'Regular', cls: 'bg-amber-500' },
    { v: 'Malo', cls: 'bg-red-600' },
  ];
  return (
    <div>
      <div className="flex items-center justify-between mb-1">
        <label className="block text-sm font-medium text-gray-700">{label}</label>
        {value !== '' && (
          <button type="button" onClick={() => onChange('')} className="text-xs text-gray-400 hover:text-gray-600">Limpiar</button>
        )}
      </div>
      <div className="grid grid-cols-3 gap-2">
        {opts.map(o => (
          <button key={o.v} type="button" onClick={() => onChange(o.v)}
            className={`py-2.5 rounded-lg font-medium text-sm transition-colors ${value === o.v ? `${o.cls} text-white` : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}>
            {o.v}
          </button>
        ))}
      </div>
    </div>
  );
}

// Botonera OK / No OK con opción de "limpiar" (deseleccionar = no evaluado).
function OkBar({ label, value, onChange }: { label: string; value: 'OK' | 'Not OK' | ''; onChange: (v: 'OK' | 'Not OK' | '') => void }) {
  return (
    <div>
      <div className="flex items-center justify-between mb-1">
        <label className="block text-sm font-medium text-gray-700">{label}</label>
        {value !== '' && (
          <button type="button" onClick={() => onChange('')} className="text-xs text-gray-400 hover:text-gray-600">Limpiar</button>
        )}
      </div>
      <div className="flex gap-3">
        <button type="button" onClick={() => onChange('OK')}
          className={`flex-1 py-3 rounded-lg font-medium transition-colors ${value === 'OK' ? 'bg-green-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}>
          OK
        </button>
        <button type="button" onClick={() => onChange('Not OK')}
          className={`flex-1 py-3 rounded-lg font-medium transition-colors ${value === 'Not OK' ? 'bg-red-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}>
          No OK
        </button>
      </div>
    </div>
  );
}

interface NewInspectionProps {
  onComplete: () => void;
  preselectedVehicle?: Vehicle;
  serviceOrder?: Inspection;
  initialMode?: 'inspect' | 'register';
}

function NewInspection({ onComplete, preselectedVehicle, serviceOrder, initialMode }: NewInspectionProps) {
  const user = getCurrentUser();
  const isAdmin = user?.role === 'admin';
  const isMechanic = user?.role === 'mechanic';
  // "Seller admin" roles (Ventas / Admin 2) record the commercial service info.
  const isSeller = user?.role === 'admin2' || user?.role === 'ventas';
  // Mechanics jump straight to the technical evaluation of a registered vehicle / service order.
  const [step, setStep] = useState((preselectedVehicle || serviceOrder) ? 3 : 1);
  // The global admin can choose, in a single tab, between four flows:
  //   inspect   → inspección completa (venta + técnica de una vez)
  //   order     → "solo venta": crea la orden de servicio y asigna un mecánico
  //   takeorder → "solo inspección": toma una orden existente y hace la parte técnica
  //   register  → registrar el vehículo únicamente
  const [adminMode, setAdminMode] = useState<'inspect' | 'order' | 'takeorder' | 'register'>(initialMode === 'register' ? 'register' : 'order');
  const isRegistrationMode = isAdmin && adminMode === 'register';
  const isOrderMode = isAdmin && adminMode === 'order';          // solo venta (crea la orden)
  const isTakeOrderMode = isAdmin && adminMode === 'takeorder';  // solo inspección (toma una orden)
  // An existing service order the admin picked to inspect (the "solo inspección" flow).
  const [takenOrder, setTakenOrder] = useState<Inspection | null>(null);
  // The order currently being completed: the mechanic's prop, or the one the admin took.
  const activeOrder = serviceOrder || takenOrder;
  // Step 1 requires the full client/vehicle record for sellers and admin registration / sales.
  const requireFullVehicle = isSeller || isRegistrationMode || isOrderMode;
  // The steps that make up this user's flow (drives the progress bar).
  // Mechanics (and admin "solo inspección") only run the technical evaluation (step 3).
  // The sale step (2) belongs to the seller admin and the admin sales / full flows.
  const flowSteps = isMechanic ? [3]
    : isRegistrationMode ? [1]
    : isTakeOrderMode ? [3]
    : (isSeller || isOrderMode) ? [1, 2]
    : [1, 2, 3];

  const [licensePlate, setLicensePlate] = useState('');
  const [clientName, setClientName] = useState('');
  const [phoneNumber, setPhoneNumber] = useState('');
  const [email, setEmail] = useState('');
  const [vehicleModel, setVehicleModel] = useState('');
  const [vehicleNotes, setVehicleNotes] = useState('');
  const [vehicleMileage, setVehicleMileage] = useState('');
  const [dataConsent, setDataConsent] = useState(false);
  const [showPlateSug, setShowPlateSug] = useState(false);

  const [branch, setBranch] = useState(user?.branch || '');
  const [tasks, setTasks] = useState<ServiceTask[]>([]);
  // Productos vendidos en esta venta (con o sin servicio) y el tipo de venta.
  const [products, setProducts] = useState<SaleProduct[]>([]);
  const [saleType, setSaleType] = useState<'servicio' | 'productos'>('servicio');
  // The tasks the current mechanic is responsible for in the active order (own + libre/unassigned).
  const myActiveTasks = (activeOrder && isMechanic) ? tasksForMechanic(activeOrder, user?.id || '') : orderTasks(activeOrder || ({} as Inspection));
  // Which of the available tasks the mechanic is taking IN THIS session (ids). Lets them
  // take all at once, only their own, or pick some (incl. picking up a 'libre' task).
  const [selectedTaskIds, setSelectedTaskIds] = useState<string[]>([]);
  // Default selection: the mechanic's OWN pending tasks (libre/unassigned start unticked).
  useEffect(() => {
    if (activeOrder && isMechanic) {
      const own = orderTasks(activeOrder).filter(t => t.mechanicId === (user?.id || '') && t.status !== 'completado').map(t => t.id);
      setSelectedTaskIds(own);
      setNotDoneDraft({});
    }
  }, [serviceOrder, takenOrder]);
  const toggleTaskPick = (id: string) =>
    setSelectedTaskIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
  // Tareas que el mecánico NO pudo realizar (id -> motivo). Modal para capturar el motivo.
  const [notDoneDraft, setNotDoneDraft] = useState<Record<string, string>>({});
  const [notDoneModalId, setNotDoneModalId] = useState<string | null>(null);
  const [notDoneReasonText, setNotDoneReasonText] = useState('');
  const NOT_DONE_REASONS = ['Sin repuestos / insumos', 'Cliente se negó', 'Falta de herramientas', 'Daño mayor al previsto', 'Otro'];
  const openNotDone = (id: string) => { setNotDoneModalId(id); setNotDoneReasonText(notDoneDraft[id] || ''); };
  const confirmNotDone = () => {
    const reason = notDoneReasonText.trim();
    if (!reason) { toast.error('Indica el motivo'); return; }
    if (notDoneModalId) {
      setNotDoneDraft(prev => ({ ...prev, [notDoneModalId]: reason }));
      setSelectedTaskIds(prev => prev.filter(x => x !== notDoneModalId));
    }
    setNotDoneModalId(null); setNotDoneReasonText('');
  };
  const clearNotDone = (id: string) => setNotDoneDraft(prev => { const n = { ...prev }; delete n[id]; return n; });

  // Condition bars: -1 = "no evaluado" (no se muestran en el informe compartible).
  const [frontTiresCondition, setFrontTiresCondition] = useState(-1);
  const [rearTiresCondition, setRearTiresCondition] = useState(-1);
  const [frontBrakesCondition, setFrontBrakesCondition] = useState(-1);
  const [rearBrakesCondition, setRearBrakesCondition] = useState(-1);
  const [suspensionCondition, setSuspensionCondition] = useState('');
  const [alternatorStatus, setAlternatorStatus] = useState('');
  const [batteryStatus, setBatteryStatus] = useState('');
  // '' = no evaluado (default); solo se muestra en el informe si se marcó OK / No OK.
  const [lightsStatus, setLightsStatus] = useState<'OK' | 'Not OK' | ''>('');
  const [accessoryBelt, setAccessoryBelt] = useState<'OK' | 'Not OK' | ''>('');
  const [fluidLevels, setFluidLevels] = useState('');
  const [additionalNotes, setAdditionalNotes] = useState('');

  const [photos, setPhotos] = useState<Record<string, string>>({});
  const photoInputRef = useRef<HTMLInputElement>(null);
  const cameraInputRef = useRef<HTMLInputElement>(null);
  const pendingPhotoKeyRef = useRef<string>('');
  // Slot para el cual se está eligiendo el origen de la foto (cámara o galería).
  const [photoSheetKey, setPhotoSheetKey] = useState<string | null>(null);
  // Hallazgos: desperfectos/piezas en mal estado, cada uno con foto (guardada en el
  // mapa photos bajo "finding-<id>") y una nota que explica el problema.
  const [findings, setFindings] = useState<{ id: string; note: string }[]>([]);

  // "Procesos futuros" the mechanic recommends to the seller after the inspection.
  // `done` = el cliente pidió el extra y el mecánico YA lo hizo → el vendedor debe cobrarlo.
  const [futureWork, setFutureWork] = useState<{ text: string; done: boolean }[]>([{ text: '', done: false }]);
  const [futureWorkNotes, setFutureWorkNotes] = useState('');

  // $0-cost authorization (global admin only, password "ADMINGLOB").
  const [zeroPwdOpen, setZeroPwdOpen] = useState(false);
  const [zeroPwd, setZeroPwd] = useState('');

  useEffect(() => {
    if (preselectedVehicle) {
      setLicensePlate(preselectedVehicle.licensePlate);
      setClientName(preselectedVehicle.clientName);
      setPhoneNumber(preselectedVehicle.phoneNumber);
      setEmail(preselectedVehicle.email);
      setVehicleModel(preselectedVehicle.vehicleModel);
      setVehicleNotes(preselectedVehicle.notes);
      setVehicleMileage((preselectedVehicle as any).mileage || '');
      setDataConsent(!!preselectedVehicle.dataConsent);
    }
  }, [preselectedVehicle]);

  // When completing a service order (mechanic's prop or admin-taken), prefill plate/client +
  // the commercial service info (read-only context for the inspector).
  useEffect(() => {
    const o = activeOrder;
    if (o) {
      setLicensePlate(o.licensePlate);
      const v = getVehicle(o.licensePlate);
      if (v) {
        setClientName(v.clientName);
        setPhoneNumber(v.phoneNumber);
        setEmail(v.email);
        setVehicleModel(v.vehicleModel);
        setVehicleNotes(v.notes);
        setVehicleMileage((v as any).mileage || '');
        setDataConsent(!!v.dataConsent);
      }
      setBranch(o.branch || user?.branch || '');
      setTasks(orderTasks(o));
      setProducts(orderProducts(o));
      setSaleType(o.saleType || 'servicio');
      // Precargar fotos existentes de la orden (todas: generales + por ítem + hallazgos).
      if (o.photos && Object.keys(o.photos).length) {
        setPhotos({ ...o.photos });
      }
      if (Array.isArray((o as any).findings)) setFindings((o as any).findings);
      // Recargar los “procesos futuros” ya enviados para esta orden, para no perderlos
      // ni duplicar la recomendación al volver a guardar.
      const existingRec = getRecommendations().find(r => r.inspectionId === o.id && r.status === 'pendiente');
      if (existingRec) {
        const done = existingRec.doneItems || [];
        setFutureWork(existingRec.items.map(t => ({ text: t, done: done.includes(t) })));
        setFutureWorkNotes(existingRec.notes || '');
      }
    }
  }, [serviceOrder, takenOrder]);

  // Fotos generales del vehículo/servicio. Se toman inline como ítems de evaluación
  // (más abajo), con su propia tira de fotos, igual que los componentes mecánicos.
  const GENERAL_PHOTO_ITEMS: [string, string][] = [
    ['vehicle', 'Vehículo'],
    ['before', 'Antes del servicio'],
    ['after', 'Después del servicio'],
    ['oldParts', 'Piezas Viejas'],
    ['newParts', 'Piezas Nuevas'],
  ];

  const savingRef = useRef(false);
  // Which submit to resume after the global admin authorizes a $0 service.
  const zeroResumeRef = useRef<'final' | 'service'>('final');
  // After registering a service with "Libre" assignment, the admin may take the inspection now.
  const [freeOrderToInspect, setFreeOrderToInspect] = useState<Inspection | null>(null);

  const handleLicensePlateBlur = () => {
    const plate = licensePlate.toUpperCase();
    setLicensePlate(plate);
    const vehicle = getVehicle(plate);
    if (vehicle) applyVehicle(vehicle, true);
  };

  // Rellena el formulario con un vehículo ya registrado (editable).
  const applyVehicle = (vehicle: Vehicle, notify?: boolean) => {
    setLicensePlate(vehicle.licensePlate);
    setClientName(vehicle.clientName);
    setPhoneNumber(vehicle.phoneNumber);
    setEmail(vehicle.email);
    setVehicleModel(vehicle.vehicleModel);
    setVehicleNotes(vehicle.notes);
    setVehicleMileage((vehicle as any).mileage || '');
    setDataConsent(!!vehicle.dataConsent);
    setShowPlateSug(false);
    if (notify) toast.success('Datos del vehículo autocompletados');
  };

  // Vehículos que coinciden con lo tecleado en patente o nombre del cliente
  // (permite que un cliente con varios autos elija el correcto).
  const plateSuggestions = (() => {
    const q = licensePlate.trim().toUpperCase();
    const nameQ = clientName.trim().toLowerCase();
    if (!q && !nameQ) return [];
    const exact = getVehicle(q);
    return getVehicles().filter(v => {
      if (exact && v.licensePlate === exact.licensePlate && v.licensePlate === q) return false;
      const byPlate = q && v.licensePlate.includes(q);
      const byName = nameQ && (v.clientName || '').toLowerCase().includes(nameQ);
      return byPlate || byName;
    }).slice(0, 6);
  })();

  // Autos registrados a nombre del cliente actual (un cliente puede tener varios).
  const clientVehicles = (() => {
    const nameQ = clientName.trim().toLowerCase();
    if (!nameQ) return [];
    return getVehicles().filter(v => (v.clientName || '').toLowerCase() === nameQ);
  })();

  const toggleService = (service: string) => {};

  // Un solo input de archivo compartido por todos los slots (fijos y extra).
  // Abre el selector de origen (cámara o galería) para el slot indicado.
  const openPhotoPicker = (key: string) => {
    setPhotoSheetKey(key);
  };
  // Adjunta una foto MÁS a un ítem de evaluación (clave única por foto).
  const addItemPhoto = (baseKey: string) => openPhotoPicker(`${baseKey}__p${Date.now()}`);
  // Dispara el input correspondiente al origen elegido, dentro del gesto del usuario.
  const pickPhotoFrom = (source: 'camera' | 'gallery') => {
    const key = photoSheetKey;
    setPhotoSheetKey(null);
    if (!key) return;
    pendingPhotoKeyRef.current = key;
    const ref = source === 'camera' ? cameraInputRef : photoInputRef;
    ref.current?.click();
  };
  const onPhotoFile = (e: React.ChangeEvent<HTMLInputElement>) => {
    const file = e.target.files?.[0];
    e.target.value = '';
    const key = pendingPhotoKeyRef.current;
    if (!file || !key) return;
    const reader = new FileReader();
    reader.onloadend = async () => {
      const compressed = await compressPhoto(reader.result as string);
      setPhotos((prev) => ({ ...prev, [key]: compressed }));
      toast.success('Foto agregada');
    };
    reader.readAsDataURL(file);
  };
  const removePhoto = (key: string) => {
    setPhotos((prev) => { const n = { ...prev }; delete n[key]; return n; });
  };
  // Hallazgos / desperfectos.
  const addFinding = () => {
    const id = `${Date.now()}-${Math.random().toString(36).slice(2, 5)}`;
    setFindings((prev) => [...prev, { id, note: '' }]);
  };
  const updateFinding = (id: string, note: string) => setFindings((prev) => prev.map((f) => f.id === id ? { ...f, note } : f));
  const removeFinding = (id: string) => {
    setFindings((prev) => prev.filter((f) => f.id !== id));
    setPhotos((prev) => {
      const n = { ...prev };
      const base = `finding-${id}`;
      Object.keys(n).forEach((k) => { if (k === base || k.indexOf(base + '__p') === 0) delete n[k]; });
      return n;
    });
  };

  const buildInspection = (): Inspection => syncOrderTotals({
    id: `INS-${Date.now()}`,
    licensePlate: licensePlate.toUpperCase(),
    date: new Date().toISOString(),
    mechanic: user?.name || '',
    mechanicId: user?.id || '',
    branch,
    serviceTypes: [],
    amountCharged: 0,
    tasks,
    products,
    saleType,
    frontTiresCondition,
    rearTiresCondition,
    frontBrakesCondition,
    rearBrakesCondition,
    suspensionCondition,
    alternatorStatus,
    batteryStatus,
    lightsStatus,
    accessoryBelt,
    fluidLevels,
    additionalNotes,
    photos,
    findings,
  });

  const handleStep1Submit = () => {
    if (requireFullVehicle) {
      if (!licensePlate || !clientName || !phoneNumber || !email || !vehicleModel) {
        toast.error('Todos los campos son obligatorios para registrar un vehículo');
        return;
      }
    } else if (!licensePlate || !clientName) {
      toast.error('Patente y nombre del cliente son obligatorios');
      return;
    }

    saveVehicle({
      licensePlate: licensePlate.toUpperCase(),
      clientName,
      phoneNumber,
      email,
      vehicleModel,
      notes: vehicleNotes,
      mileage: vehicleMileage,
      dataConsent,
      dataConsentAt: dataConsent ? new Date().toISOString() : undefined,
      createdBy: user?.name || '',
      createdAt: new Date().toISOString(),
    });

    if (isRegistrationMode) {
      toast.success('Vehículo registrado exitosamente');
      onComplete();
      return;
    }

    // Sellers and admin (full inspection) continue to the service step.
    setStep(2);
  };

  // $0 rule: services with cost $0 are forbidden, unless the GLOBAL ADMIN authorizes
  // it with the password "ADMINGLOB". Returns true if the save may proceed.
  const passesZeroCostRule = (override: boolean): boolean => {
    const amount = orderTotal({ tasks } as Inspection);
    if (amount > 0) return true;
    if (override) return true;
    if (isAdmin) {
      setZeroPwd('');
      setZeroPwdOpen(true);   // ask the global admin for the authorization password
      return false;
    }
    toast.error('No se permiten servicios con costo $0. Solo el Admin Global puede autorizarlo.');
    return false;
  };

  // Sellers (Ventas / Admin 2) record only the commercial service info, creating a
  // numbered, dated service order that a mechanic will later complete.
  const handleServiceSubmit = (override = false) => {
    if (!branch) {
      toast.error('Seleccione la sucursal');
      return;
    }

    // Venta solo de productos: no crea orden para el mecánico ni inspección técnica.
    if (saleType === 'productos') {
      if (products.length === 0) {
        toast.error('Agregue al menos un producto');
        return;
      }
      if (orderProductsTotal({ products } as Inspection) <= 0) {
        toast.error('El total de la venta no puede ser $0');
        return;
      }
      const nowP = new Date().toISOString();
      const sale: Inspection = syncOrderTotals({
        ...buildInspection(),
        tasks: [],
        orderNumber: nextOrderNumber(),
        serviceDate: nowP,
        date: nowP,
        status: 'completado',
        serviceBy: user?.name || '',
        mechanic: '',
        mechanicId: '',
        saleType: 'productos',
      });
      saveInspection(sale);
      toast.success(`Venta de productos registrada · Orden ${sale.orderNumber}`);
      onComplete();
      return;
    }

    if (tasks.length === 0) {
      toast.error('Agregue al menos una tarea');
      return;
    }
    zeroResumeRef.current = 'service';
    if (!passesZeroCostRule(override)) return;

    const now = new Date().toISOString();
    // Una orden "libre" es la que tiene alguna tarea sin mecánico fijo.
    const isFree = tasks.some(t => t.mechanicId === 'free' || t.mechanicId === '');
    const order: Inspection = syncOrderTotals({
      ...buildInspection(),
      orderNumber: nextOrderNumber(),
      serviceDate: now,
      date: now,
      status: 'pendiente',
      serviceBy: user?.name || '',
      mechanic: '',
      mechanicId: isFree ? 'free' : '',
    });
    saveInspection(order);
    toast.success(`Servicio registrado · Orden ${order.orderNumber}`);
    // Si el admin registra y alguna tarea quedó libre, puede tomarla ahora mismo.
    if (isAdmin && isFree) {
      setFreeOrderToInspect(order);
      return;
    }
    onComplete();
  };

  const handleFinalSubmit = async (override = false) => {
    if (savingRef.current) return;
    savingRef.current = true;
    try {
      await runFinalSubmit(override);
    } catch (e) {
      console.error('Error al guardar la inspección:', e);
      toast.error('No se pudo guardar la inspección. Revisa la conexión e inténtalo de nuevo.');
    } finally {
      savingRef.current = false;
    }
  };

  const runFinalSubmit = async (override = false) => {
    // Sube las fotos a Storage EN SEGUNDO PLANO y, al terminar, agrega las URLs
    // al registro ya guardado. El registro se guarda SIN los base64 (livianos), así
    // el estado (p.ej. "completado") se sincroniza al instante sin payloads enormes.
    const urlOnly = (photos: Record<string, string>): Record<string, string> => {
      const out: Record<string, string> = {};
      Object.keys(photos || {}).forEach((k) => {
        const v = photos[k];
        if (typeof v === 'string' && v.indexOf('data:') !== 0) out[k] = v;
      });
      return out;
    };
    const backgroundUpload = (id: string, localPhotos: Record<string, string>) => {
      const hasData = Object.values(localPhotos || {}).some(v => typeof v === 'string' && v.indexOf('data:') === 0);
      if (!hasData) return;
      uploadInspectionPhotos(id, localPhotos)
        .then((uploaded) => {
          const cur = getInspections().find(i => i.id === id);
          if (!cur) return;
          updateInspection(id, { photos: { ...(cur.photos || {}), ...uploaded } });
          const failed = Object.keys(uploaded).filter(k => typeof uploaded[k] === 'string' && uploaded[k].indexOf('data:') === 0).length;
          if (failed > 0) toast.info(`${failed} foto(s) quedaron pendientes de subir. Se subirán solas cuando haya conexión: no se pierden.`);
        })
        .catch((e) => { console.error('Subida de fotos en segundo plano falló:', e); toast.info('Las fotos quedaron pendientes y se subirán automáticamente. No se pierden.'); });
    };
    // Helper: if the mechanic listed future work, send it to the Admin de Ventas.
    const saveRecommendationsIfAny = (inspectionId: string, orderNumber?: string) => {
      const active = futureWork.filter(f => f.text.trim());
      const items = active.map(f => f.text.trim());
      if (items.length === 0) return false;
      const doneItems = active.filter(f => f.done).map(f => f.text.trim());
      // Si ya había una recomendación pendiente para esta orden, se ACTUALIZA (no se
      // crea otra) para no duplicar procesos futuros al reguardar.
      const existing = getRecommendations().find(r => r.inspectionId === inspectionId && r.status === 'pendiente');
      if (existing) {
        updateRecommendation(existing.id, { items, doneItems, notes: futureWorkNotes.trim(), orderNumber });
        return true;
      }
      const rec: Recommendation = {
        id: `REC-${Date.now()}`,
        licensePlate: licensePlate.toUpperCase(),
        inspectionId,
        orderNumber,
        items,
        doneItems,
        notes: futureWorkNotes.trim(),
        createdBy: user?.name || '',
        createdAt: new Date().toISOString(),
        status: 'pendiente',
      };
      saveRecommendation(rec);
      return true;
    };

    // Mechanic (or admin in "solo inspección") completing an existing service order:
    // fill in the technical evaluation and mark it completed.
    if (activeOrder) {
      const myId = user?.id || '';
      // Releer la orden por si otro mecánico completó tareas en paralelo.
      const fresh = getInspections().find(i => i.id === activeOrder.id) || activeOrder;
      // Solo se completan las tareas que el mecánico SELECCIONÓ en esta sesión
      // (sus propias y/o libres que decidió tomar). Las demás no se tocan.
      const available = orderTasks(fresh).filter(t => (t.mechanicId === myId || t.mechanicId === 'free' || t.mechanicId === '') && t.status !== 'completado');
      const picks = selectedTaskIds.filter(id => available.some(t => t.id === id));
      const notDoneIds = Object.keys(notDoneDraft).filter(id => available.some(t => t.id === id) && !picks.includes(id));
      if (picks.length === 0 && notDoneIds.length === 0) {
        toast.error('Selecciona al menos una tarea que vas a realizar o marca alguna como no realizada');
        return;
      }
      toast.info('Guardando inspección…');
      const nowIso = new Date().toISOString();
      const updatedTasks = orderTasks(fresh).map(t => {
        if (picks.includes(t.id) && t.status !== 'completado') {
          return { ...t, status: 'completado' as const, mechanicId: myId, mechanic: user?.name || '', completedAt: nowIso, completedBy: user?.name || '' };
        }
        if (notDoneIds.includes(t.id) && t.status !== 'completado') {
          return { ...t, status: 'no_realizado' as const, mechanicId: myId, mechanic: user?.name || '', notDoneReason: notDoneDraft[t.id], notDoneBy: user?.name || '', notDoneAt: nowIso };
        }
        return t;
      });
      const everyResolved = updatedTasks.length > 0 && updatedTasks.every(t => t.status !== 'pendiente');
      const anyNotDone = updatedTasks.some(t => t.status === 'no_realizado');
      // Merge: no pisar evaluaciones previas con campos que este mecánico dejó sin evaluar.
      const mN = (cur: number, prev: any) => cur >= 0 ? cur : (typeof prev === 'number' ? prev : -1);
      const mS = (cur: string, prev: any) => (cur && cur !== '') ? cur : (prev || '');
      updateInspection(activeOrder.id, {
        mechanic: user?.name || '',
        mechanicId: myId,
        tasks: updatedTasks,
        amountCharged: updatedTasks.filter(t => t.status !== 'no_realizado').reduce((s, t) => s + taskTotal(t), 0) + orderProductsTotal(fresh),
        serviceTypes: [...new Set(updatedTasks.filter(t => t.status !== 'no_realizado').map(t => t.service).filter(Boolean))],
        status: everyResolved ? 'completado' : 'pendiente',
        frontTiresCondition: mN(frontTiresCondition, fresh.frontTiresCondition),
        rearTiresCondition: mN(rearTiresCondition, fresh.rearTiresCondition),
        frontBrakesCondition: mN(frontBrakesCondition, fresh.frontBrakesCondition),
        rearBrakesCondition: mN(rearBrakesCondition, fresh.rearBrakesCondition),
        suspensionCondition: mS(suspensionCondition, fresh.suspensionCondition),
        alternatorStatus: mS(alternatorStatus, fresh.alternatorStatus),
        batteryStatus: mS(batteryStatus, fresh.batteryStatus),
        lightsStatus: (lightsStatus || fresh.lightsStatus || '') as any,
        accessoryBelt: (accessoryBelt || fresh.accessoryBelt || '') as any,
        fluidLevels: mS(fluidLevels, fresh.fluidLevels),
        additionalNotes: mS(additionalNotes, fresh.additionalNotes),
        photos: { ...(fresh.photos || {}), ...urlOnly(photos) },
        findings,
      });
      backgroundUpload(activeOrder.id, photos);
      const sentRec = saveRecommendationsIfAny(activeOrder.id, activeOrder.orderNumber);
      toast.success(everyResolved
        ? `Orden ${activeOrder.orderNumber || ''} cerrada`.trim()
        : 'Tareas registradas (quedan tareas pendientes en la orden)');
      if (anyNotDone) toast.info('Tareas no realizadas: el vendedor podrá gestionar la devolución');
      if (sentRec) toast.info('Procesos futuros enviados a Cotizaciones');
      // Toda inspección envía al cliente el correo con el informe y la reconfirmación de uso de datos
      // (sendClientTermsEmail evita duplicados por inspección).
      {
        const fresh2 = getInspections().find(i => i.id === activeOrder.id) || activeOrder;
        const sentTerms = sendClientTermsEmail(fresh2);
        if (sentTerms) toast.info('Correo con informe y confirmación de datos enviado al cliente');
      }
      onComplete();
      return;
    }

    // Admin full inspection (service + technical at once).
    if (!isMechanic && tasks.length === 0) {
      toast.error('Agregue al menos una tarea');
      return;
    }
    if (!isMechanic && !passesZeroCostRule(override)) return;

    const now = new Date().toISOString();
    zeroResumeRef.current = 'final';
    toast.info('Guardando inspección…');
    // En inspección completa del admin, todas las tareas quedan hechas por él.
    const doneTasks = tasks.map(t => ({ ...t, status: 'completado' as const, mechanicId: user?.id || '', mechanic: user?.name || '', completedAt: now, completedBy: user?.name || '' }));
    const built: Inspection = syncOrderTotals({
      ...buildInspection(),
      tasks: doneTasks,
      orderNumber: nextOrderNumber(),
      serviceDate: now,
      status: 'completado',
      serviceBy: user?.name || '',
    });
    const capturedPhotos = built.photos;
    built.photos = urlOnly(built.photos);
    saveInspection(built);
    backgroundUpload(built.id, capturedPhotos);
    const sentRec = saveRecommendationsIfAny(built.id, built.orderNumber);
    toast.success('Inspección guardada exitosamente');
    if (sentRec) toast.info('Procesos futuros enviados a Cotizaciones');
    const sentTerms = sendClientTermsEmail(built);
    if (sentTerms) toast.info('Correo de términos y condiciones enviado al cliente');
    onComplete();
  };

  // Resume the pending save after the global admin authorizes a $0 service.
  const confirmZeroAuthorization = () => {
    if (zeroPwd !== 'ADMINGLOB') {
      toast.error('Contraseña de autorización incorrecta');
      return;
    }
    setZeroPwdOpen(false);
    // Resume the flow that requested the authorization.
    if (zeroResumeRef.current === 'service') handleServiceSubmit(true);
    else handleFinalSubmit(true);
  };

  // Segmented control (global admin only): registration and inspection, separated.
  const adminModeToggle = (
    <div className="bg-white rounded-lg border border-gray-200 p-1 grid grid-cols-2 gap-1">
      {([
        ['order', 'Registro'],
        ['takeorder', 'Inspección'],
      ] as ['order' | 'takeorder', string][]).map(([m, label]) => (
        <button
          key={m}
          type="button"
          onClick={() => { setAdminMode(m); setStep(1); setTakenOrder(null); }}
          style={{ backgroundColor: adminMode === m ? '#2563eb' : 'transparent', color: adminMode === m ? '#ffffff' : '#4b5563' }}
          className="py-2 rounded-md text-sm font-medium"
        >
          {label}
        </button>
      ))}
    </div>
  );

  return (
    <div className="p-4 pb-24">
      <div className="mb-6">
        <h2 className="text-2xl font-bold text-gray-900">
          {isMechanic ? 'Inspección Técnica' : isRegistrationMode ? 'Registrar Vehículo' : isOrderMode ? 'Registrar Servicio' : isTakeOrderMode ? 'Inspección Técnica' : isSeller ? 'Registrar Servicio' : 'Nueva Inspección'}
        </h2>
        {flowSteps.length > 1 && (
          <div className="flex gap-2 mt-3">
            {flowSteps.map((s) => (
              <div key={s} className={`flex-1 h-2 rounded ${step >= s ? 'bg-blue-600' : 'bg-gray-300'}`} />
            ))}
          </div>
        )}
      </div>

      {/* Admin "solo inspección": pick an existing order, then run the technical evaluation. */}
      {isTakeOrderMode && !takenOrder && (
        <div className="space-y-4">
          {isAdmin && !initialMode && adminModeToggle}
          <ServiceOrderSelector
            onSelectOrder={(o) => {
              if (o.mechanicId === 'free') {
                updateInspection(o.id, { mechanic: user?.name || '', mechanicId: user?.id || '' });
                setTakenOrder({ ...o, mechanic: user?.name || '', mechanicId: user?.id || '' });
              } else {
                setTakenOrder(o);
              }
              setStep(3);
            }}
            onCancel={() => setAdminMode('inspect')}
          />
        </div>
      )}

      {step === 1 && !isTakeOrderMode && (
        <div className="space-y-4">
          {isAdmin && !initialMode && adminModeToggle}
          <h3 className="text-lg font-semibold text-gray-900">
            {isRegistrationMode ? 'Información del Cliente y Vehículo' : 'Datos del Vehículo'}
          </h3>
          {isRegistrationMode && (
            <div className="bg-blue-50 border border-blue-200 rounded-lg p-3 mb-4">
              <p className="text-sm text-blue-700">
                Complete todos los campos obligatorios (*) para registrar el vehículo en el sistema.
              </p>
            </div>
          )}

          <div className="relative">
            <label className="block text-sm font-medium text-gray-700 mb-1">
              Patente <span className="text-red-500">*</span>
            </label>
            <input
              type="text"
              value={licensePlate}
              onChange={(e) => { setLicensePlate(e.target.value.toUpperCase()); setShowPlateSug(true); }}
              onFocus={() => setShowPlateSug(true)}
              onBlur={() => { setTimeout(() => setShowPlateSug(false), 150); handleLicensePlateBlur(); }}
              placeholder="ABC123"
              autoComplete="off"
              className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent uppercase"
            />
            {showPlateSug && plateSuggestions.length > 0 && (
              <div className="absolute z-30 left-0 right-0 mt-1 bg-white border border-gray-200 rounded-lg shadow-lg overflow-hidden">
                <p className="px-3 py-1.5 text-[11px] font-medium text-gray-400 bg-gray-50">Vehículos registrados</p>
                {plateSuggestions.map(v => (
                  <button key={v.licensePlate} type="button" onMouseDown={(e) => { e.preventDefault(); applyVehicle(v, true); }}
                    className="w-full text-left px-3 py-2 hover:bg-blue-50 transition-colors border-t border-gray-100">
                    <span className="text-sm font-semibold text-gray-900">{v.licensePlate}</span>
                    <span className="text-xs text-gray-500"> · {v.clientName}{v.vehicleModel ? ` · ${v.vehicleModel}` : ''}</span>
                  </button>
                ))}
              </div>
            )}
          </div>

          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">
              Nombre del Cliente <span className="text-red-500">*</span>
            </label>
            <input
              type="text"
              value={clientName}
              onChange={(e) => setClientName(e.target.value)}
              className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            />
            {clientVehicles.length > 1 && (
              <div className="mt-2">
                <p className="text-xs text-gray-500 mb-1">Este cliente tiene {clientVehicles.length} vehículos · selecciona uno:</p>
                <div className="flex flex-wrap gap-1.5">
                  {clientVehicles.map(v => (
                    <button key={v.licensePlate} type="button" onClick={() => applyVehicle(v, true)}
                      className={`px-2.5 py-1 rounded-full text-xs font-medium border transition-colors ${v.licensePlate === licensePlate.toUpperCase() ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-700 border-gray-300 hover:border-blue-500'}`}>
                      {v.licensePlate}{v.vehicleModel ? ` · ${v.vehicleModel}` : ''}
                    </button>
                  ))}
                </div>
              </div>
            )}
          </div>

          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">
              Teléfono {isRegistrationMode && <span className="text-red-500">*</span>}
            </label>
            <input
              type="tel"
              value={phoneNumber}
              onChange={(e) => setPhoneNumber(e.target.value)}
              placeholder="11-2345-6789"
              className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            />
          </div>

          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">
              Email {isRegistrationMode && <span className="text-red-500">*</span>}
            </label>
            <input
              type="email"
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              placeholder="cliente@ejemplo.com"
              className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            />
          </div>

          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">
              Modelo del Vehículo {isRegistrationMode && <span className="text-red-500">*</span>}
            </label>
            <input
              type="text"
              value={vehicleModel}
              onChange={(e) => setVehicleModel(e.target.value)}
              placeholder="Toyota Corolla 2020"
              className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            />
          </div>

          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">Kilometraje</label>
            <input
              type="number"
              value={vehicleMileage}
              onChange={(e) => setVehicleMileage(e.target.value)}
              placeholder="Ej: 85000"
              className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            />
          </div>

          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">Notas Generales</label>
            <textarea
              value={vehicleNotes}
              onChange={(e) => setVehicleNotes(e.target.value)}
              rows={3}
              placeholder="Información adicional sobre el cliente o vehículo"
              className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            />
          </div>

          <label className="flex items-start gap-2.5 bg-gray-50 border border-gray-200 rounded-lg p-3 cursor-pointer">
            <input type="checkbox" checked={dataConsent} onChange={(e) => setDataConsent(e.target.checked)} className="rounded mt-0.5" />
            <span className="text-sm text-gray-700">El cliente autoriza el uso y guardado de sus datos.
              <span className="block text-xs text-gray-500 mt-0.5">Al finalizar el servicio se le enviará por correo el resumen de términos y condiciones para confirmar su conformidad.</span>
            </span>
          </label>

          <button
            onClick={handleStep1Submit}
            className="w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 transition-colors"
          >
            {isRegistrationMode ? 'Registrar Vehículo' : 'Continuar'}
          </button>
        </div>
      )}

      {step === 2 && (
        <div className="space-y-4">
          <h3 className="text-lg font-semibold text-gray-900">Información del Servicio</h3>

          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">
              Sucursal <span className="text-red-500">*</span>
            </label>
            <select
              value={branch}
              onChange={(e) => setBranch(e.target.value)}
              className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            >
              <option value="">-- Seleccionar --</option>
              {getBranches().map((b) => (
                <option key={b} value={b}>
                  {b}
                </option>
              ))}
            </select>
          </div>

          {(isSeller || isOrderMode) && (
            <div className="bg-white rounded-lg border border-gray-200 p-1 grid grid-cols-2 gap-1">
              {([['servicio', 'Servicio'], ['productos', 'Solo productos']] as ['servicio' | 'productos', string][]).map(([m, label]) => (
                <button key={m} type="button" onClick={() => setSaleType(m)}
                  style={{ backgroundColor: saleType === m ? '#2563eb' : 'transparent', color: saleType === m ? '#ffffff' : '#4b5563' }}
                  className="py-2 rounded-md text-sm font-medium">
                  {label}
                </button>
              ))}
            </div>
          )}

          {saleType === 'servicio' && (
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-2">
                Tareas del servicio <span className="text-red-500">*</span>
              </label>
              <p className="text-xs text-gray-600 mb-2">
                Cada tarea lleva su cantidad, precio de servicio + insumo y su propio mecánico.
                Solo el precio de servicio cuenta para comisiones.
              </p>
              <TaskEditor tasks={tasks} onChange={setTasks} branch={branch} user={user} />
            </div>
          )}

          <div>
            <label className="block text-sm font-medium text-gray-700 mb-2">
              Productos {saleType === 'productos'
                ? <span className="text-red-500">*</span>
                : <span className="text-gray-400 font-normal">(opcional)</span>}
            </label>
            <p className="text-xs text-gray-600 mb-2">
              {saleType === 'productos'
                ? 'Venta de productos sin servicio: no genera orden para el mecánico ni inspección técnica.'
                : 'Agrega productos vendidos junto con el servicio. No cuentan para comisiones.'}
            </p>
            <ProductEditor products={products} onChange={setProducts} />
          </div>

          <div className="flex gap-3">
            <button
              onClick={() => setStep(1)}
              className="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg font-medium hover:bg-gray-300 transition-colors"
            >
              Atrás
            </button>
            <button
              onClick={(isSeller || isOrderMode) ? () => handleServiceSubmit() : () => setStep(3)}
              className={`flex-1 text-white py-3 rounded-lg font-medium transition-colors flex items-center justify-center gap-2 ${(isSeller || isOrderMode) ? 'bg-green-600 hover:bg-green-700' : 'bg-blue-600 hover:bg-blue-700'}`}
            >
              {(isSeller || isOrderMode) && <Save className="w-5 h-5" />}
              {(isSeller || isOrderMode) ? (saleType === 'productos' ? 'Guardar Venta' : 'Guardar Servicio') : 'Continuar'}
            </button>
          </div>
        </div>
      )}

      {step === 3 && (
        <div className="space-y-6">
          <h3 className="text-lg font-semibold text-gray-900">Inspección Técnica</h3>

          {(preselectedVehicle || serviceOrder) && (
            <div className="bg-blue-50 border border-blue-200 rounded-lg p-3">
              <p className="text-sm font-semibold text-blue-900">{licensePlate} · {vehicleModel || 'Modelo no especificado'}</p>
              <p className="text-xs text-blue-700">{clientName}</p>
            </div>
          )}

          {serviceOrder && (
            <div className="bg-amber-50 border border-amber-200 rounded-lg p-3">
              <p className="text-sm font-semibold text-amber-900">Orden {serviceOrder.orderNumber} · {new Date(serviceOrder.serviceDate || serviceOrder.date).toLocaleDateString('es-ES')}</p>
              <p className="text-xs text-amber-700">Monto total: {formatCLP(orderTotal(serviceOrder))} · Registrado por {serviceOrder.serviceBy || 'Ventas'}</p>
            </div>
          )}

          {activeOrder && myActiveTasks.length > 0 && (
            <div className="bg-white border border-gray-200 rounded-lg p-3">
              <h4 className="text-sm font-semibold text-gray-900 mb-2">Tareas de esta orden</h4>
              <p className="text-xs text-gray-500 mb-2">Marca las tareas que harás ahora. Las de otros mecánicos aparecen bloqueadas.</p>
              <div className="space-y-1.5">
                {orderTasks(activeOrder).map(t => {
                  const mine = t.mechanicId === (user?.id || '');
                  const free = t.mechanicId === 'free' || t.mechanicId === '';
                  const available = mine || free;
                  const done = t.status === 'completado';
                  const notDone = t.status === 'no_realizado';
                  const picked = selectedTaskIds.includes(t.id);
                  const draftNotDone = notDoneDraft[t.id] !== undefined;
                  return (
                    <label key={t.id} className={`flex items-start justify-between gap-2 text-xs rounded-md px-2 py-2 ${available && !done && !notDone ? 'cursor-pointer hover:bg-gray-50' : 'opacity-60'}`}>
                      <span className="flex items-start gap-2 flex-1">
                        <input type="checkbox" disabled={!available || done || notDone || draftNotDone} checked={done || picked}
                          onChange={() => toggleTaskPick(t.id)} className="rounded mt-0.5" />
                        <span className="text-gray-700">
                          <span className="block">
                            {t.qty > 1 ? `${t.qty}× ` : ''}{t.service}
                            {t.positions.length > 0 && <span className="text-gray-400"> · {t.positions.join(', ')}</span>}
                            {free && !done && !notDone && <span className="text-blue-500"> · Libre</span>}
                            {!mine && !free && <span className="text-gray-400"> · {t.mechanic || 'otro mecánico'}</span>}
                          </span>
                          {t.detail && (
                            <span className="block mt-1 text-blue-800 bg-blue-50 border border-blue-100 rounded px-1.5 py-0.5">
                              <span className="font-semibold">Insumo / detalle:</span> {t.detail}
                            </span>
                          )}
                          {(notDone || draftNotDone) && (
                            <span className="block mt-1 text-red-700 bg-red-50 border border-red-100 rounded px-1.5 py-0.5">
                              <span className="font-semibold">No realizada:</span> {notDone ? t.notDoneReason : notDoneDraft[t.id]}
                            </span>
                          )}
                          {available && !done && !notDone && (
                            <span className="block mt-1.5">
                              {draftNotDone ? (
                                <button type="button" onClick={(e) => { e.preventDefault(); clearNotDone(t.id); }}
                                  className="text-gray-500 underline hover:text-gray-700">Deshacer “no realizada”</button>
                              ) : (
                                <button type="button" onClick={(e) => { e.preventDefault(); openNotDone(t.id); }}
                                  className="text-red-600 underline hover:text-red-700">No pude realizarla</button>
                              )}
                            </span>
                          )}
                        </span>
                      </span>
                      <span className={done ? 'text-green-600 font-medium shrink-0' : (notDone || draftNotDone ? 'text-red-600 font-medium shrink-0' : 'text-amber-600 font-medium shrink-0')}>
                        {done ? 'Completada' : (notDone || draftNotDone ? 'No realizada' : (available ? (picked ? 'La haré' : 'Disponible') : 'Otro mecánico'))}
                      </span>
                    </label>
                  );
                })}
              </div>
              <p className="text-xs text-gray-400 mt-2">La orden se cierra cuando todas las tareas (de todos los mecánicos) estén completadas.</p>
            </div>
          )}

          {notDoneModalId !== null && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/50 p-4" onClick={() => setNotDoneModalId(null)}>
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-sm p-4 space-y-3" onClick={(e) => e.stopPropagation()}>
                <p className="text-sm font-semibold text-gray-900">Marcar tarea como no realizada</p>
                <p className="text-xs text-gray-500">Indica el motivo. El vendedor lo verá para gestionar la devolución correspondiente.</p>
                <div className="grid grid-cols-1 gap-1.5">
                  {NOT_DONE_REASONS.map(r => (
                    <button key={r} type="button" onClick={() => setNotDoneReasonText(r === 'Otro' ? '' : r)}
                      className={`px-3 py-2 rounded-lg border-2 text-sm text-left transition-colors ${notDoneReasonText === r ? 'bg-red-600 text-white border-red-600' : 'bg-white text-gray-700 border-gray-300 hover:border-red-500'}`}>
                      {r}
                    </button>
                  ))}
                </div>
                <textarea value={notDoneReasonText} onChange={(e) => setNotDoneReasonText(e.target.value)} rows={2}
                  placeholder="Detalla el motivo…"
                  className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm resize-none focus:ring-2 focus:ring-red-500 focus:border-transparent" />
                <div className="flex gap-2">
                  <button type="button" onClick={confirmNotDone} className="flex-1 bg-red-600 text-white py-2.5 rounded-lg text-sm font-medium hover:bg-red-700">Confirmar</button>
                  <button type="button" onClick={() => { setNotDoneModalId(null); setNotDoneReasonText(''); }} className="flex-1 bg-gray-200 text-gray-700 py-2.5 rounded-lg text-sm font-medium hover:bg-gray-300">Cancelar</button>

          {/* Infra compartida de fotos (inputs ocultos + modal cámara/galería). Las fotos

          <input ref={cameraInputRef} type="file" accept="image/*" capture="environment" onChange={onPhotoFile} className="hidden" />
          {photoSheetKey !== null && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/50 p-4" onClick={() => setPhotoSheetKey(null)}>
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-sm p-4 space-y-2" onClick={(e) => e.stopPropagation()}>

          <div className="border border-amber-200 bg-amber-50/40 rounded-lg p-4">
            <div className="flex items-center justify-between mb-1">
              <h4 className="font-semibold text-gray-900 flex items-center gap-2">
                <AlertCircle className="w-5 h-5 text-amber-600" /> Hallazgos / desperfectos
              </h4>
              <button type="button" onClick={addFinding}

          </EvalItem>
          <EvalItem baseKey="frontBrakes" photos={photos} onAddPhoto={addItemPhoto} onRemovePhoto={removePhoto}>

          <EvalItem baseKey="rearBrakes" photos={photos} onAddPhoto={addItemPhoto} onRemovePhoto={removePhoto}>
            <CondBar label="Frenos Traseros" value={rearBrakesCondition} onChange={setRearBrakesCondition} />
          </EvalItem>

          <EvalItem baseKey="suspension" photos={photos} onAddPhoto={addItemPhoto} onRemovePhoto={removePhoto}>
            <RatingBar label="Tren delantero" value={suspensionCondition} onChange={setSuspensionCondition} />
          </EvalItem>

          <EvalItem baseKey="alternator" photos={photos} onAddPhoto={addItemPhoto} onRemovePhoto={removePhoto}>
            <label className="block text-sm font-medium text-gray-700 mb-1">Estado del Alternador</label>
            <input
              type="text"

              onChange={(e) => setAlternatorStatus(e.target.value)}

          <EvalItem baseKey="battery" photos={photos} onAddPhoto={addItemPhoto} onRemovePhoto={removePhoto}>
            <label className="block text-sm font-medium text-gray-700 mb-1">Estado de Batería</label>
            <input
              type="text"
              value={batteryStatus}
              onChange={(e) => setBatteryStatus(e.target.value)}

              className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            />
          </EvalItem>

          <EvalItem baseKey="lights" photos={photos} onAddPhoto={addItemPhoto} onRemovePhoto={removePhoto}>
            <OkBar label="Luces" value={lightsStatus} onChange={setLightsStatus} />
          </EvalItem>

          <EvalItem baseKey="notes" photos={photos} onAddPhoto={addItemPhoto} onRemovePhoto={removePhoto}>
            <label className="block text-sm font-medium text-gray-700 mb-1">Notas Adicionales</label>
            <textarea
              value={additionalNotes}
              onChange={(e) => setAdditionalNotes(e.target.value)}
              rows={3}
              className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            />
          </EvalItem>


          <div className="bg-blue-50 border border-blue-200 rounded-lg p-4 space-y-3">
            <div>
              <h4 className="font-semibold text-blue-900 flex items-center gap-2">
                <DollarSign className="w-4 h-4" /> Procesos futuros recomendados
              </h4>
              <p className="text-xs text-blue-700">Se envían al Admin de Ventas para cotizar. Marca “Ya realizado” si el cliente pidió el extra y lo hiciste: ventas lo verá para cobrarlo. Opcional.</p>
            </div>
            <div className="space-y-2">
              {futureWork.map((fw, i) => (
                <div key={i} className="flex flex-col gap-1.5 bg-white border border-blue-100 rounded-lg p-2">
                  <div className="flex gap-2">
                    <input
                      type="text"
                      value={fw.text}
                      onChange={(e) => setFutureWork(prev => prev.map((x, idx) => idx === i ? { ...x, text: e.target.value } : x))}

                      onClick={() => setFutureWork(prev => prev.length > 1 ? prev.filter((_, idx) => idx !== i) : [{ text: '', done: false }])}

                      <Trash2 className="w-4 h-4" />

                    <input type="checkbox" checked={fw.done}
                      onChange={(e) => setFutureWork(prev => prev.map((x, idx) => idx === i ? { ...x, done: e.target.checked } : x))}
                      className="rounded text-green-600 focus:ring-green-500" />
                    Ya realizado (el cliente lo pidió) — avisar a ventas para cobrarlo
                  </label>
                </div>
              ))}
            </div>
            <button type="button" onClick={() => setFutureWork(prev => [...prev, { text: '', done: false }])}
              className="text-sm text-blue-600 font-medium hover:text-blue-700 flex items-center gap-1">
              <Plus className="w-4 h-4" /> Agregar proceso
            </button>
            <textarea
              value={futureWorkNotes}
              onChange={(e) => setFutureWorkNotes(e.target.value)}
              rows={2}
              placeholder="Nota para el Admin de Ventas (opcional)"
              className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white"
            />
          </div>

          <div className="flex gap-3">
            <button
              onClick={isMechanic ? onComplete : () => setStep(2)}
              className="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg font-medium hover:bg-gray-300 transition-colors"
            >
              {isMechanic ? 'Cancelar' : 'Atrás'}
            </button>
            <button
              onClick={() => handleFinalSubmit()}
              className="flex-1 bg-green-600 text-white py-3 rounded-lg font-medium hover:bg-green-700 transition-colors flex items-center justify-center gap-2"
            >
