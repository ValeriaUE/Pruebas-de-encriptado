// Logo cacheado para los PDF (se sirve desde Storage del SW estando offline).
let _logoDataUrlCache: string | null = null;
const getLogoDataUrl = async (): Promise<string | null> => {
  if (_logoDataUrlCache) return _logoDataUrlCache;
  try {
    const r = await fetch('logo-neumaticos.png');
    const b = await r.blob();
    _logoDataUrlCache = await new Promise<string | null>((resolve) => {
      const fr = new FileReader();
      fr.onloadend = () => resolve(fr.result as string);
      fr.onerror = () => resolve(null);
      fr.readAsDataURL(b);
    });
    return _logoDataUrlCache;
  } catch (e) { return null; }
};

// Datos de contacto por sucursal (fuente: fullneumaticos.cl/sucursales.php).
interface BranchContact { name: string; address: string; comuna: string; phone: string; hours: string[]; }
const _HOURS_STD = ['Lun a Mié: 09:00–18:30', 'Jue: 09:00–17:30', 'Vie: 09:00–17:00', 'Sáb: 09:00–13:00'];
const BRANCH_CONTACTS: Record<string, BranchContact> = {
  parron: { name: 'El Parrón · Casa Matriz', address: 'Av. El Parrón 199', comuna: 'La Cisterna, Santiago', phone: '+569 6769 4184', hours: _HOURS_STD },
  julio: { name: 'Sucursal 10 de Julio', address: 'Av. 10 de Julio 1042-1046', comuna: 'Santiago Centro', phone: '+569 5769 5789', hours: _HOURS_STD },
  quilin: { name: 'Sucursal Mall Paseo Quilín', address: 'Av. Américo Vespucio 3400', comuna: 'Peñalolén', phone: '+569 5178 4872', hours: ['Lun a Vie: 09:00–20:00', 'Sáb: 09:00–19:00', 'Dom: 09:00–18:00'] },
  concepcion: { name: 'Sucursal Concepción', address: 'Av. Los Carrera 415', comuna: 'Concepción', phone: '+569 7377 8957', hours: _HOURS_STD },
};
const getBranchContact = (branch: string): BranchContact => {
  const k = (branch || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
  if (k.includes('parron')) return BRANCH_CONTACTS.parron;
  if (k.includes('julio')) return BRANCH_CONTACTS.julio;
  if (k.includes('quilin')) return BRANCH_CONTACTS.quilin;
  if (k.includes('concepcion')) return BRANCH_CONTACTS.concepcion;
  return BRANCH_CONTACTS.parron; // Administración / Oficina Central → Casa Matriz
};

const generateInspectionPDF = async (
  inspection: Inspection,
  vehicle: Vehicle,
  qrCodeDataUrl?: string,
  hidePrices?: boolean
): Promise<jsPDF> => {
  // Regla de la empresa: el PDF del cliente no lleva montos (el Admin Global puede
  // reactivarlos desde Usuarios → Configuración).
  if (pdfHidesInspectionPrices()) hidePrices = true;
  const doc = new jsPDF();
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();

  // Colors
  const primaryColor: [number, number, number] = [37, 99, 235]; // Blue-600
  const textColor: [number, number, number] = [31, 41, 55]; // Gray-800
  const lightGray: [number, number, number] = [243, 244, 246]; // Gray-100

  let yPos = 20;

  // ---- Encabezado: logo + contacto de la sucursal ----
  const contact = getBranchContact(inspection.branch);
  const logo = await getLogoDataUrl();

  if (logo) {
    const lw = 52; const lh = lw * (946 / 2978); // conserva proporción del logo
    try { doc.addImage(logo, 'PNG', 12, 9, lw, lh); } catch (e) { /* logo inválido */ }
  } else {
    doc.setTextColor(...primaryColor);
    doc.setFontSize(20); doc.setFont('helvetica', 'bold');
    doc.text('FULL NEUMÁTICOS', 12, 22);
  }

  // Contacto de la sucursal, alineado a la derecha
  const rx = pageWidth - 14;
  doc.setTextColor(...primaryColor);
  doc.setFontSize(11); doc.setFont('helvetica', 'bold');
  doc.text(contact.name, rx, 13, { align: 'right' });
  doc.setTextColor(...textColor);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
  doc.text(contact.address, rx, 18.5, { align: 'right' });
  doc.text(contact.comuna, rx, 22.5, { align: 'right' });
  doc.setFont('helvetica', 'bold');
  doc.text(`Tel: ${contact.phone}`, rx, 26.5, { align: 'right' });

  // Línea de acento + subtítulo
  doc.setDrawColor(...primaryColor); doc.setLineWidth(0.8);
  doc.line(12, 33, pageWidth - 12, 33);
  doc.setLineWidth(0.2);
  doc.setTextColor(...primaryColor);
  doc.setFontSize(10); doc.setFont('helvetica', 'bold');
  doc.text('REPORTE DE INSPECCIÓN VEHICULAR', 12, 39);

  // Horario de la sucursal (compacto)
  doc.setTextColor(107, 114, 128);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5);
  const hoursLine = 'Horario: ' + contact.hours.join('   ·   ');
  const hoursSplit = doc.splitTextToSize(hoursLine, pageWidth - 24);
  doc.text(hoursSplit, 12, 44);
  yPos = 44 + hoursSplit.length * 3.4 + 5;

  // Caja de información de la inspección
  doc.setFillColor(...lightGray);
  doc.rect(10, yPos, pageWidth - 20, 25, 'F');

  doc.setTextColor(...textColor);
  doc.setFontSize(10);
  doc.setFont('helvetica', 'bold');
  doc.text(`Inspección #${inspection.id}`, 15, yPos + 7);

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9);
  const inspectionDate = new Date(inspection.date).toLocaleDateString('es-ES', {
    year: 'numeric',
    month: 'long',
    day: 'numeric',
    hour: '2-digit',
    minute: '2-digit'
  });
  doc.text(`Fecha: ${inspectionDate}`, 15, yPos + 14);
  doc.text(`Mecánico: ${inspection.mechanic}`, 15, yPos + 20);
  doc.text(`Sucursal: ${inspection.branch}`, pageWidth / 2 + 5, yPos + 14);
  const _tipo = (inspection.serviceTypes || []).join(', ');
  if (_tipo) {
    const _tipoLines = doc.splitTextToSize(`Servicios: ${_tipo}`, pageWidth / 2 - 25);
    doc.text(_tipoLines, pageWidth / 2 + 5, yPos + 20);
  }

  yPos += 35;

  // Vehicle information (solo los campos que tienen dato)
  const vehRows: [string, string][] = [];
  const addVeh = (label: string, val?: string) => {
    const s = (val == null ? '' : String(val)).trim();
    if (s && s.toUpperCase() !== 'N/A') vehRows.push([label, s]);
  };
  addVeh('Patente', vehicle.licensePlate);
  addVeh('Cliente', vehicle.clientName);
  addVeh('Teléfono', vehicle.phoneNumber);
  addVeh('Email', vehicle.email);
  addVeh('Modelo', vehicle.vehicleModel);
  addVeh('Kilometraje', (vehicle as any).mileage);
  addVeh('Medida llanta/neumático', inspection.tireRimSize || vehicle.tireRimSize);
  addVeh('Presión recomendada', inspection.recommendedAirPressure || vehicle.recommendedAirPressure);
  addVeh('Aceite de motor', inspection.engineOil || vehicle.engineOil);
  addVeh('Notas', vehicle.notes);

  if (vehRows.length) {
    doc.setFontSize(12);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(...primaryColor);
    doc.text('DATOS DEL VEHÍCULO', 10, yPos);
    yPos += 8;

    autoTable(doc, {
      startY: yPos,
      head: [['Campo', 'Información']],
      body: vehRows,
      theme: 'grid',
      headStyles: { fillColor: primaryColor, textColor: [255, 255, 255] },
      margin: { left: 10, right: 10 },
      styles: { fontSize: 9 },
    });

    yPos = doc.lastAutoTable.finalY + 10;
  }

  // Inspection checklist con barras (solo los componentes realmente medidos)
  const components = [
    { name: 'Neumáticos Delanteros', value: inspection.frontTiresCondition, color: [59, 130, 246] },
    { name: 'Neumáticos Traseros', value: inspection.rearTiresCondition, color: [59, 130, 246] },
    { name: 'Frenos Delanteros', value: inspection.frontBrakesCondition, color: [34, 197, 94] },
    { name: 'Frenos Traseros', value: inspection.rearBrakesCondition, color: [34, 197, 94] },
  ].filter((c) => typeof c.value === 'number' && (c.value as number) >= 0);

  if (components.length) {
    doc.setFontSize(12);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(...primaryColor);
    doc.text('ESTADO DE COMPONENTES', 10, yPos);
    yPos += 8;

    components.forEach((component) => {
      doc.setTextColor(...textColor);
      doc.setFontSize(9);
      doc.setFont('helvetica', 'normal');
      doc.text(component.name, 15, yPos);
      doc.setFillColor(229, 231, 235);
      doc.rect(80, yPos - 3, 80, 5, 'F');
      const barWidth = ((component.value as number) / 100) * 80;
      doc.setFillColor(...(component.color as [number, number, number]));
      doc.rect(80, yPos - 3, barWidth, 5, 'F');
      doc.setFont('helvetica', 'bold');
      doc.text(`${component.value}%`, 165, yPos);
      yPos += 8;
    });
    yPos += 5;
  }

  // Additional components (solo los que tienen dato)
  const extraRows: [string, string][] = [];
  const pushExtra = (label: string, val?: string) => {
    const s = (val == null ? '' : String(val)).trim();
    if (s && s.toUpperCase() !== 'N/A') extraRows.push([label, s]);
  };
  pushExtra('Tren delantero', inspection.suspensionCondition);
  pushExtra('Alternador', inspection.alternatorStatus);
  pushExtra('Batería', inspection.batteryStatus);
  pushExtra('Luces', inspection.lightsStatus);
  pushExtra('Correa de Accesorios', inspection.accessoryBelt);
  pushExtra('Niveles de Fluidos', inspection.fluidLevels);

  if (extraRows.length) {
    autoTable(doc, {
      startY: yPos,
      head: [['Componente', 'Estado']],
      body: extraRows,
      theme: 'grid',
      headStyles: { fillColor: primaryColor, textColor: [255, 255, 255] },
      margin: { left: 10, right: 10 },
      styles: { fontSize: 9 },
    });
    yPos = (doc as any).lastAutoTable.finalY + 10;
  }

  // Check if we need a new page
  if (yPos > pageHeight - 60) {
    doc.addPage();
    yPos = 20;
  }

  // Notes section
  if (inspection.additionalNotes) {
    doc.setFontSize(12);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(...primaryColor);
    doc.text('NOTAS ADICIONALES', 10, yPos);
    yPos += 8;

    doc.setFontSize(9);
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(...textColor);
    const splitNotes = doc.splitTextToSize(inspection.additionalNotes, pageWidth - 20);
    doc.text(splitNotes, 10, yPos);
    yPos += splitNotes.length * 5 + 10;
  }

  // Photos section — incrusta las fotos reales tomadas en la inspección.
  const photoEntries = Object.entries(inspection.photos).filter(
    ([, v]) => typeof v === 'string' && v
  ) as [string, string][];
  if (photoEntries.length > 0) {
    const loadImgDims = (dataUrl: string): Promise<{ w: number; h: number } | null> =>
      new Promise((resolve) => {
        const im = new Image();
        im.onload = () => resolve({ w: im.naturalWidth, h: im.naturalHeight });
        im.onerror = () => resolve(null);
        im.src = dataUrl;
      });
    const photoLabels: Record<string, string> = {
      vehicle: 'Vehículo',
      frontTires: 'Neumáticos Delanteros',
      rearTires: 'Neumáticos Traseros',
      frontBrakes: 'Frenos Delanteros',
      rearBrakes: 'Frenos Traseros',
      oldParts: 'Piezas Viejas',
      newParts: 'Piezas Nuevas',
    };

    if (yPos > pageHeight - 40) { doc.addPage(); yPos = 20; }
    doc.setFontSize(12);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(...primaryColor);
    doc.text('FOTOGRAFÍAS', 10, yPos);
    yPos += 8;

    const marginX = 10;
    const gap = 8;
    const colW = (pageWidth - marginX * 2 - gap) / 2;
    const maxImgH = 55;
    const labelH = 6;
    let col = 0;
    let rowTop = yPos;
    let rowMaxH = 0;

    // Las fotos pueden ser data URLs (antiguas) o URLs de Storage (nuevas).
    // jsPDF necesita los datos de la imagen, así que las URL se descargan a data URL.
    const toDataUrl = async (val: string): Promise<string | null> => {
      if (typeof val !== 'string' || !val) return null;
      if (val.indexOf('data:') === 0) return val;
      try {
        const r = await fetch(val);
        const b = await r.blob();
        return await new Promise<string | null>((resolve) => {
          const fr = new FileReader();
          fr.onloadend = () => resolve(fr.result as string);
          fr.onerror = () => resolve(null);
          fr.readAsDataURL(b);
        });
      } catch (e) { return null; }
    };

    for (const [key, rawVal] of photoEntries) {
      const dataUrl = await toDataUrl(rawVal);
      if (!dataUrl) continue;
      const dims = await loadImgDims(dataUrl);
      let w = colW;
      let h = maxImgH;
      if (dims && dims.w && dims.h) {
        const ratio = Math.min(colW / dims.w, maxImgH / dims.h);
        w = dims.w * ratio;
        h = dims.h * ratio;
      }
      const cellH = h + labelH + 4;
      if (col === 0 && rowTop + cellH > pageHeight - 15) {
        doc.addPage();
        rowTop = 20;
        rowMaxH = 0;
      }
      const x = marginX + col * (colW + gap);
      const imgX = x + (colW - w) / 2;
      const fmt = /^data:image\/png/i.test(dataUrl) ? 'PNG' : 'JPEG';
      try { doc.addImage(dataUrl, fmt, imgX, rowTop, w, h); } catch (e) { /* imagen inválida */ }
      doc.setFontSize(8);
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(107, 114, 128);
      doc.text(photoLabelFor(key), x + colW / 2, rowTop + h + 4, { align: 'center' });
      rowMaxH = Math.max(rowMaxH, cellH);
      col++;
      if (col === 2) { col = 0; rowTop += rowMaxH + 4; rowMaxH = 0; }
    }
    if (col === 1) rowTop += rowMaxH + 4;
    yPos = rowTop + 6;
  }

  // Recommendations section
  doc.setFontSize(12);
  doc.setFont('helvetica', 'bold');
  doc.setTextColor(...primaryColor);
  doc.text('RECOMENDACIONES', 10, yPos);
  yPos += 8;

  // Recomendaciones (según los componentes que sí se midieron)
  const recommendations = [];
  const _ft = inspection.frontTiresCondition, _rt = inspection.rearTiresCondition;
  const _fb = inspection.frontBrakesCondition, _rb = inspection.rearBrakesCondition;
  if ((_ft >= 0 && _ft < 40) || (_rt >= 0 && _rt < 40)) {
    recommendations.push('• Cambio de neumáticos recomendado');
  }
  if ((_fb >= 0 && _fb < 40) || (_rb >= 0 && _rb < 40)) {
    recommendations.push('• Revisión y/o cambio de frenos necesario');
  }
  if (inspection.lightsStatus === 'Not OK') {
    recommendations.push('• Reparación del sistema de iluminación');
  }
  if (inspection.accessoryBelt === 'Not OK') {
    recommendations.push('• Cambio de correa de accesorios');
  }

  if (recommendations.length === 0) {
    recommendations.push('• Vehículo en condiciones óptimas');
    recommendations.push('• Continuar con mantenimiento preventivo regular');
  }

  doc.setFontSize(9);
  doc.setFont('helvetica', 'normal');
  doc.setTextColor(...textColor);
  recommendations.forEach((rec) => {
    doc.text(rec, 15, yPos);
    yPos += 6;
  });

  yPos += 10;

  // Desglose de tareas (servicio + insumo + cantidad). Se omite en el reporte técnico del mecánico.
  const _pdfTasks = Array.isArray(inspection.tasks) ? inspection.tasks : [];
  if (!hidePrices && _pdfTasks.length) {
    if (yPos > pageHeight - 60) { doc.addPage(); yPos = 20; }
    doc.setFontSize(12);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(...primaryColor);
    doc.text('DETALLE DE TAREAS', 10, yPos);
    yPos += 8;

    const fmt = (n: number) => '$' + Math.round(n || 0).toLocaleString('es-CL');
    const body = _pdfTasks.map((t) => {
      const qty = Math.max(1, Number(t.qty) || 1);
      const det = [t.positions && t.positions.length ? t.positions.join(', ') : '', t.detail || ''].filter(Boolean).join(' · ');
      return [
        t.service + (det ? `\n${det}` : ''),
        t.mechanic || 'Sin asignar',
        String(qty),
        fmt(t.servicePrice || 0),
        fmt(t.suppliesPrice || 0),
        fmt(((Number(t.servicePrice) || 0) + (Number(t.suppliesPrice) || 0)) * qty),
      ];
    });
    autoTable(doc, {
      startY: yPos,
      head: [['Tarea', 'Mecánico', 'Cant.', 'P. Servicio', 'P. Insumo', 'Subtotal']],
      body,
      theme: 'grid',
      headStyles: { fillColor: primaryColor, textColor: [255, 255, 255], fontSize: 8 },
      bodyStyles: { fontSize: 8 },
      columnStyles: { 2: { halign: 'center' }, 3: { halign: 'right' }, 4: { halign: 'right' }, 5: { halign: 'right' } },
      margin: { left: 10, right: 10 },
    });
    yPos = (doc as any).lastAutoTable.finalY + 8;
  }

  // Service cost (omitted on the mechanic's technical report — condition only).
  if (!hidePrices) {
    doc.setFillColor(...lightGray);
    doc.rect(10, yPos, pageWidth - 20, 15, 'F');

    doc.setFontSize(11);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(...textColor);
    doc.text('MONTO DEL SERVICIO:', 15, yPos + 10);
    doc.setTextColor(34, 197, 94);
    doc.setFontSize(14);
    doc.text(`$${inspection.amountCharged.toLocaleString()}`, pageWidth - 15, yPos + 10, { align: 'right' });

    yPos += 25;
  } else {
    yPos += 5;
  }

  // Signature section
  if (yPos > pageHeight - 50) {
    doc.addPage();
    yPos = 20;
  }

  doc.setDrawColor(200, 200, 200);
  doc.line(15, yPos, 90, yPos);
  doc.line(pageWidth - 90, yPos, pageWidth - 15, yPos);

  doc.setFontSize(9);
  doc.setFont('helvetica', 'normal');
  doc.setTextColor(...textColor);
  doc.text('Firma del Mecánico', 15, yPos + 6);
  doc.text('Firma del Cliente', pageWidth - 90, yPos + 6);

  // Footer
  const footerY = pageHeight - 15;
  doc.setFontSize(8);
  doc.setTextColor(107, 114, 128);
  doc.setFont('helvetica', 'italic');
  doc.text(
    'Full Neumáticos - Reporte generado automáticamente',
    pageWidth / 2,
    footerY,
    { align: 'center' }
  );
  doc.text(
    new Date().toLocaleDateString('es-ES'),
    pageWidth / 2,
    footerY + 4,
    { align: 'center' }
  );

  return doc;
};

const generateQRCode = async (inspectionId: string, hidePrices?: boolean): Promise<string> => {
  const url = `${window.location.origin}${window.location.pathname}?inspection=${inspectionId}${hidePrices ? '&noprice=1' : ''}`;
  return await QRCode.toDataURL(url, {
    width: 300,
    margin: 2,
    color: {
      dark: '#2563eb',
      light: '#ffffff',
    },
  });
};

const generateInspectionReport = async (
  inspection: Inspection,
  vehicle: Vehicle,
  hidePrices?: boolean
): Promise<{ pdf: jsPDF; qrCode: string; shareUrl: string }> => {
  const qrCode = await generateQRCode(inspection.id, hidePrices);
  const pdf = await generateInspectionPDF(inspection, vehicle, qrCode, hidePrices);
  const shareUrl = `${window.location.origin}${window.location.pathname}?inspection=${inspection.id}${hidePrices ? '&noprice=1' : ''}`;

  return { pdf, qrCode, shareUrl };
};

const QUOTE_PRIMARY: [number, number, number] = [37, 99, 235];
const QUOTE_TEXT: [number, number, number] = [31, 41, 55];
const QUOTE_LIGHT: [number, number, number] = [243, 244, 246];

const fmtDateEs = (value: string): string => {
  if (!value) return '';
  const iso = value.length === 10 ? value + 'T00:00:00' : value;
  return new Date(iso).toLocaleDateString('es-ES', { day: '2-digit', month: 'long', year: 'numeric' });
};

// Render the quote body onto an existing jsPDF doc starting at startY. Returns the new yPos.
const renderQuoteSection = (doc: jsPDF, quote: Quote, startY: number): number => {
  const pageWidth = doc.internal.pageSize.getWidth();
  let yPos = startY;

  // Title band
  doc.setFillColor(...QUOTE_PRIMARY);
  doc.rect(10, yPos, pageWidth - 20, 12, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(12);
  doc.setFont('helvetica', 'bold');
  doc.text(`COTIZACIÓN ${quote.number}`, 14, yPos + 8);
  doc.setFontSize(9);
  doc.setFont('helvetica', 'normal');
  doc.text(`Emisión: ${fmtDateEs(quote.issueDate)}   ·   Válida hasta: ${fmtDateEs(quote.validUntil)}`, pageWidth - 14, yPos + 8, { align: 'right' });
  yPos += 18;

  // Client / vehicle box
  autoTable(doc, {
    startY: yPos,
    head: [['Cliente', 'Detalle']],
    body: [
      ['Patente', quote.licensePlate],
      ['Cliente', quote.clientName || 'N/A'],
      ['Teléfono', quote.phoneNumber || 'N/A'],
      ['Correo', quote.email || 'N/A'],
      ['Vehículo', quote.vehicleModel || 'N/A'],
    ],
    theme: 'grid',
    headStyles: { fillColor: QUOTE_PRIMARY, textColor: [255, 255, 255] },
    margin: { left: 10, right: 10 },
    styles: { fontSize: 9 },
  });
  yPos = (doc as any).lastAutoTable.finalY + 8;

  // Items table
  const _hideQ = pdfHidesQuotePrices();
  const body = quote.items.map(it => {
    const lineTotal = (Number(it.qty) || 0) * (Number(it.unitPrice) || 0);
    return [
      it.description || '',
      String(it.qty || 0),
      pdfMoney(it.unitPrice || 0, _hideQ),
      pdfMoney(lineTotal, _hideQ),
    ];
  });
  autoTable(doc, {
    startY: yPos,
    head: [['Descripción', 'Cant.', 'P. Unitario', 'Total']],
    body,
    theme: 'striped',
    headStyles: { fillColor: QUOTE_PRIMARY, textColor: [255, 255, 255] },
    columnStyles: {
      1: { halign: 'center', cellWidth: 18 },
      2: { halign: 'right', cellWidth: 32 },
      3: { halign: 'right', cellWidth: 32 },
    },
    margin: { left: 10, right: 10 },
    styles: { fontSize: 9 },
  });
  yPos = (doc as any).lastAutoTable.finalY + 6;

  // Totals
  const sub = quoteSubtotal(quote);
  const iva = quoteIva(quote);
  const tot = quoteTotal(quote);
  const labelX = pageWidth - 70;
  const valX = pageWidth - 14;
  doc.setFontSize(9);
  doc.setFont('helvetica', 'normal');
  doc.setTextColor(...QUOTE_TEXT);
  doc.text('Subtotal', labelX, yPos); doc.text(pdfMoney(sub, _hideQ), valX, yPos, { align: 'right' }); yPos += 6;
  doc.text('IVA (19%)', labelX, yPos); doc.text(pdfMoney(iva, _hideQ), valX, yPos, { align: 'right' }); yPos += 7;
  doc.setFillColor(...QUOTE_LIGHT);
  doc.rect(labelX - 4, yPos - 5, valX - labelX + 8, 9, 'F');
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(11);
  doc.text('TOTAL', labelX, yPos + 1);
  doc.setTextColor(34, 197, 94);
  doc.text(pdfMoney(tot, _hideQ), valX, yPos + 1, { align: 'right' });
  yPos += 12;

  // Notes
  if (quote.notes) {
    doc.setTextColor(...QUOTE_PRIMARY);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(10);
    doc.text('OBSERVACIONES', 10, yPos); yPos += 6;
    doc.setTextColor(...QUOTE_TEXT);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    const split = doc.splitTextToSize(quote.notes, pageWidth - 20);
    doc.text(split, 10, yPos);
    yPos += split.length * 5 + 4;
  }
  return yPos;
};

// Standalone branded quote PDF.
const generateQuotePDF = (quote: Quote): jsPDF => {
  const doc = new jsPDF();
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();

  // Header band
  doc.setFillColor(...QUOTE_PRIMARY);
  doc.rect(0, 0, pageWidth, 40, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(24);
  doc.setFont('helvetica', 'bold');
  doc.text('FULL NEUMÁTICOS', pageWidth / 2, 20, { align: 'center' });
  doc.setFontSize(10);
  doc.setFont('helvetica', 'normal');
  doc.text('Cotización de Servicios', pageWidth / 2, 30, { align: 'center' });

  renderQuoteSection(doc, quote, 50);

  // Footer
  const footerY = pageHeight - 12;
  doc.setFontSize(8);
  doc.setTextColor(107, 114, 128);
  doc.setFont('helvetica', 'italic');
  doc.text('Full Neumáticos · Documento generado automáticamente', pageWidth / 2, footerY, { align: 'center' });
  return doc;
};

// Append a payment-receipt page (comprobante) to an existing doc.
const appendReceiptPage = (doc: jsPDF, quote: Quote): void => {
  const p = quote.payment;
  if (!p) return;
  const pageWidth = doc.internal.pageSize.getWidth();
  doc.addPage();
  doc.setFillColor(...QUOTE_PRIMARY);
  doc.rect(0, 0, pageWidth, 18, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(13);
  doc.setFont('helvetica', 'bold');
  doc.text('COMPROBANTE DE PAGO', pageWidth / 2, 12, { align: 'center' });

  let yPos = 28;
  autoTable(doc, {
    startY: yPos,
    body: [
      ['Cotización', quote.number],
      ['Patente', quote.licensePlate],
      ['Cliente', quote.clientName || 'N/A'],
      ['Monto pagado', pdfMoney(p.amount, pdfHidesQuotePrices())],
      ['Método de pago', p.method || 'N/A'],
      ['Registrado por', p.registeredBy],
      ['Fecha de pago', new Date(p.registeredAt).toLocaleString('es-ES')],
    ],
    theme: 'grid',
    margin: { left: 10, right: 10 },
    styles: { fontSize: 9 },
    columnStyles: { 0: { fontStyle: 'bold', cellWidth: 50 } },
  });
  yPos = (doc as any).lastAutoTable.finalY + 8;

  if (p.receiptImage && /^data:image\//.test(p.receiptImage)) {
    try {
      const fmt = /png/i.test(p.receiptImage) ? 'PNG' : 'JPEG';
      const props = (doc as any).getImageProperties(p.receiptImage);
      const maxW = pageWidth - 20;
      const maxH = doc.internal.pageSize.getHeight() - yPos - 20;
      let w = props.width, h = props.height;
      const ratio = Math.min(maxW / w, maxH / h, 1);
      w = w * ratio; h = h * ratio;
      doc.addImage(p.receiptImage, fmt, (pageWidth - w) / 2, yPos, w, h);
    } catch (e) { /* ignore image errors */ }
  } else if (p.receiptName) {
    doc.setTextColor(...QUOTE_TEXT);
    doc.setFontSize(9);
    doc.text(`Comprobante adjunto: ${p.receiptName}`, 10, yPos);
  }
};

// Client package: technical evaluation + (optional) quote + (optional) comprobante, all in one PDF.
const generateClientPackagePDF = async (
  inspection: Inspection,
  vehicle: Vehicle,
  quote: Quote | null
): Promise<jsPDF> => {
  const { pdf } = await generateInspectionReport(inspection, vehicle);
  if (quote) {
    pdf.addPage();
    renderQuoteSection(pdf, quote, 20);
    if (quote.payment) appendReceiptPage(pdf, quote);
  }
  return pdf;
};


/* ===== ShareReportModal ===== */

interface ShareReportModalProps {
  inspection: Inspection;
  vehicle: Vehicle;
  onClose: () => void;
}

function ShareReportModal({ inspection, vehicle, onClose }: ShareReportModalProps) {
  const [qrCode, setQrCode] = useState<string>('');
  const [shareUrl, setShareUrl] = useState<string>('');
  const [loading, setLoading] = useState(true);
  const [copied, setCopied] = useState(false);
  // El reporte de solo condición del vehículo nunca muestra precios. Los mecánicos
  // siempre comparten sin precios; ventas/admin pueden activar "sin precios" con el toggle.
  const [hidePrices, setHidePrices] = useState(getCurrentUser()?.role === 'mechanic');
  const canTogglePrices = getCurrentUser()?.role !== 'mechanic';

  useEffect(() => {
    generateData();
  }, [hidePrices]);

  const generateData = async () => {
    try {
      const { qrCode: qr, shareUrl: url } = await generateInspectionReport(inspection, vehicle, hidePrices);
      setQrCode(qr);
      setShareUrl(url);
    } catch (error) {
      toast.error('Error al generar el reporte');
      console.error(error);
    } finally {
      setLoading(false);
    }
  };

  const handleDownloadPDF = async () => {
    try {
      const { pdf } = await generateInspectionReport(inspection, vehicle, hidePrices);
      pdf.save(`Inspeccion_${vehicle.licensePlate}_${inspection.id}.pdf`);
      toast.success('PDF descargado');
    } catch (error) {
      toast.error('Error al generar PDF');
      console.error(error);
    }
  };

  const plateQuotes = getQuotesByPlate(vehicle.licensePlate);
  const latestQuote = plateQuotes.length > 0 ? plateQuotes[0] : null;

  const handleDownloadPackage = async () => {
    try {
      const pdf = await generateClientPackagePDF(inspection, vehicle, latestQuote);
      pdf.save(`Informe_Cliente_${vehicle.licensePlate}.pdf`);
      toast.success('Paquete completo descargado');
    } catch (error) {
      toast.error('Error al generar el paquete');
      console.error(error);
    }
  };

  const handleDownloadQR = () => {
    const link = document.createElement('a');
    link.href = qrCode;
    link.download = `QR_Inspeccion_${vehicle.licensePlate}.png`;
    link.click();
    toast.success('QR descargado');
  };

  const handleCopyLink = async () => {
    try {
      await navigator.clipboard.writeText(shareUrl);
      setCopied(true);
      toast.success('Enlace copiado');
      setTimeout(() => setCopied(false), 2000);
    } catch (error) {
      toast.error('Error al copiar enlace');
    }
  };

  const handleShareWhatsApp = () => {
    const message = `Inspección vehicular - ${vehicle.licensePlate}\n${vehicle.clientName}\n\nVer reporte completo: ${shareUrl}`;
    const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;
    window.open(whatsappUrl, '_blank');

  return (
    <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-lg shadow-xl max-w-md w-full max-h-[90vh] overflow-y-auto">
        <div className="sticky top-0 bg-white border-b border-gray-200 p-4 flex items-center justify-between">
          <h3 className="text-lg font-semibold text-gray-900">Compartir Reporte</h3>
          <button
            onClick={onClose}
            className="p-2 hover:bg-gray-100 rounded-lg transition-colors"
          >
            <X className="w-5 h-5 text-gray-500" />
          </button>
        </div>

        <div className="p-4 space-y-6">
          {/* Inspection Info */}
          <div className="bg-blue-50 rounded-lg p-4 border border-blue-200">
            <p className="text-sm font-medium text-blue-900">Inspección #{inspection.id}</p>
            <p className="text-lg font-bold text-blue-900 mt-1">{vehicle.licensePlate}</p>
            <p className="text-sm text-blue-700">{vehicle.clientName}</p>
            <p className="text-xs text-blue-600 mt-1">
              {new Date(inspection.date).toLocaleDateString('es-ES')} • {inspection.mechanic}
            </p>
          </div>

          {/* QR Code */}
          {loading ? (
            <div className="flex items-center justify-center py-8">
              <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600" />
            </div>
          ) : (
            <>
              <div className="text-center">
                <p className="text-sm font-medium text-gray-700 mb-3">
                  Código QR para acceso rápido
                </p>
                <div className="bg-white border-4 border-blue-600 rounded-lg p-4 inline-block">
                  <img src={qrCode} alt="QR Code" className="w-48 h-48" />
                </div>
                <p className="text-xs text-gray-500 mt-2">
                  Escanear para ver reporte completo
                </p>
              </div>

              {canTogglePrices && (
                <label className="flex items-start gap-2.5 bg-gray-50 border border-gray-200 rounded-lg p-3 cursor-pointer">
                  <input type="checkbox" checked={hidePrices} onChange={(e) => setHidePrices(e.target.checked)} className="rounded mt-0.5" />
                  <span className="text-sm text-gray-700">Informe de inspección sin precios

              {/* Share Options */}

                  </div>
                </button>

                <button
                  onClick={handleDownloadQR}
                  className="w-full flex items-center gap-3 p-4 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors"
                >
                  <Download className="w-5 h-5" />

                    <p className="font-medium">Descargar Código QR</p>

                >

                    <Check className="w-5 h-5 text-green-600" />

                    <LinkIcon className="w-5 h-5" />

                  <div className="flex-1 text-left">
                    <p className="font-medium">{copied ? 'Enlace copiado!' : 'Copiar enlace'}</p>
                    <p className="text-xs text-gray-600 truncate">{shareUrl}</p>
                  </div>
                </button>
              </div>

              {/* Info */}
              <div className="bg-gray-50 rounded-lg p-3 border border-gray-200">
                <div className="flex gap-2">
                  <Share2 className="w-4 h-4 text-gray-500 mt-0.5 shrink-0" />
                  <p className="text-xs text-gray-600">
                    El código QR y el enlace permiten acceder al reporte de inspección completo
                    con fotos y detalles técnicos. Ideal para compartir con clientes.
                  </p>
                </div>
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );

/* ===== ClientLine =====
   Datos del cliente junto a una inspección ya lista: nombre y modelo, y
   opcionalmente el contacto (teléfono / correo). */
function ClientLine({ plate, contact }: { plate: string; contact?: boolean }) {
  const v = getVehicle(plate);
  if (!v) return null;
  const contacto = [v.phoneNumber, v.email].filter(Boolean).join(' · ');
  return (
    <>
      <p className="text-sm text-gray-700 truncate">
        {v.clientName || 'Cliente sin nombre'}{v.vehicleModel ? ` · ${v.vehicleModel}` : ''}
      </p>
      {contact && contacto && <p className="text-xs text-gray-500 truncate">{contacto}</p>}
    </>
  );
}

/* ===== ServiceOrderSelector (mechanic picks a service order by plate + date) ===== */

function ServiceOrderSelector({ onSelectOrder, onCancel }: { onSelectOrder: (order: Inspection) => void; onCancel: () => void }) {
  const [searchTerm, setSearchTerm] = useState('');
  const [showCompleted, setShowCompleted] = useState(false);
  const _soUser = getCurrentUser();

  const orders = getInspections().filter(i => i.orderNumber)
    .filter(i => !isSaleCancelled(i))   // una venta cancelada cancela la inspección: no debe aparecerle al mecánico
    .filter(i => canSeeAllBranches(_soUser) || i.branch === _soUser?.branch)
    // Mechanics see orders where they have a task (assigned to them, libre, or unassigned);
    // not orders whose tasks all belong to other mechanics.
    .filter(i => {
      if (_soUser?.role !== 'mechanic') return true;
      const tks = orderTasks(i);
      if (tks.length) return tks.some(t => t.mechanicId === _soUser?.id || t.mechanicId === 'free' || t.mechanicId === '');
      return !i.mechanicId || i.mechanicId === 'free' || i.mechanicId === _soUser?.id;
    });
  const term = searchTerm.trim().toUpperCase();
  const df = useDateFilter();
  const filtered = orders
    .filter(o => df.match(o.serviceDate || o.date))
    .filter(o => {
      if (showCompleted) return true;
      // For mechanics, hide orders where they have no PENDING task left (even if the
      // whole order isn't closed because another mechanic's task is still pending).
      if (o.status === 'completado') return false;
      if (_soUser?.role === 'mechanic') {
        const tks = orderTasks(o);
        if (tks.length) return tks.some(t => (t.mechanicId === _soUser?.id || t.mechanicId === 'free' || t.mechanicId === '') && t.status !== 'completado');
      }
      return true;
    })
    .filter(o => {
      if (!term) return true;
      const v = getVehicle(o.licensePlate);
      return o.licensePlate.includes(term)
        || (o.orderNumber || '').toUpperCase().includes(term)
        || (v?.clientName || '').toUpperCase().includes(term);
    })
    .sort((a, b) => new Date(b.serviceDate || b.date).getTime() - new Date(a.serviceDate || a.date).getTime());

  return (
    <div className="p-4 pb-24 space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="text-2xl font-bold text-gray-900">Órdenes de Servicio</h2>
        <button onClick={onCancel} className="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">Cancelar</button>
      </div>
      <p className="text-gray-600">Busca por patente y selecciona la orden (por fecha) para realizar la evaluación técnica.</p>

      <div className="relative">
        <Search className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-5 h-5" />
        <input
          type="text"
          placeholder="Buscar por patente, N° de orden o cliente..."
          value={searchTerm}
          onChange={(e) => setSearchTerm(e.target.value)}
          className="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent uppercase"
        />
      </div>

      <label className="flex items-center gap-2 text-sm text-gray-600">
        <input type="checkbox" checked={showCompleted} onChange={(e) => setShowCompleted(e.target.checked)} className="rounded" />

      </label>

      <DateFilterBar f={df} />

      {filtered.length === 0 ? (
        <div className="text-center py-12">
          <FileText className="w-16 h-16 text-gray-300 mx-auto mb-4" />
          <p className="text-gray-500">{searchTerm ? 'No se encontraron órdenes' : 'No hay órdenes de servicio pendientes'}</p>
          <p className="text-sm text-gray-400 mt-2">Las órdenes las registra Admin de Ventas al ingresar el servicio.</p>
        </div>
      ) : (
        <CollapseList className="space-y-3" initial={5}>
          {filtered.map((o) => {
            const v = getVehicle(o.licensePlate);
            const done = o.status === 'completado';
            return (
              <button
                key={o.id}
                onClick={() => onSelectOrder(o)}
                disabled={done}
                className={`w-full bg-white rounded-lg shadow p-4 text-left transition-shadow ${done ? 'opacity-60 cursor-not-allowed' : 'hover:shadow-md'}`}
              >
                <div className="flex items-center justify-between">
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2 mb-1 flex-wrap">
                      <span className="text-xs font-semibold bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full">{o.orderNumber}</span>
                      <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${done ? 'bg-gray-200 text-gray-600' : 'bg-amber-100 text-amber-700'}`}>
                        {done ? 'Completada' : 'Pendiente'}
                      </span>
                      {o.mechanicId === 'free' && !done && (
                        <span className="text-xs px-2 py-0.5 rounded-full font-medium bg-blue-100 text-blue-700">Libre</span>
                      )}
                    </div>
                    <p className="font-bold text-lg text-gray-900">{o.licensePlate}</p>
                    <p className="text-gray-600 text-sm">{v?.clientName || ''} · {v?.vehicleModel || ''}</p>
                    <div className="flex items-center gap-2 text-sm text-gray-500 mt-1">
                      <Calendar className="w-4 h-4" />
                      {new Date(o.serviceDate || o.date).toLocaleDateString('es-ES', { day: '2-digit', month: 'long', year: 'numeric' })}
                    </div>
                    <p className="text-xs text-gray-500 mt-1">{(o.serviceTypes || []).join(', ')} · {formatCLP(o.amountCharged || 0)}</p>
                  </div>
                  {!done && <ArrowRight className="w-6 h-6 text-gray-400 shrink-0" />}
                </div>
              </button>
            );
          })}
        </CollapseList>
      )}
    </div>
  );
}

interface InspectionViewerProps {
  inspectionId: string;
  onClose: () => void;
  forceHidePrices?: boolean;
}

function InspectionViewer({ inspectionId, onClose, forceHidePrices }: InspectionViewerProps) {
  const [inspection, setInspection] = useState<any>(null);
  const [vehicle, setVehicle] = useState<any>(null);
  const [loading, setLoading] = useState(true);
  const [qrCode, setQrCode] = useState<string>('');
  const [shareUrl, setShareUrl] = useState<string>('');
  const [showQR, setShowQR] = useState(false);
  // Oculta precios si el reporte se compartió con ?noprice=1 o si se abre como informe interno.
  const hidePrices = forceHidePrices || new URLSearchParams(window.location.search).get('noprice') === '1';

  useEffect(() => {
    loadInspection();
  }, [inspectionId]);

  useEffect(() => {
    if (inspection && vehicle) {
      generateInspectionReport(inspection, vehicle, hidePrices)
        .then(({ qrCode: qr, shareUrl: url }) => { setQrCode(qr); setShareUrl(url); })
        .catch(() => {});
    }
  }, [inspection, vehicle]);

  const loadInspection = () => {
    const inspections = getInspections();
    const found = inspections.find(i => i.id === inspectionId);

    if (found) {
      setInspection(found);
      const vehicleData = getVehicle(found.licensePlate);
      setVehicle(vehicleData);
    }
    setLoading(false);
  };

  const handleDownloadPDF = async () => {
    if (!inspection || !vehicle) return;

    try {
      const { pdf } = await generateInspectionReport(inspection, vehicle, hidePrices);
      pdf.save(`Inspeccion_${vehicle.licensePlate}_${inspection.id}.pdf`);
      toast.success('PDF descargado');
    } catch (error) {
      toast.error('Error al generar PDF');
      console.error(error);
    }
  };

  if (loading) {
    return (
      <div className="min-h-screen bg-gray-50 flex items-center justify-center">
        <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600" />
      </div>
    );
  }

  if (!inspection || !vehicle) {
    return (
      <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4">
        <div className="bg-white rounded-lg shadow-lg p-8 text-center max-w-md">

          <p className="text-gray-600 mb-6">
            El reporte de inspección solicitado no está disponible.
          </p>
          <button
            onClick={onClose}
            className="bg-blue-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-blue-700 transition-colors"
          >
            Volver
          </button>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-gray-50">
      {/* Header */}
      <header className="bg-blue-600 text-white shadow-lg sticky top-0 z-10">
        <div className="px-4 py-4 flex items-center justify-between">
          <div className="flex items-center gap-3">
            <button

            <div>
              <h1 className="text-lg font-bold">Full Neumáticos</h1>

          </div>
          <div className="flex items-center gap-2">
            <button
              onClick={() => setShowQR(true)}

// Editor de metas (tiers) reutilizable: mantiene estado LOCAL mientras se escribe y
// confirma al salir del campo (onBlur) o al agregar/quitar. Evita escribir en
// almacenamiento y registrar auditoría en cada tecla. Soporta atajos 100%/120%/150%.
function GoalsEditor({ goals, onChange, accent = 'purple' }: { goals: CommissionGoal[]; onChange: (g: CommissionGoal[]) => void; accent?: string }) {
  const [local, setLocal] = React.useState<CommissionGoal[]>(goals && goals.length ? goals : []);
  // Resincroniza si el padre cambia el set de metas (p.ej. cambia de persona/rol).
  const sig = JSON.stringify(goals);
  React.useEffect(() => { setLocal(goals && goals.length ? goals : []); }, [sig]);
  const setField = (i: number, patch: Partial<CommissionGoal>) =>
    setLocal(prev => prev.map((g, idx) => idx === i ? { ...g, ...patch } : g));
  const commit = (next: CommissionGoal[]) => { setLocal(next); onChange(next); };
  const addGoal = (label?: string) => commit([...local, { label: label || `Meta ${local.length + 1}`, amount: 0 }]);
  const presets = ['100%', '120%', '150%'].filter(p => !local.some(g => g.label.trim() === p));
  return (
    <div className="space-y-2">
      {local.length === 0 && <p className="text-xs text-gray-400">Sin metas todavía. Agrega la primera (ej. 100%).</p>}
      {local.map((g, idx) => (
        <div key={idx} className="flex items-center gap-2">
          <input type="text" value={g.label}
            onChange={(e) => setField(idx, { label: e.target.value })}
            onBlur={() => onChange(local)}
            placeholder="Nivel (ej. 100%)"
            className={`w-28 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-${accent}-500 focus:border-transparent`} />
          <div className="relative flex-1">
            <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">$</span>
            <input type="number" min="0" value={g.amount || ''}
              onChange={(e) => setField(idx, { amount: parseInt(e.target.value) || 0 })}
              onBlur={() => onChange(local)}
              placeholder="Monto meta"
              className={`w-full pl-7 pr-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-${accent}-500 focus:border-transparent`} />
          </div>
          <button onClick={() => commit(local.filter((_, i) => i !== idx))}
            title="Quitar meta"
            className="p-2 rounded-lg text-gray-400 hover:bg-red-600 hover:text-white transition-colors shrink-0">
            <Trash2 className="w-4 h-4" />
          </button>
        </div>
      ))}
      <div className="flex flex-wrap gap-1.5">
        <button onClick={() => addGoal()}
          className={`bg-${accent}-50 text-${accent}-700 px-3 py-1.5 rounded-lg text-xs font-medium hover:bg-${accent}-100 transition-colors flex items-center gap-1`}>
          <Plus className="w-3.5 h-3.5" /> Agregar nivel
        </button>
        {presets.map(p => (
          <button key={p} onClick={() => addGoal(p)}
            className="bg-gray-100 text-gray-600 px-2.5 py-1.5 rounded-lg text-xs font-medium hover:bg-gray-200 transition-colors">
            + {p}
          </button>
        ))}
      </div>
    </div>
  );
}

function CommissionConfig() {
  const [version, setVersion] = useState(0);
  const refresh = () => setVersion(v => v + 1);
  const cfg = getCommissionConfig();
  // Sucursal en edición: '' = todas las sucursales (default que aplica si no hay una específica).
  const [cfgBranch, setCfgBranch] = useState('');

  const update = (role: string, rc: RoleCommission) => {
    const key = branchRoleKey(cfgBranch, role);
    const next = { ...getCommissionConfig(), [key]: rc };
    saveCommissionConfig(next);
    const bLabel = cfgBranch || 'Todas las sucursales';
    logAudit('Comisión', `Actualizó metas de ${COMMISSIONABLE_ROLES.find(r => r.value === role)?.label || role} · ${bLabel}`);
    refresh();
  };
  // Igual que update, pero con sucursal explícita ('' = por rol / todas las sucursales).
  const updateFor = (branchKey: string, role: string, rc: RoleCommission) => {
    const next = { ...getCommissionConfig(), [branchRoleKey(branchKey, role)]: rc };
    saveCommissionConfig(next);
    const bLabel = branchKey || 'Todas las sucursales';
    logAudit('Comisión', `Actualizó metas de ${COMMISSIONABLE_ROLES.find(r => r.value === role)?.label || role} · ${bLabel}`);
    refresh();
  };

  // Per-user custom goals
  const [userSearch, setUserSearch] = useState('');
  const userOv = getUserCommissions();
  const updateUserOv = (u: User, rc: Partial<RoleCommission> | null) => {
    const next = { ...getUserCommissions() };
    // Merge para conservar 'mode' / 'goals' al editar uno u otro.
    if (rc === null) { delete next[u.id]; } else { next[u.id] = { ...(next[u.id] || { enabled: true, goals: [] }), ...rc } as RoleCommission; }
    saveUserCommissions(next);
    logAudit('Comisión', rc === null ? `Quitó la configuración personalizada de ${u.name}` : `Actualizó la configuración de comisión de ${u.name}`);
    refresh();
  };
  const term = userSearch.trim().toLowerCase();
  const matchedUsers = term
    ? getUsers().filter(u => u.active !== false && ['mechanic', 'admin2', 'ventas', 'admin'].includes(u.role) &&
        (u.name.toLowerCase().includes(term) || u.email.toLowerCase().includes(term)))
    : [];

  // --- Asignación masiva de meta personal (misma meta a varias personas) ---
  const [bulkRole, setBulkRole] = useState('');
  const [bulkBranch, setBulkBranch] = useState('');
  const [bulkSources, setBulkSources] = useState<{ personal: boolean; role: boolean; branch: boolean }>({ personal: true, role: false, branch: false });
  const [bulkReviewDay, setBulkReviewDay] = useState(1);
  const [bulkGoals, setBulkGoals] = useState<CommissionGoal[]>([{ label: 'Meta 1', amount: 0 }]);
  const [bulkSelected, setBulkSelected] = useState<string[]>([]);
  const bulkCandidates = getUsers().filter(u => u.active !== false
    && ['mechanic', 'admin2', 'ventas', 'admin'].includes(u.role)
    && (!bulkRole || u.role === bulkRole)
    && (!bulkBranch || u.branch === bulkBranch));
  const toggleBulk = (id: string) => setBulkSelected(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
  const applyBulkGoals = () => {
    const ids = bulkSelected.filter(id => bulkCandidates.some(u => u.id === id));
    if (ids.length === 0) { toast.error('Selecciona al menos una persona'); return; }
    const goals = bulkGoals.filter(g => (g.amount || 0) > 0 || g.label.trim());
    if (bulkSources.personal && goals.length === 0) { toast.error('Define al menos una meta personal'); return; }
    const next = { ...getUserCommissions() };
    for (const id of ids) next[id] = { sources: bulkSources, enabled: true, goals, reviewDay: bulkReviewDay };
    saveUserCommissions(next);
    logAudit('Comisión', `Asignó la misma meta personal a ${ids.length} persona(s)`);
    toast.success(`Meta personal aplicada a ${ids.length} persona(s)`);
    setBulkSelected([]);
    refresh();
  };
  const usersWithOv = getUsers().filter(u => userOv[u.id]);
  // Pestaña activa: los TRES tipos de meta (por rol / por sucursal / personal).

                  <GoalsEditor goals={goals} onChange={(ng) => updateUserOv(u, { enabled: true, goals: ng, reviewDay })} />

            );
          })}
        </div>
      </div>
      )}
    </div>
  );
}


function CommissionProgress() {
  const user = getCurrentUser();
  const views = getCommissionViews(user);
  if (views.length === 0) return null;
  const monthName = new Date().toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });

  return (
    <div className="space-y-4">
      {views.map((view) => {
        const goals = view.goals;
        const achieved = view.achieved;
        const topGoal = goals[goals.length - 1];
        const maxAmount = topGoal.amount || 1;
        const pct = Math.min(100, (achieved / maxAmount) * 100);
        const nextGoal = goals.find(g => achieved < g.amount);
        const isPersonal = view.scope === 'personal';
        const isBranch = view.scope === 'branch';
        const accent = isBranch ? 'blue' : view.scope === 'role' ? 'emerald' : 'purple';
        const badge = isPersonal ? 'Meta personal' : isBranch ? 'Meta de sucursal' : 'Meta por rol';
        return (
          <div key={view.scope} className={`bg-white rounded-lg shadow p-5 border-l-4 border-${accent}-400`}>
            <div className="flex items-center justify-between mb-1">
              <h3 className="font-semibold text-gray-900 flex items-center gap-2">
                <TrendingUp className="w-5 h-5 text-green-600" /> Comisiones
              </h3>
              <span className="text-xs text-gray-400 capitalize">{monthName}</span>
            </div>
            <div className="mb-2">
              <span className={`inline-flex items-center gap-1 text-[11px] font-semibold px-2 py-0.5 rounded-full bg-${accent}-100 text-${accent}-700`}>
                {badge}
              </span>
              <p className="text-xs text-gray-500 mt-1">{view.label}{isBranch ? ' · avance de toda la sucursal' : ''}</p>
            </div>
            <p className="text-sm text-gray-600 mb-3">
              {nextGoal
                ? <>Faltan <span className="font-semibold text-gray-900">{formatCLP(nextGoal.amount - achieved)}</span> para alcanzar <span className="font-semibold">{nextGoal.label}</span>.</>
                : <span className="font-semibold text-green-700">¡Todas las metas alcanzadas! 🎉</span>}
            </p>

            <p className="text-2xl font-bold text-gray-900">{formatCLP(achieved)}</p>
            <p className="text-xs text-gray-500 mb-3">acumulado este ciclo</p>

            <div className="relative h-3 bg-gray-200 rounded-full mb-2">
              <div className="absolute inset-y-0 left-0 bg-gradient-to-r from-green-400 to-green-600 rounded-full" style={{ width: `${pct}%` }} />
              {goals.map((g) => {
                const left = Math.min(100, (g.amount / maxAmount) * 100);
                const done = achieved >= g.amount;
                return (
                  <div key={g.label} className="absolute -top-1" style={{ left: `calc(${left}% - 6px)` }}>
                    <div className={`w-3 h-5 rounded-full border-2 ${done ? 'bg-green-600 border-green-700' : 'bg-white border-gray-400'}`} title={`${g.label}: ${formatCLP(g.amount)}`} />
                  </div>
                );
              })}
            </div>

            <div className="space-y-1.5 mt-4">
              {goals.map((g) => {
                const done = achieved >= g.amount;
                return (
                  <div key={g.label} className="flex items-center justify-between text-sm">
                    <span className="flex items-center gap-2">
                      {done ? <Check className="w-4 h-4 text-green-600" /> : <span className="w-4 h-4 inline-block rounded-full border-2 border-gray-300" />}
                      <span className={done ? 'text-gray-900 font-medium' : 'text-gray-600'}>{g.label}</span>
                    </span>
                    <span className={done ? 'text-green-700 font-semibold' : 'text-gray-500'}>{formatCLP(g.amount)}</span>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

                  <Check className="w-4 h-4" /> Marcar como completada

              )}

          );
        })}
      </CollapseList>

  );

      label: 'Hoy',

      color: 'bg-green-500',

      label: 'Esta Semana',
      value: thisWeekInspections.length,
      icon: Clock,
      color: 'bg-purple-500',

      label: 'Mis Alertas',
      value: myAlerts.length,

      color: 'bg-orange-500',
    },
  ];

  return (
    <div className="p-4 pb-24 space-y-6">

function HomeAdmin({ onNavigate }: HomeAdminProps) {

  const _allInspections = getInspections();
  // Branch isolation: a non-HQ admin only sees their own branch's data.
  const hqView = canSeeAllBranches(user);
  const vehicles = hqView ? _allVehicles : _allVehicles.filter(v => branchOfPerson(v.createdBy) === user?.branch);
  const inspections = hqView ? _allInspections : _allInspections.filter(i => i.branch === user?.branch);
  const pendingAlerts = hqView ? getPendingAlerts() : getPendingAlerts().filter(a => branchOfPerson(a.createdBy) === user?.branch);
  const users = (hqView ? getUsers() : getUsers().filter(u => u.branch === user?.branch)).filter(u => u.role === 'mechanic');

  const todayInspections = inspections.filter(
    i => new Date(i.date).toDateString() === new Date().toDateString()
  );

  const totalRevenue = inspections.reduce((sum, i) => sum + i.amountCharged, 0);
  const todayRevenue = todayInspections.reduce((sum, i) => sum + i.amountCharged, 0);

  const thisWeekInspections = inspections.filter(i => {
    const inspectionDate = new Date(i.date);

    weekAgo.setDate(weekAgo.getDate() - 7);

              <p className="text-sm text-gray-600 mt-1">{stat.label}</p>

      </div>

      <div className="bg-gradient-to-br from-green-500 to-green-600 rounded-lg shadow-lg p-6 text-white">
        <div className="flex items-start justify-between mb-4">
          <div>
            <h3 className="text-lg font-semibold mb-1">Ingresos Totales</h3>
            <p className="text-4xl font-bold">${totalRevenue.toLocaleString()}</p>

      </div>

      <CommissionProgress />

      <div>

/* ===== Filtro por fecha (compartido) =====
   Hook + barra de filtros reutilizable: Todo / Hoy / 7 / 30 días / Este mes /
   Personalizado. Compara las fechas como texto ISO (yyyy-mm-dd). */
const __isoDay = (d: Date) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

function useDateFilter(initial: string = 'all') {
  const [preset, setPreset] = useState(initial);
  const [from, setFrom] = useState('');
  const [to, setTo] = useState('');
  const today = new Date();
  let range = { from: '', to: '' };
  if (preset === 'today') range = { from: __isoDay(today), to: __isoDay(today) };
  else if (preset === '7' || preset === '30') {
    const d = new Date(today); d.setDate(d.getDate() - (preset === '7' ? 6 : 29));
    range = { from: __isoDay(d), to: __isoDay(today) };
  } else if (preset === 'month') {
    range = { from: __isoDay(new Date(today.getFullYear(), today.getMonth(), 1)), to: __isoDay(today) };
  } else if (preset === 'custom') range = { from, to };
  const match = (value?: string) => {
    if (!range.from && !range.to) return true;
    if (!value) return false;
    const day = String(value).slice(0, 10);
    if (range.from && day < range.from) return false;
    if (range.to && day > range.to) return false;
    return true;
  };
  return { preset, setPreset, from, setFrom, to, setTo, range, match, active: !!(range.from || range.to) };
}

function DateFilterBar({ f, className = '' }: { f: any; className?: string }) {
  const opts = [
    { id: 'all', label: 'Todo' },
    { id: 'today', label: 'Hoy' },
    { id: '7', label: '7 días' },
    { id: '30', label: '30 días' },
    { id: 'month', label: 'Este mes' },
    { id: 'custom', label: 'Personalizado' },
  ];
  return (
    <div className={`mb-3 ${className}`}>
      <div className="flex items-center gap-1.5 mb-2 text-xs font-medium text-gray-500">
        <Calendar className="w-3.5 h-3.5" /> Filtrar por fecha
      </div>
      <div className="flex flex-wrap gap-1.5">
        {opts.map(o => (
          <button key={o.id} type="button" onClick={() => f.setPreset(o.id)}
            className={`px-2.5 py-1.5 rounded-full text-xs font-medium border transition-colors ${f.preset === o.id ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-700 border-gray-300 hover:border-blue-500'}`}>
            {o.label}
          </button>
        ))}
      </div>
      {f.preset === 'custom' && (
        <div className="grid grid-cols-2 gap-2 mt-2">
          <label className="text-xs text-gray-500">Desde
            <input type="date" value={f.from} onChange={(e) => f.setFrom(e.target.value)}
              className="w-full mt-1 px-2.5 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
          </label>
          <label className="text-xs text-gray-500">Hasta
            <input type="date" value={f.to} onChange={(e) => f.setTo(e.target.value)}
              className="w-full mt-1 px-2.5 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
          </label>
        </div>
      )}
    </div>
  );
}


/* ===== CollapseList =====
   Muestra solo las primeras filas de una lista larga y deja el resto tras un
   botón "Ver más" / "Ver menos". */
function CollapseList({ children, initial = 4, className = '' }: { children: any; initial?: number; className?: string }) {
  const [showAll, setShowAll] = useState(false);
  const items = React.Children.toArray(children);
  const visible = showAll ? items : items.slice(0, initial);
  const hidden = items.length - visible.length;
  return (
    <div className="space-y-2">
      <div className={className}>{visible}</div>
      {items.length > initial && (
        <button onClick={() => setShowAll(!showAll)}
          className="w-full flex items-center justify-center gap-1.5 py-2 text-sm font-medium text-blue-600 hover:text-blue-700">
          {showAll ? <>Ver menos <ChevronUp className="w-4 h-4" /></> : <>Ver {hidden} más <ChevronDown className="w-4 h-4" /></>}
        </button>
      )}
    </div>
  );
}


/* ===== ClientDirectoryCard =====
   Buscador de CLIENTES (incluye clientes antiguos): agrupa por nombre, muestra
   sus datos de contacto, sus vehículos y la fecha de su última visita. */
function ClientDirectoryCard({ onOpenVehicle }: { onOpenVehicle: (plate: string) => void }) {
  const user = getCurrentUser();
  const [term, setTerm] = useState('');
  const [openClient, setOpenClient] = useState<string | null>(null);
  const [showAll, setShowAll] = useState(false);
  const COLLAPSED = 4;

  const scoped = canSeeAllBranches(user)
    ? getVehicles()
    : getVehicles().filter(v => branchOfPerson(v.createdBy) === user?.branch);
  const allInspections = getInspections();

  const q = term.trim().toLowerCase();
  const clients = (() => {
    const map = new Map<string, any>();
    scoped.forEach((v) => {
      const name = (v.clientName || 'Sin nombre').trim();
      const key = name.toLowerCase();
      if (!map.has(key)) map.set(key, { name, phones: new Set(), emails: new Set(), vehicles: [] });
      const c = map.get(key);
      if (v.phoneNumber) c.phones.add(v.phoneNumber);
      if (v.email) c.emails.add(v.email);
      c.vehicles.push(v);
    });
    let list = Array.from(map.values());
    if (q) {
      list = list.filter(c =>
        c.name.toLowerCase().includes(q)
        || Array.from(c.phones).some((p: any) => String(p).toLowerCase().includes(q))
        || Array.from(c.emails).some((e: any) => String(e).toLowerCase().includes(q))
        || c.vehicles.some((v: any) => v.licensePlate.toLowerCase().includes(q) || (v.vehicleModel || '').toLowerCase().includes(q))
      );
    }
    return list.sort((a, b) => a.name.localeCompare(b.name));
  })();
  const visible = showAll ? clients.slice(0, 60) : clients.slice(0, COLLAPSED);
  const hidden = Math.min(clients.length, 60) - visible.length;

  const insOf = (plate: string) =>
    allInspections.filter(i => i.licensePlate === plate && (canSeeAllBranches(user) || i.branch === user?.branch));
  const lastVisit = (c: any) => {
    const dates = c.vehicles.flatMap((v: any) => insOf(v.licensePlate).map((i: any) => i.serviceDate || i.date));
    if (!dates.length) return null;
    return dates.sort().slice(-1)[0];
  };

  return (
    <div className="bg-white rounded-lg shadow p-4">
      <div className="flex items-center gap-2 mb-1">
        <Users className="w-5 h-5 text-blue-600" />
        <h3 className="font-semibold text-gray-900">Buscar cliente</h3>
      </div>
      <p className="text-sm text-gray-600 mb-3">Historial de clientes antiguos y actuales. Busca por nombre, teléfono, correo o patente.</p>
      <div className="relative mb-3">
        <Search className="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2" />
        <input type="text" value={term} onChange={(e) => { setTerm(e.target.value); setShowAll(false); }}
          placeholder="Nombre, teléfono, correo o patente"
          className="w-full pl-9 pr-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
      </div>
      {clients.length === 0 ? (
        <p className="text-sm text-gray-400 text-center py-4">
          {q ? `Sin resultados para “${term}”` : 'Aún no hay clientes registrados'}
        </p>
      ) : (
        <div className="space-y-2">
          {!q && <p className="text-xs text-gray-500">{clients.length} cliente{clients.length === 1 ? '' : 's'} registrado{clients.length === 1 ? '' : 's'}</p>}
          {visible.map((c: any) => {
            const open = openClient === c.name;
            const last = lastVisit(c);
            return (
              <div key={c.name} className="border border-gray-200 rounded-lg overflow-hidden">
                <button onClick={() => setOpenClient(open ? null : c.name)}
                  className="w-full text-left px-3 py-2.5 hover:bg-gray-50 transition-colors flex items-center justify-between gap-2">
                  <span className="min-w-0">
                    <span className="block font-semibold text-gray-900 truncate">{c.name}</span>
                    <span className="block text-xs text-gray-500 truncate">
                      {c.vehicles.length} vehículo{c.vehicles.length === 1 ? '' : 's'}
                      {last ? ` · última visita ${new Date(last).toLocaleDateString('es-ES')}` : ' · sin visitas'}
                    </span>
                  </span>
                  {open ? <ChevronUp className="w-4 h-4 text-gray-400 shrink-0" /> : <ChevronDown className="w-4 h-4 text-gray-400 shrink-0" />}
                </button>
                {open && (
                  <div className="border-t border-gray-200 bg-gray-50 p-3 space-y-3">
                    <div className="text-sm space-y-1">
                      {Array.from(c.phones).map((p: any) => (
                        <p key={p}><span className="text-gray-600">Teléfono:</span>{' '}
                          <a href={`tel:${String(p).replace(/\s/g, '')}`} className="text-blue-600 hover:text-blue-700">{p}</a>
                        </p>
                      ))}
                      {Array.from(c.emails).map((e: any) => (
                        <p key={e} className="truncate"><span className="text-gray-600">Correo:</span>{' '}
                          <a href={`mailto:${e}`} className="text-blue-600 hover:text-blue-700">{e}</a>
                        </p>
                      ))}
                      {!c.phones.size && !c.emails.size && <p className="text-gray-500">Sin datos de contacto</p>}
                    </div>
                    <CollapseList className="space-y-2" initial={3}>
                      {c.vehicles.map((v: any) => (
                        <button key={v.licensePlate} onClick={() => onOpenVehicle(v.licensePlate)}
                          className="w-full text-left bg-white border border-gray-200 rounded-lg px-3 py-2 hover:border-blue-500 transition-colors flex items-center justify-between gap-2">
                          <span className="min-w-0">
                            <span className="block font-semibold text-gray-900">{v.licensePlate}</span>
                            <span className="block text-xs text-gray-500 truncate">
                              {v.vehicleModel || 'Modelo s/i'} · {insOf(v.licensePlate).length} inspección{insOf(v.licensePlate).length === 1 ? '' : 'es'}
                            </span>
                          </span>
                          <ArrowRight className="w-4 h-4 text-gray-400 shrink-0" />
                        </button>
                      ))}
                    </CollapseList>
                  </div>
                )}
              </div>
            );
          })}
          {clients.length > COLLAPSED && (
            <button onClick={() => setShowAll(!showAll)}
              className="w-full flex items-center justify-center gap-1.5 py-2 text-sm font-medium text-blue-600 hover:text-blue-700">
              {showAll ? <>Ver menos <ChevronUp className="w-4 h-4" /></> : <>Ver {hidden} más <ChevronDown className="w-4 h-4" /></>}

          )}

      )}

  );
}

/* ===== HomeVentas ===== */

interface HomeVentasProps {
  onNavigate: (view: string) => void;
}

function HomeVentas({ onNavigate }: HomeVentasProps) {
  const user = getCurrentUser();
  const _hqV = canSeeAllBranches(user);
  const vehicles = _hqV ? getVehicles() : getVehicles().filter(v => branchOfPerson(v.createdBy) === user?.branch);
  const inspections = _hqV ? getInspections() : getInspections().filter(i => i.branch === user?.branch);
  const pendingAlerts = _hqV ? getPendingAlerts() : getPendingAlerts().filter(a => branchOfPerson(a.createdBy) === user?.branch);

  const myVehicles = vehicles.filter(v => v.createdBy === user?.name);
  const branchVehicles = user?.branch === 'Todas'
    ? vehicles
    : vehicles.filter(v => inspections.some(i => i.licensePlate === v.licensePlate && i.branch === user?.branch));

  const todayVehicles = vehicles.filter(v => {
    const createdDate = new Date(v.createdAt);
    return createdDate.toDateString() === new Date().toDateString();
  });

  const thisWeekVehicles = vehicles.filter(v => {
    const createdDate = new Date(v.createdAt);
    const weekAgo = new Date();
    weekAgo.setDate(weekAgo.getDate() - 7);
    return createdDate >= weekAgo;
  });

  const branchInspections = user?.branch === 'Todas'
    ? inspections
    : inspections.filter(i => i.branch === user?.branch);

  const totalRevenue = branchInspections.reduce((sum, i) => sum + i.amountCharged, 0);

  // Current-month branch revenue (shown on the home card instead of the all-time total).
  const _nowV = new Date();
  const monthInspections = branchInspections.filter(i => {
    const d = new Date(i.serviceDate || i.date);
    return d.getMonth() === _nowV.getMonth() && d.getFullYear() === _nowV.getFullYear();
  });
  const monthRevenue = monthInspections.reduce((sum, i) => sum + (i.amountCharged || 0), 0);
  const _mlV = _nowV.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
  const monthLabelV = _mlV.charAt(0).toUpperCase() + _mlV.slice(1);

  // Vehículo abierto para ver sus inspecciones y los datos de su cliente.
  const [detailPlate, setDetailPlate] = useState<string | null>(null);

  const stats = [
    {
      label: 'Vehículos Registrados Hoy',
      value: todayVehicles.length,

// Precios de un servicio por canal/medio de pago. Lo edita el admin central en la
// misma sección donde crea o elimina servicios; el precio se autocompleta luego al
// registrar la tarea. Persiste al salir del campo (onBlur).
function ServicePriceInputs({ name, categories }: { name: string; categories: string[] }) {
  const read = () => {
    const v = getServicePrices()[name] as any;
    const obj: Record<string, string> = {};
    for (const c of categories) {
      if (v && typeof v === 'object') obj[c] = v[c] != null ? String(v[c]) : '';
      else if (typeof v === 'number') obj[c] = String(v);
      else obj[c] = '';
    }
    return obj;
  };
  const [vals, setVals] = useState<Record<string, string>>(read);
  const commit = (cat: string, raw: string) => {
    const price = Math.max(0, Math.round(parseFloat(String(raw).replace(/[^0-9.]/g, '')) || 0));
    setServicePriceFor(name, cat, price);
    setVals(v => ({ ...v, [cat]: price ? String(price) : '' }));
  };
  if (!categories.length) return null;
  return (
    <div className="mt-2 grid gap-2" style={{ gridTemplateColumns: `repeat(${Math.min(categories.length, 2)}, minmax(0, 1fr))` }}>
      {categories.map(c => (
        <label key={c} className="block">
          <span className="block text-[11px] text-gray-500 mb-0.5">{c}</span>
          <div className="relative">
            <span className="absolute left-2 top-1/2 -translate-y-1/2 text-gray-400 text-xs">$</span>
            <input type="number" min="0" inputMode="numeric"
              value={vals[c] ?? ''}
              onChange={(e) => setVals(v => ({ ...v, [c]: e.target.value }))}
              onBlur={(e) => commit(c, e.target.value)}
              placeholder="0"
              className="w-full pl-5 pr-2 py-1.5 border border-gray-300 rounded-lg text-sm" />
          </div>
        </label>
      ))}
    </div>
  );
}

// Selector de servicio categorizado: en vez de mostrar los 80+ servicios de golpe,
// el vendedor filtra por tipo de vehículo y categoría, o busca por nombre.
function ServicePicker({ value, onPick, priceCategory }: { value: string; onPick: (name: string) => void; priceCategory: string }) {
  const all = getServiceTypes();
  const [vehicle, setVehicle] = useState('Todos');
  const [group, setGroup] = useState('');
  const [query, setQuery] = useState('');
  const q = query.trim().toLowerCase();

  const meta = useMemo(() => {
    const m: Record<string, ServiceMeta> = {};
    all.forEach(s => { m[s] = serviceMetaOf(s); });
    return m;
  }, [all.length]);

  // Los servicios "Todos" sirven para cualquier vehículo, así que siempre aparecen.
  const byVehicle = all.filter(s => vehicle === 'Todos' || meta[s].vehicle === vehicle || meta[s].vehicle === 'Todos');
  const groups = [...new Set(byVehicle.map(s => meta[s].group))].sort();
  const list = byVehicle
    .filter(s => !group || meta[s].group === group)
    .filter(s => !q || s.toLowerCase().includes(q));

  return (
    <div className="space-y-2">
      <div className="flex flex-wrap gap-1.5">
        {VEHICLE_CLASSES.map(v => (
          <button key={v} type="button" onClick={() => { setVehicle(v); setGroup(''); }}
            className={`px-2.5 py-1 rounded-full border text-xs font-medium transition-colors ${vehicle === v ? 'bg-gray-900 text-white border-gray-900' : 'bg-white text-gray-600 border-gray-300'}`}>
            {v === 'Todos' ? 'Todos los vehículos' : v}
          </button>
        ))}
      </div>
      <div className="flex gap-2">
        <select value={group} onChange={(e) => setGroup(e.target.value)}
          className="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white">
          <option value="">Todas las categorías ({byVehicle.length})</option>
          {groups.map(g => <option key={g} value={g}>{g} ({byVehicle.filter(s => meta[s].group === g).length})</option>)}
        </select>
        <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Buscar…"
          className="w-32 px-3 py-2 border border-gray-300 rounded-lg text-sm" />
      </div>
      {value && (
        <p className="text-xs text-gray-600">Elegido: <span className="font-semibold text-gray-900">{value}</span></p>
      )}
      {!group && !q ? (
        <p className="text-xs text-gray-400">Elige una categoría o escribe para buscar.</p>
      ) : (
        <div className="grid grid-cols-2 gap-1.5 max-h-64 overflow-auto pr-0.5">
          {list.map(s => {
            const sel = value === s;
            const pr = servicePriceOf(s, priceCategory);
            return (
              <button key={s} type="button" onClick={() => onPick(s)}
                className={`px-3 py-2 rounded-lg border text-sm text-left leading-tight transition-colors ${sel ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-700 border-gray-300 hover:border-blue-400'}`}>
                <span className="block">{s}</span>
                {pr > 0 && <span className={`block text-[11px] ${sel ? 'text-blue-100' : 'text-gray-400'}`}>{formatCLP(pr)}</span>}
              </button>
            );
          })}
          {list.length === 0 && <p className="col-span-2 text-xs text-gray-400 py-2">Sin servicios en este filtro.</p>}
        </div>
      )}
    </div>
  );
}

// Multi-selección de servicios (editar una venta) con los mismos filtros por
// categoría y tipo de vehículo, para no listar los 80+ servicios de golpe.
function ServiceMultiPicker({ selected, onToggle }: { selected: string[]; onToggle: (s: string) => void }) {
  const all = getServiceTypes();
  const [vehicle, setVehicle] = useState('Todos');
  const [group, setGroup] = useState('');
  const [query, setQuery] = useState('');
  const q = query.trim().toLowerCase();
  const meta = useMemo(() => { const m: Record<string, ServiceMeta> = {}; all.forEach(s => { m[s] = serviceMetaOf(s); }); return m; }, [all.length]);
  const byVehicle = all.filter(s => vehicle === 'Todos' || meta[s].vehicle === vehicle || meta[s].vehicle === 'Todos');
  const groups = [...new Set(byVehicle.map(s => meta[s].group))].sort();
  const list = byVehicle.filter(s => !group || meta[s].group === group).filter(s => !q || s.toLowerCase().includes(q));
  const chip = (s: string) => (
    <button key={s} type="button" onClick={() => onToggle(s)}
      className={`px-3 py-2 rounded-lg border-2 text-sm text-left transition-colors ${selected.includes(s) ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-700 border-gray-300 hover:border-blue-600'}`}>
      {s}
    </button>
  );
  return (
    <div className="space-y-2">
      {selected.length > 0 && <div className="grid grid-cols-2 gap-2">{selected.map(chip)}</div>}
      <div className="flex flex-wrap gap-1.5">
        {VEHICLE_CLASSES.map(v => (
          <button key={v} type="button" onClick={() => { setVehicle(v); setGroup(''); }}
            className={`px-2.5 py-1 rounded-full border text-xs font-medium transition-colors ${vehicle === v ? 'bg-gray-900 text-white border-gray-900' : 'bg-white text-gray-600 border-gray-300'}`}>
            {v === 'Todos' ? 'Todos los vehículos' : v}
          </button>
        ))}
      </div>
      <div className="flex gap-2">
        <select value={group} onChange={(e) => setGroup(e.target.value)} className="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white">
          <option value="">Todas las categorías ({byVehicle.length})</option>
          {groups.map(g => <option key={g} value={g}>{g} ({byVehicle.filter(s => meta[s].group === g).length})</option>)}
        </select>
        <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Buscar…" className="w-32 px-3 py-2 border border-gray-300 rounded-lg text-sm" />
      </div>
      {!group && !q ? (
        <p className="text-xs text-gray-400">Elige una categoría o escribe para buscar.</p>
      ) : (
        <div className="grid grid-cols-2 gap-2 max-h-64 overflow-auto pr-0.5">
          {list.filter(s => !selected.includes(s)).map(chip)}
          {list.length === 0 && <p className="col-span-2 text-xs text-gray-400 py-2">Sin servicios en este filtro.</p>}
        </div>
      )}
    </div>
  );
}

// Editor de tareas: cada tarea tiene servicio, posiciones, cantidad, precio de
// servicio + precio de insumo, y un mecánico asignado. Usado al registrar un servicio.
function TaskEditor({ tasks, onChange, branch, user }: {
  tasks: ServiceTask[];
  onChange: (t: ServiceTask[]) => void;
  branch: string;
  user: User | null;
}) {
  const services = getServiceTypes();
  const mechanics = getUsers().filter(u => u.role === 'mechanic' && u.active !== false && (canSeeAllBranches(user) || u.branch === (branch || user?.branch)));
  const categories = getPriceCategories();
  const defCat = categories[0] || '';
  const catalog = useMemo(() => getProducts(), []);
  // Texto de búsqueda del insumo, por tarea.
  const [supplyQuery, setSupplyQuery] = useState<Record<string, string>>({});

  const update = (id: string, patch: Partial<ServiceTask>) =>
    onChange(tasks.map(t => t.id === id ? { ...t, ...patch } : t));
  const remove = (id: string) => onChange(tasks.filter(t => t.id !== id));
  const add = () => {
    const first = services[0] || 'Servicio';
    onChange([...tasks, {
      id: `T-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
      service: first, positions: [], detail: '', qty: 1,
      servicePrice: servicePriceOf(first, defCat), suppliesPrice: 0, supplyCode: '',
      priceCategory: defCat, mechanicId: '', mechanic: '', status: 'pendiente',
    }]);
  };

  // Elegir un servicio autocompleta su precio (editable) y, si usa posiciones,
  // ajusta la cantidad al número de neumáticos marcados.
  const setService = (t: ServiceTask, name: string) => {
    const patch: Partial<ServiceTask> = { service: name };
    // Aplica el precio del catálogo para el canal actual, incluido 0 (servicios
    // gratuitos como el montaje). Solo se conserva el precio previo si el servicio
    // no está registrado en el catálogo.
    const registered = Object.prototype.hasOwnProperty.call(getServicePrices(), name);
    if (registered) patch.servicePrice = servicePriceOf(name, t.priceCategory || defCat);
    if (serviceUsesPositions(name)) patch.qty = Math.max(1, t.positions.length);
    update(t.id, patch);
  };
  // Cambiar el canal / medio de pago recalcula el precio de servicio y el del insumo.
  const setCategory = (t: ServiceTask, cat: string) => {
    const patch: Partial<ServiceTask> = { priceCategory: cat };
    if (Object.prototype.hasOwnProperty.call(getServicePrices(), t.service)) patch.servicePrice = servicePriceOf(t.service, cat);
    if (t.supplyCode) {
      const cp = findProductByCode(t.supplyCode);
      if (cp) patch.suppliesPrice = productPriceOf(cp, cat);
    }
    update(t.id, patch);
  };
  // Elegir un insumo del catálogo autocompleta su precio (según el canal) y, si el
  // detalle está vacío, copia el nombre del producto para que lo vea el mecánico.
  const setSupply = (t: ServiceTask, p: { code: string; name: string; prices: Record<string, number> }) => {
    update(t.id, {
      supplyCode: p.code,
      detail: (t.detail && t.detail.trim()) ? t.detail : p.name,
      suppliesPrice: productPriceOf(p, t.priceCategory || defCat),
    });
    setSupplyQuery(q => ({ ...q, [t.id]: '' }));
  };
