/* ===== Login ===== */

interface LoginProps {
  onLogin: () => void;
}

function Login({ onLogin }: LoginProps) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [showPassword, setShowPassword] = useState(false);
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  // El ingreso se valida EN SUPABASE (función fn_login): la app nunca recibe
  // contraseñas. Si la función no existe todavía, cae al modo antiguo local.
  const handleLogin = async () => {
    if (!email || !password) {
      setError('Ingrese su usuario y contraseña');
      return;
    }
    setBusy(true);
    try {
      const sync: any = (window as any).FNSync;
      // 1) Cuenta de la app, validada en la base (fn_login). Es donde viven las
      //    cuentas reales, así que se intenta PRIMERO: evita un 400 innecesario
      //    contra Supabase Auth en cada ingreso.
      let pre: any = null;
      if (sync && sync.login) {
        try { pre = await sync.login(email, password); }
        catch (e: any) {
          if (/404|PGRST202|does not exist/i.test(String(e?.message || e))) pre = null;
          else { setError('No se pudo verificar el ingreso. Revise su conexión.'); return; }
        }
      }
      if (pre && pre.ok && pre.user) {
        setError('');
        setSessionProfile(pre.user);
        setCurrentUser(pre.user.id);
        onLogin();
        return;
      }
      if (pre && pre.reason === 'inactive') {
        setError('Esta cuenta está desactivada. Contacte al administrador global.');
        return;
      }
      // 2) Cuenta real de Supabase (Authentication). Solo aplica a correos.
      if (sync && sync.authSignIn && email.includes('@')) {
        const a = await sync.authSignIn(email.trim(), password);
        if (a.ok) {
          const mail = (a.email || email).trim().toLowerCase();
          let prof = getUsers().find(u => (u.email || '').trim().toLowerCase() === mail);
          if (!prof && sync.hydrateOnly) {
            // Con la base blindada el dispositivo no guarda usuarios hasta ingresar:
            // se baja la lista con la sesión recién abierta y se vuelve a buscar.
            try { await sync.hydrateOnly(['fullneumaticos_users_v3']); } catch (e) {}
            prof = getUsers().find(u => (u.email || '').trim().toLowerCase() === mail);
          }
          if (!prof) {
            setError('La cuenta existe, pero no tiene perfil en la app. Pídale al administrador que la cree con este correo.');
            return;
          }
          if (prof.active === false) {
            setError('Esta cuenta está desactivada. Contacte al administrador global.');
            return;
          }
          setError('');
          setSessionProfile(prof);
          setCurrentUser(prof.id);
          onLogin();
          return;
        }
        // Si el correo no tiene cuenta en Authentication, se sigue con el método de la app.
      }
      const res: any = pre;
      if (res) {
        if (res.ok && res.user) {
          setError('');
          // El perfil que devuelve el servidor (sin contraseña) reemplaza la copia local.
          setSessionProfile(res.user);
          setCurrentUser(res.user.id);
          onLogin();
          return;
        }
        setError(res.reason === 'inactive'
          ? 'Esta cuenta está desactivada. Contacte al administrador global.'
          : 'Usuario o contraseña incorrectos');
        return;
      }
      // ---- Modo antiguo (solo si la base aún no tiene fn_login) ----
      const user = authenticateUser(email, password);
      if (!user) {
        const id = email.trim().toLowerCase();
        const normId = id.replace(/\s+/g, ' ');
        const exists = getUsers().find(u =>
          u.email.trim().toLowerCase() === id
          || (u.name || '').trim().toLowerCase().replace(/\s+/g, ' ') === normId
        );
        setError(exists && exists.active === false
          ? 'Esta cuenta está desactivada. Contacte al administrador global.'
          : 'Usuario o contraseña incorrectos');
        return;
      }
      setError('');
      setCurrentUser(user.id);
      onLogin();
    } finally {
      setBusy(false);
    }
  };

  return (
    <>
      <div className="min-h-screen flex items-center justify-center p-4" style={{ backgroundColor: '#334B63' }}>
      <div className="bg-white rounded-lg shadow-xl p-8 w-full max-w-md">
        <div className="text-center mb-8">
          <img src="logo-neumaticos.png" alt="Full Neumáticos" className="w-64 max-w-full h-auto mx-auto mb-4" />
          <p className="text-gray-600 mt-2">Sistema de Inspección de Vehículos</p>
        </div>

        <div className="space-y-4">
          <div>
            <label className="block text-sm font-medium text-gray-700 mb-2">
              RUT, correo o nombre de usuario
            </label>
            <input
              type="text"
              autoComplete="username"
              value={email}
              onChange={(e) => { setEmail(e.target.value); setError(''); }}
              onKeyDown={(e) => e.key === 'Enter' && handleLogin()}
              placeholder="RUT (mecánicos) o correo"
              className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            />
          </div>

          <div>
            <label className="block text-sm font-medium text-gray-700 mb-2">
              Contraseña
            </label>
            <div className="relative">
              <input
                type={showPassword ? 'text' : 'password'}
                autoComplete="current-password"
                value={password}
                onChange={(e) => { setPassword(e.target.value); setError(''); }}
                onKeyDown={(e) => e.key === 'Enter' && handleLogin()}
                placeholder="••••"
                className="w-full px-4 py-3 pr-12 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              />
              <button
                type="button"
                onClick={() => setShowPassword(s => !s)}
                className="absolute inset-y-0 right-0 px-3 flex items-center text-gray-400 hover:text-gray-600"
                title={showPassword ? 'Ocultar' : 'Mostrar'}
              >
                {showPassword ? <EyeOff className="w-5 h-5" /> : <Eye className="w-5 h-5" />}
              </button>
            </div>
          </div>

          {error && (
            <div className="bg-red-50 border border-red-200 rounded-lg p-3">
              <p className="text-sm text-red-700">{error}</p>
            </div>
          )}

          <button
            onClick={handleLogin}
            disabled={!email || !password || busy}
            className="w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors"
          >
            Iniciar Sesión
          </button>

          {/* Marca de versión: permite confirmar de un vistazo que el equipo ya
              está usando la versión publicada y no una copia vieja en caché. */}
          <p className="text-center text-xs text-gray-400 pt-1">Versión 2026.09.16 · datos en Supabase</p>
        </div>
      </div>
      </div>
      <Toaster position="top-center" richColors />
    </>
  );
}


/* ===== App ===== */

// Merged tab: Ventas + Cotizaciones (sub-tabs, role-gated).
function SalesQuotesTab({ initialPlate, onConsumeInitialPlate }: { initialPlate?: string; onConsumeInitialPlate?: () => void }) {
  const user = getCurrentUser();
  const showSales = canManageSales(user);
  const showQuotes = canManageQuotes(user);
  // Jump straight to Cotizaciones when arriving with a prefill (e.g. from an alert).
  const [tab, setTab] = useState<'sales' | 'quotes'>(initialPlate ? 'quotes' : (showSales ? 'sales' : 'quotes'));

  return (
    <div>
      {showSales && showQuotes && (
        <div className="flex gap-2 px-4 pt-4">
          <button onClick={() => setTab('sales')}
            className={`flex-1 py-2 rounded-lg text-sm font-medium transition-colors ${tab === 'sales' ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}>
            Ventas
          </button>
          <button onClick={() => setTab('quotes')}
            className={`flex-1 py-2 rounded-lg text-sm font-medium transition-colors ${tab === 'quotes' ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}>
            Cotizaciones
          </button>
        </div>
      )}
      {showSales && tab === 'sales' && <SalesManagement />}
      {showQuotes && tab === 'quotes' && (
        <Quotes initialPlate={initialPlate} onConsumeInitialPlate={onConsumeInitialPlate} />
      )}
    </div>
  );
}

// Merged tab: Alertas + Comunicados (Comunicados sub-tab only for the global admin).
function AlertsCommsTab({ onCreateQuote }: { onCreateQuote?: (plate: string) => void }) {
  const user = getCurrentUser();
  const showComms = canManageAnnouncements(user);
  const [tab, setTab] = useState<'alerts' | 'comms'>('alerts');

  return (
    <div>
      {showComms && (
        <div className="flex gap-2 px-4 pt-4">
          <button onClick={() => setTab('alerts')}
            className={`flex-1 py-2 rounded-lg text-sm font-medium transition-colors ${tab === 'alerts' ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}>
            Alertas
          </button>
          <button onClick={() => setTab('comms')}
            className={`flex-1 py-2 rounded-lg text-sm font-medium transition-colors ${tab === 'comms' ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}>
            Comunicados
          </button>
        </div>
      )}
      {(!showComms || tab === 'alerts') && <Alerts onCreateQuote={onCreateQuote} />}
      {showComms && tab === 'comms' && <Announcements />}
    </div>
  );
}

function App() {
  const [isLoggedIn, setIsLoggedIn] = useState(false);
  const [loadingData, setLoadingData] = useState(false);
  const [currentView, setCurrentView] = useState(() => {
    // Si el sistema cierra la app por memoria (o se recarga), volver a la misma
    // pantalla en vez de mandar al usuario al inicio sin aviso.
    try { return localStorage.getItem('fullneumaticos_view') || 'home'; } catch (e) { return 'home'; }
  });
  const [viewingInspectionId, setViewingInspectionId] = useState<string | null>(
    () => new URLSearchParams(window.location.search).get('inspection')
  );
  const [selectedVehicleForInspection, setSelectedVehicleForInspection] = useState<Vehicle | null>(null);
  const [selectedServiceOrder, setSelectedServiceOrder] = useState<Inspection | null>(null);
  const [quotePrefillPlate, setQuotePrefillPlate] = useState<string | undefined>(undefined);

  // Cuando el sondeo trae datos nuevos de otros dispositivos, repintar sin recargar.
  const [, bumpDataVersion] = useState(0);
  useEffect(() => {
    try { localStorage.setItem('fullneumaticos_view', currentView); } catch (e) {}
  }, [currentView]);
  useEffect(() => {
    // Los fallos de sincronización ya no son silenciosos: si la nube rechaza un
    // guardado, el usuario se entera en el momento.
    const sync: any = (window as any).FNSync;
    if (sync && sync.onError) {
      let last = 0;
      sync.onError((e: any) => {
        const now = Date.now();
        if (now - last < 8000) return;
        last = now;
        toast.error('No se pudo guardar en la nube: ' + String(e?.message || e).slice(0, 120));
      });
    }
  }, []);
  useEffect(() => {
    // Avisos de la cola de fotos pendientes.
    const onPhotos = (e: any) => {
      const d = e?.detail || {};
      if (d.configError) toast.error('Fotos: ' + d.configError);
      else if (d.ok > 0) toast.success(`${d.ok} foto(s) pendientes se subieron a la nube`);
    };
    window.addEventListener('fnsync:photos', onPhotos);
    return () => window.removeEventListener('fnsync:photos', onPhotos);
  }, []);
  useEffect(() => {
    const onUpdate = () => bumpDataVersion((v) => v + 1);
    window.addEventListener('fnsync:updated', onUpdate);
    return () => window.removeEventListener('fnsync:updated', onUpdate);
  }, []);
  // Si la sesión de la base caduca, se cierra la sesión y se borran los datos
  // del dispositivo: nada queda visible sin volver a ingresar.
  useEffect(() => {
    const onExpired = () => {
      const sync: any = (window as any).FNSync;
      if (sync && sync.purgeLocal) sync.purgeLocal();
      logout();
      setIsLoggedIn(false);
      setCurrentView('home');
      toast.info('Su sesión expiró. Vuelva a iniciar sesión.');
    };
    window.addEventListener('fnsync:session-expired', onExpired);
    return () => window.removeEventListener('fnsync:session-expired', onExpired);
  }, []);

  // Descarga los datos y arranca la sincronización. Solo se llama con sesión.
  const startSession = async () => {
    const sync: any = (window as any).FNSync;
    setLoadingData(true);
    try {
      if (sync && sync.hydrate) await sync.hydrate();
      if (sync && sync.startAutoSync) sync.startAutoSync();
      if (sync && sync.startPhotoRetry) sync.startPhotoRetry();
      initializeData();
      const sent = processExpiringAlerts();
      if (sent > 0) toast.info(`${sent} recordatorio(s) de alerta por vencer enviado(s)`);
    } catch (e: any) {
      toast.error('No se pudieron cargar los datos: ' + String(e?.message || e).slice(0, 120));
    } finally {
      setLoadingData(false);
    }
  };

  useEffect(() => {
    // Si quedó una sesión abierta en este dispositivo, se recuperan los datos.
    // Si no hay sesión, no se pide NADA a la nube: el inspector no muestra datos.
    const _s: any = (window as any).FNSync;
    if (localStorage.getItem(CURRENT_USER_KEY)) {
      // Sin token de la base no se pide nada: se vuelve a la pantalla de ingreso.
      // (Solo si la base ya tiene el blindaje instalado; si no, se entra normal.)
      const guard = _s && _s.checkGate ? _s.checkGate() : Promise.resolve(false);
      Promise.resolve(guard).then((installed: boolean) => {
        if (installed && _s.hasSession && !_s.hasSession()) {
          if (_s.purgeLocal) _s.purgeLocal();
          logout();
          setIsLoggedIn(false);
          return;
        }
        startSession().then(() => setIsLoggedIn(!!getCurrentUser()));
      });
    } else if (viewingInspectionId) {
      // Informe compartido por QR: sin sesión, y se baja SOLO lo necesario
      // para mostrarlo (inspecciones y vehículos), nada de usuarios ni ventas.
      const sync: any = (window as any).FNSync;
      if (sync && sync.hydrateReport) {
        setLoadingData(true);
        sync.hydrateReport(viewingInspectionId)
          .then(() => { bumpDataVersion((v) => v + 1); })
          .catch(() => {})
          .finally(() => setLoadingData(false));
      }
    }
    // El reporte compartido (?inspection=ID) ya se resuelve de forma síncrona en el
    // useState inicial, para que el QR sea público y no haga falta iniciar sesión.
  }, []);

  const handleLogin = () => {
    setIsLoggedIn(true);
    setCurrentView('home');
    startSession();
  };

  const handleLogout = () => {
    const sync: any = (window as any).FNSync;
    if (sync && sync.authSignOut) sync.authSignOut();
    if (sync && sync.purgeLocal) sync.purgeLocal();   // borra los datos del dispositivo
    logout();
    setIsLoggedIn(false);
    setCurrentView('home');
  };

  const handleNavigate = (view: string) => {
    const user = getCurrentUser();

    if (view === 'reports' && !canAccessReports(user)) {
      return;
    }

    if (view === 'users' && !canManageUsers(user)) {
      return;
    }

    if (view === 'sales-quotes' && !(canManageSales(user) || canManageQuotes(user))) {
      return;
    }

    setCurrentView(view);
  };

  const handleInspectionComplete = () => {
    setSelectedVehicleForInspection(null);
    setSelectedServiceOrder(null);
    setCurrentView('home');
  };

  const handleVehicleSelect = (vehicle: Vehicle) => {
    setSelectedVehicleForInspection(vehicle);
  };

  const handleCancelVehicleSelection = () => {
    setSelectedVehicleForInspection(null);
    setSelectedServiceOrder(null);
    setCurrentView('home');
  };

  // If viewing a shared inspection, show viewer
  if (viewingInspectionId) {
    return (
      <>
        <InspectionViewer
          inspectionId={viewingInspectionId}
          onClose={() => {
            setViewingInspectionId(null);
            window.history.replaceState({}, '', window.location.pathname);
          }}
        />
        <Toaster position="top-center" richColors />
      </>
    );
  }

  if (!isLoggedIn) {
    if (loadingData) {
      return (
        <div className="min-h-screen flex items-center justify-center" style={{ backgroundColor: '#334B63' }}>
          <div className="text-center text-white">
            <div className="w-10 h-10 border-2 border-white/30 border-t-white rounded-full animate-spin mx-auto mb-3" />
            <p className="text-sm">Cargando su información…</p>
          </div>
        </div>
      );
    }
    return <Login onLogin={handleLogin} />;
  }

  const user = getCurrentUser();

  return (
    <div className="min-h-screen bg-gray-50">
      <Navigation currentView={currentView} onNavigate={handleNavigate} onLogout={handleLogout} />

      <main className="pt-16">
        {currentView === 'home' && <Home onNavigate={handleNavigate} />}

        {/* Mechanic inspection flow: pick a dated service order (by plate), then evaluate */}
        {currentView === 'new-inspection' && user?.role === 'mechanic' && !selectedServiceOrder && (
          <ServiceOrderSelector onSelectOrder={(o) => {
            if (o.mechanicId === 'free') {
              updateInspection(o.id, { mechanic: user?.name || '', mechanicId: user?.id || '' });
              setSelectedServiceOrder({ ...o, mechanic: user?.name || '', mechanicId: user?.id || '' });
            } else {
              setSelectedServiceOrder(o);
            }
          }} onCancel={handleCancelVehicleSelection} />
        )}
        {currentView === 'new-inspection' && user?.role === 'mechanic' && selectedServiceOrder && (
          <NewInspection onComplete={handleInspectionComplete} serviceOrder={selectedServiceOrder} />
        )}

        {/* Admin can do full inspection with registration */}
        {currentView === 'new-inspection' && user?.role === 'admin' && (
          <NewInspection onComplete={handleInspectionComplete} />
        )}

        {/* Admin 2 and Ventas: registration only */}
        {currentView === 'register-vehicle' && (user?.role === 'admin' || user?.role === 'admin2' || user?.role === 'ventas') && (
          <NewInspection onComplete={handleInspectionComplete} initialMode="register" />
        )}

        {currentView === 'sales-quotes' && (canManageSales(user) || canManageQuotes(user)) && (
          <SalesQuotesTab initialPlate={quotePrefillPlate} onConsumeInitialPlate={() => setQuotePrefillPlate(undefined)} />
        )}
        {currentView === 'alerts' && (
          <AlertsCommsTab onCreateQuote={(plate: string) => { setQuotePrefillPlate(plate); setCurrentView('sales-quotes'); }} />
        )}
        {currentView === 'reports' && canAccessReports(user) && <Reports />}
        {currentView === 'commissions' && user?.role === 'soporte' && <CommissionConfig />}
        {currentView === 'users' && canManageUsers(user) && <UserManagement />}
      </main>

      <Toaster position="top-center" richColors />
    </div>
  );
}

/* ===== mount ===== */
initializeData();
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>

<script>
(function () {
  function setBootMessage(msg) {
    var bootEl = document.getElementById('__boot');
    if (!bootEl) return;
    bootEl.innerHTML = '<div style="text-align:center"><div class="dot"><div class="spin"></div></div>'
      + 'Full Neumáticos<div style="font-weight:400;color:#3b82f6;font-size:13px;margin-top:4px">' + msg + '</div></div>';
  }
  function showError(e) {
    var bootEl = document.getElementById('__boot');
    if (!bootEl) return;
    var msg = (e && e.message ? e.message : String(e));
    bootEl.innerHTML = '<div style="max-width:480px;padding:24px;text-align:center;color:#991b1b">'
      + '<strong>No se pudo conectar con el servidor.</strong><br><br>'
      + 'Esta aplicación necesita conexión a internet para funcionar. '
      + 'Revise su conexión y reintente.<br><br>'
      + '<button id="__retry" style="background:#2563eb;color:#fff;border:0;border-radius:8px;padding:10px 20px;font:600 14px system-ui;cursor:pointer">Reintentar</button>'
      + '<div style="margin-top:16px"><code style="font-size:12px;color:#7f1d1d;word-break:break-word">' + msg + '</code></div></div>';
    var btn = document.getElementById('__retry');
    if (btn) btn.addEventListener('click', boot);
  }
  async function boot() {
    var bootEl = document.getElementById('__boot');
    try {
      if (!window.Babel) throw new Error('No se pudo cargar Babel (¿sin conexión?).');
      if (!window.FNSync) throw new Error('No se cargó el módulo de sincronización.');
      // NADA de datos antes de iniciar sesión: el arranque solo prepara la app.
      // La descarga ocurre después del ingreso (ver startSession en App).
      setBootMessage('Cargando…');
      var src = document.getElementById('app-source').textContent;
      var out = Babel.transform(src, {
        presets: ['react', ['typescript', { isTSX: true, allExtensions: true }]],
        filename: 'app.tsx'
      }).code;
      (0, eval)(out);
      if (bootEl) bootEl.remove();
    } catch (e) {
      console.error(e);
      showError(e);
    }
  }
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(boot, 0);
  } else {
    window.addEventListener('DOMContentLoaded', boot);
  }
})();
</script>

<script>
/* ===== PWA: registro del service worker (offline + instalable) ===== */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (err) {
      console.warn('No se pudo registrar el service worker:', err);
    });
  });
}
</script>
