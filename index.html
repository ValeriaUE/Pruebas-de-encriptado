                  {r.nextGoal
                    ? <>Faltan <span className="font-semibold text-gray-900">{formatCLP(r.remaining)}</span> para <span className="font-medium">{r.nextGoal.label}</span></>
                    : <span className="font-medium text-green-700">¡Todas las metas alcanzadas! 🎉</span>}
                </p>
                <div className="relative h-2.5 bg-gray-200 rounded-full">
                  <div className="absolute inset-y-0 left-0 bg-gradient-to-r from-green-400 to-green-600 rounded-full" style={{ width: `${r.pct}%` }} />
                  {r.goals.map((g) => {
                    const left = Math.min(100, (g.amount / maxAmount) * 100);
                    const done = r.achieved >= g.amount;
                    return (
                      <div key={g.label} className="absolute -top-1" style={{ left: `calc(${left}% - 5px)` }}>
                        <div className={`w-2.5 h-4 rounded-full border-2 ${done ? 'bg-green-600 border-green-700' : 'bg-white border-gray-400'}`} title={`${g.label}: ${formatCLP(g.amount)}`} />
                      </div>
                    );
                  })}
                </div>
                <div className="flex flex-wrap gap-1.5 mt-3">
                  {r.goals.map((g) => {
                    const done = r.achieved >= g.amount;
                    return (
                      <span key={g.label} className={`text-[11px] px-2 py-0.5 rounded-full font-medium ${done ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'}`}>
                        {g.label}: {formatCLP(g.amount)}{done ? ' ✓' : ''}
                      </span>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}


/* ===== Quotes (Cotizaciones) ===== */

function QuoteForm({ initialPlate, initialItems, recommendationId, editQuote, onSaved, onCancel }: { initialPlate?: string; initialItems?: QuoteItem[]; recommendationId?: string; editQuote?: Quote; onSaved: () => void; onCancel: () => void }) {
  const user = getCurrentUser();
  const today = new Date().toISOString().slice(0, 10);

  const [licensePlate, setLicensePlate] = useState((editQuote?.licensePlate || initialPlate || '').toUpperCase());
  const [clientName, setClientName] = useState(editQuote?.clientName || '');
  const [phoneNumber, setPhoneNumber] = useState(editQuote?.phoneNumber || '');
  const [email, setEmail] = useState(editQuote?.email || '');
  const [vehicleModel, setVehicleModel] = useState(editQuote?.vehicleModel || '');
  const [items, setItems] = useState<QuoteItem[]>(
    editQuote ? editQuote.items.map(it => ({ ...it }))
      : (initialItems && initialItems.length > 0 ? initialItems : [{ description: '', qty: 1, unitPrice: 0 }])
  );
  const [notes, setNotes] = useState(editQuote?.notes || '');
  const [issueDate, setIssueDate] = useState(editQuote?.issueDate || today);
  const [validDays, setValidDays] = useState(15);

  const autofillFromVehicle = (plate: string) => {
    const v = getVehicle(plate.toUpperCase());
    if (v) {
      setClientName(v.clientName || '');
      setPhoneNumber(v.phoneNumber || '');
      setEmail(v.email || '');
      setVehicleModel(v.vehicleModel || '');
      toast.success('Datos del vehículo cargados');
    }
  };

  useEffect(() => {
    if (!editQuote && initialPlate) autofillFromVehicle(initialPlate);
  }, []);

  const setItem = (i: number, patch: Partial<QuoteItem>) => {
    setItems(prev => prev.map((it, idx) => idx === i ? { ...it, ...patch } : it));
  };
  const addItem = () => setItems(prev => [...prev, { description: '', qty: 1, unitPrice: 0 }]);
  const removeItem = (i: number) => setItems(prev => prev.length > 1 ? prev.filter((_, idx) => idx !== i) : prev);

  // Catálogo (servicios + productos) para autollenar el precio, igual que en ventas.
  const priceCatalog = useMemo(() => {
    const cats = getPriceCategories();
    const svcs = Object.keys(getServicePrices()).map(name => ({ type: 'Servicio', name, price: servicePriceOf(name) }));
    const prods = getProducts().map(p => ({ type: 'Producto', name: p.name, price: productPriceOf(p, cats[0] || '') }));
    return [...svcs, ...prods].filter(x => x.name);
  }, []);
  const [catQuery, setCatQuery] = useState('');
  const catResults = catQuery.trim().length >= 2
    ? priceCatalog.filter(x => x.name.toLowerCase().includes(catQuery.trim().toLowerCase())).slice(0, 8)
    : [];
  const addFromCatalog = (entry: { name: string; price: number }) => {
    const row = { description: entry.name, qty: 1, unitPrice: entry.price };
    // Reemplaza la primera fila vacía; si no hay, agrega.
    setItems(prev => {
      const emptyIdx = prev.findIndex(it => !it.description.trim() && !it.unitPrice);
      if (emptyIdx >= 0) return prev.map((it, idx) => idx === emptyIdx ? row : it);
      return [...prev, row];
    });
    setCatQuery('');
  };
  // Al escribir la descripción, si coincide exactamente con el catálogo y el precio
  // está en 0, se autollena (queda editable para precios especiales).
  const onDescChange = (i: number, desc: string) => {
    setItems(prev => prev.map((it, idx) => {
      if (idx !== i) return it;
      const next = { ...it, description: desc };
      if (!it.unitPrice) { const p = lookupCatalogPrice(desc); if (p > 0) next.unitPrice = p; }
      return next;
    }));
  };

  const subtotal = items.reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.unitPrice) || 0), 0);
  const iva = Math.round(subtotal * IVA_RATE);
  const total = subtotal + iva;

  const validUntil = (() => {
    const d = new Date(issueDate + 'T00:00:00');
    d.setDate(d.getDate() + (Number(validDays) || 0));
    return d.toISOString().slice(0, 10);
  })();

  const handleSave = () => {
    if (!licensePlate.trim()) { toast.error('Ingrese la patente'); return; }
    if (!clientName.trim()) { toast.error('Ingrese el nombre del cliente'); return; }
    const validItems = items.filter(it => it.description.trim());
    if (validItems.length === 0) { toast.error('Agregue al menos un ítem'); return; }

    const cleanItems = validItems.map(it => ({ description: it.description.trim(), qty: Number(it.qty) || 0, unitPrice: Number(it.unitPrice) || 0 }));

    if (editQuote) {
      updateQuote(editQuote.id, {
        licensePlate: licensePlate.toUpperCase().trim(),
        clientName: clientName.trim(),
        phoneNumber: phoneNumber.trim(),
        email: email.trim(),
        vehicleModel: vehicleModel.trim(),
        items: cleanItems,
        notes: notes.trim(),
        issueDate,
        validUntil,
      });
      toast.success(`Cotización ${editQuote.number} actualizada`);
      onSaved();
      return;
    }

    const quote: Quote = {
      id: `QUOTE-${Date.now()}`,
      number: nextQuoteNumber(),
      licensePlate: licensePlate.toUpperCase().trim(),
      clientName: clientName.trim(),
      phoneNumber: phoneNumber.trim(),
      email: email.trim(),
      vehicleModel: vehicleModel.trim(),
      items: cleanItems,
      notes: notes.trim(),
      issueDate,
      validUntil,
      createdBy: user?.name || '',
      createdAt: new Date().toISOString(),
      status: 'vigente',
      branch: user?.branch || '',
    };
    saveQuote(quote);
    if (recommendationId) {
      updateRecommendation(recommendationId, { status: 'cotizada', quoteId: quote.id });
    }
    toast.success(`Cotización ${quote.number} creada`);
    onSaved();
  };

  return (
    <div className="bg-white rounded-lg shadow p-4 mb-6 space-y-4 border border-blue-100">
      <h3 className="text-lg font-semibold text-gray-900">{editQuote ? `Editar cotización · ${editQuote.number}` : `Nueva cotización · ${nextQuoteNumber()}`}</h3>

      <div className="flex gap-2">
        <div className="flex-1">
          <label className="block text-sm font-medium text-gray-700 mb-1">Patente <span className="text-red-500">*</span></label>
          <input type="text" value={licensePlate}
            onChange={(e) => setLicensePlate(e.target.value.toUpperCase())}
            placeholder="ABC123"
            className="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent uppercase" />
        </div>
        <button onClick={() => autofillFromVehicle(licensePlate)} type="button"
          className="self-end px-4 py-2.5 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-200 transition-colors flex items-center gap-1.5">
          <Search className="w-4 h-4" /> Cargar
        </button>
      </div>

      <div className="grid grid-cols-2 gap-3">
        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Cliente <span className="text-red-500">*</span></label>
          <input type="text" value={clientName} onChange={(e) => setClientName(e.target.value)}
            className="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
        </div>
        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
          <input type="text" value={phoneNumber} onChange={(e) => setPhoneNumber(e.target.value)}
            className="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
        </div>
        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Correo</label>
          <input type="email" value={email} onChange={(e) => setEmail(e.target.value)}
            className="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent lowercase" />
        </div>
        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Vehículo</label>
          <input type="text" value={vehicleModel} onChange={(e) => setVehicleModel(e.target.value)}
            className="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
        </div>
      </div>

      <div>
        <div className="flex items-center justify-between mb-2">
          <label className="block text-sm font-medium text-gray-700">Servicios / Productos</label>
          <button onClick={addItem} type="button" className="text-sm text-blue-600 font-medium hover:text-blue-700 flex items-center gap-1">
            <Plus className="w-4 h-4" /> Agregar ítem
          </button>
        </div>
        <div className="relative mb-2">
          <input type="text" value={catQuery} onChange={(e) => setCatQuery(e.target.value)}
            placeholder="Buscar servicio o producto del catálogo (autollena el precio)…"
            className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
          {catResults.length > 0 && (
            <div className="absolute z-20 left-0 right-0 mt-1 bg-white border border-gray-200 rounded-lg shadow-lg max-h-60 overflow-auto">
              {catResults.map((r, idx) => (
                <button key={idx} type="button" onClick={() => addFromCatalog(r)}
                  className="w-full flex items-center justify-between gap-3 px-3 py-2 text-left hover:bg-blue-50 transition-colors">
                  <span className="text-sm text-gray-800 truncate"><span className="text-[10px] uppercase text-gray-400 mr-1.5">{r.type}</span>{r.name}</span>
                  <span className="text-sm font-medium text-gray-600 shrink-0">{formatCLP(r.price)}</span>
                </button>
              ))}
            </div>
          )}
        </div>
        <div className="space-y-2">
          {items.map((it, i) => (
            <div key={i} className="flex gap-2 items-start">
              <input type="text" value={it.description} onChange={(e) => onDescChange(i, e.target.value)}
                placeholder="Descripción"
                className="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
              <input type="number" value={it.qty} min="0" onChange={(e) => setItem(i, { qty: parseFloat(e.target.value) || 0 })}
                placeholder="Cant." title="Cantidad"
                className="w-16 px-2 py-2 border border-gray-300 rounded-lg text-sm text-center focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
              <input type="number" value={it.unitPrice} min="0" onChange={(e) => setItem(i, { unitPrice: parseFloat(e.target.value) || 0 })}
                placeholder="Precio" title="Precio unitario"
                className="w-28 px-2 py-2 border border-gray-300 rounded-lg text-sm text-right focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
              <button onClick={() => removeItem(i)} type="button" title="Quitar"
                className="p-2 text-gray-400 hover:text-red-600 transition-colors">
                <Trash2 className="w-4 h-4" />
              </button>
            </div>
          ))}
        </div>
      </div>

      <div className="bg-gray-50 rounded-lg p-3 space-y-1">
        <div className="flex justify-between text-sm text-gray-600"><span>Subtotal</span><span>{formatCLP(subtotal)}</span></div>
        <div className="flex justify-between text-sm text-gray-600"><span>IVA (19%)</span><span>{formatCLP(iva)}</span></div>
        <div className="flex justify-between text-base font-bold text-gray-900 pt-1 border-t border-gray-200"><span>Total</span><span className="text-green-600">{formatCLP(total)}</span></div>
      </div>

      <div className="grid grid-cols-2 gap-3">
        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Fecha de emisión</label>
          <input type="date" value={issueDate} onChange={(e) => setIssueDate(e.target.value)}
            className="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
        </div>
        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Validez (días)</label>
          <input type="number" value={validDays} min="1" onChange={(e) => setValidDays(parseInt(e.target.value) || 0)}
            className="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
          <p className="text-xs text-gray-500 mt-1">Válida hasta {fmtDateEs(validUntil)}</p>
        </div>
      </div>

      <div>
        <label className="block text-sm font-medium text-gray-700 mb-1">Observaciones</label>
        <textarea value={notes} onChange={(e) => setNotes(e.target.value)} rows={2}
          className="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
      </div>

      <div className="flex gap-2">
        <button onClick={handleSave} className="flex-1 bg-green-600 text-white py-3 rounded-lg font-medium hover:bg-green-700 transition-colors">{editQuote ? 'Guardar cambios' : 'Crear cotización'}</button>
        <button onClick={onCancel} className="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg font-medium hover:bg-gray-300 transition-colors">Cancelar</button>
      </div>
    </div>
  );
}

function PaymentForm({ quote, onSaved, onCancel }: { quote: Quote; onSaved: () => void; onCancel: () => void }) {
  const user = getCurrentUser();
  const [amount, setAmount] = useState(String(quoteTotal(quote)));
  const [method, setMethod] = useState('Transferencia');
  const [receiptImage, setReceiptImage] = useState<string | undefined>(quote.payment?.receiptImage);
  const [receiptName, setReceiptName] = useState<string | undefined>(quote.payment?.receiptName);

  const handleFile = (e: any) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (file.size > 4 * 1024 * 1024) { toast.error('El archivo supera 4 MB'); return; }
    const reader = new FileReader();
    reader.onload = () => {
      setReceiptImage(reader.result as string);
      setReceiptName(file.name);
    };
    reader.readAsDataURL(file);
  };

  const handleSave = () => {
    if (!receiptImage) { toast.error('Suba el comprobante de pago'); return; }
    const payment: QuotePayment = {
      amount: parseFloat(amount) || 0,
      method,
      receiptImage,
      receiptName,
      registeredBy: user?.name || '',
      registeredAt: new Date().toISOString(),
    };
    updateQuote(quote.id, { payment, status: 'pagada' });
    toast.success('Pago registrado · comprobante adjuntado');
    onSaved();
  };

  return (
    <div className="mt-3 pt-3 border-t border-gray-200 space-y-3">
      <h4 className="text-sm font-semibold text-gray-900">Registrar pago / comprobante</h4>
      <div className="grid grid-cols-2 gap-3">
        <div>
          <label className="block text-xs font-medium text-gray-600 mb-1">Monto</label>
          <input type="number" value={amount} onChange={(e) => setAmount(e.target.value)}
            className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
        </div>
        <div>
          <label className="block text-xs font-medium text-gray-600 mb-1">Método de pago</label>
          <select value={method} onChange={(e) => setMethod(e.target.value)}
            className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            {['Efectivo', 'Transferencia', 'Tarjeta de débito', 'Tarjeta de crédito', 'Otro'].map(m => <option key={m} value={m}>{m}</option>)}
          </select>
        </div>
      </div>
      <div>
        <label className="block text-xs font-medium text-gray-600 mb-1">Comprobante (imagen)</label>
        <input type="file" accept="image/*" onChange={handleFile}
          className="block w-full text-sm text-gray-600 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
        {receiptImage && (
          <div className="mt-2 flex items-center gap-2">
            <img src={receiptImage} alt="Comprobante" className="w-16 h-16 object-cover rounded border border-gray-200" />
            <span className="text-xs text-gray-500 truncate">{receiptName}</span>
          </div>
        )}
      </div>
      <div className="flex gap-2">
        <button onClick={handleSave} className="flex-1 bg-blue-600 text-white py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition-colors">Guardar pago</button>
        <button onClick={onCancel} className="flex-1 bg-gray-200 text-gray-700 py-2 rounded-lg text-sm font-medium hover:bg-gray-300 transition-colors">Cancelar</button>
      </div>
    </div>
  );
}

function Quotes({ initialPlate, onConsumeInitialPlate }: { initialPlate?: string; onConsumeInitialPlate?: () => void }) {
  const user = getCurrentUser();
  const [version, setVersion] = useState(0);
  const refresh = () => setVersion(v => v + 1);
  const [formSeed, setFormSeed] = useState<{ plate?: string; items?: QuoteItem[]; recId?: string; editQuote?: Quote } | null>(initialPlate ? { plate: initialPlate } : null);
  const [payingId, setPayingId] = useState<string | null>(null);
  const [confirmDelete, setConfirmDelete] = useState<Quote | null>(null);
  const [branchFilter, setBranchFilter] = useState('');

  const seeAll = canSeeAllBranches(user);
  const effBranch = seeAll ? branchFilter : (user?.branch || '');
  const recBranchOf = (rec: Recommendation): string => {
    const ins = getInspections().find(i => i.id === rec.inspectionId);
    return ins?.branch || branchOfPerson(rec.createdBy);
  };

  // Paid quotes leave Cotizaciones and move to Ventas (tagged "Cotización").
  const df = useDateFilter();
  const quotes = getQuotes().slice()
    .filter(q => q.status !== 'pagada')
    .filter(q => df.match(q.createdAt))
    .filter(q => !effBranch || quoteBranchOf(q) === effBranch)
    .sort((a, b) => new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime());
  const pendingRecs = getPendingRecommendations().slice()
    .filter(r => df.match(r.createdAt))
    .filter(r => !effBranch || recBranchOf(r) === effBranch)
    .sort((a, b) => new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime());
  const showForm = formSeed !== null;

  const closeForm = () => { setFormSeed(null); if (onConsumeInitialPlate) onConsumeInitialPlate(); };

  const handleDownload = (q: Quote) => {
    try {
      const pdf = generateQuotePDF(q);
      if (q.payment) appendReceiptPage(pdf, q);
      pdf.save(`Cotizacion_${q.number}_${q.licensePlate}.pdf`);
      toast.success('PDF descargado');
    } catch (e) {
      toast.error('Error al generar PDF');
      console.error(e);
    }
  };

  const quoteFromRecommendation = (rec: Recommendation) => {
    setPayingId(null);
    setFormSeed({
      plate: rec.licensePlate,
      items: rec.items.map(d => ({ description: d, qty: 1, unitPrice: lookupCatalogPrice(d) })),
      recId: rec.id,
    });
  };

  return (
    <div className="p-4 pb-24">
      <div className="flex items-center justify-between mb-1">
        <h2 className="text-2xl font-bold text-gray-900">Cotizaciones</h2>
        <button
          onClick={() => { if (showForm) closeForm(); else { setPayingId(null); setFormSeed({}); } }}
          className="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-blue-700 transition-colors flex items-center gap-2"
        >
          {showForm ? <X className="w-4 h-4" /> : <Plus className="w-4 h-4" />}
          {showForm ? 'Cerrar' : 'Nueva'}
        </button>
      </div>
      <p className="text-sm text-gray-600 mb-3">{quotes.length} cotización(es) vigente(s) · las pagadas pasan a Ventas</p>

      <div className="mb-4">
        <select value={branchFilter} onChange={(e) => setBranchFilter(e.target.value)}
          className={`w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent ${seeAll ? '' : 'hidden'}`}>
          <option value="">Todas las sucursales</option>
          {getBranches().map(b => <option key={b} value={b}>{b}</option>)}
        </select>
      </div>

      <DateFilterBar f={df} />

      <ExportPanel mode="quotes" />

      {!showForm && pendingRecs.length > 0 && (
        <div className="mb-6">
          <h3 className="text-sm font-semibold text-gray-900 mb-2 flex items-center gap-2">
            <DollarSign className="w-4 h-4 text-blue-600" />
            Procesos futuros del mecánico ({pendingRecs.length})
          </h3>
          <div className="space-y-2">
            {pendingRecs.map((rec) => {
              const done = rec.doneItems || [];
              const hasDone = done.length > 0;
              return (
              <div key={rec.id} className={`rounded-lg p-3 border ${hasDone ? 'bg-amber-50 border-amber-300' : 'bg-blue-50 border-blue-200'}`}>
                {hasDone && (
                  <div className="flex items-start gap-2 mb-2 bg-amber-100 border border-amber-300 rounded-md px-2.5 py-1.5">
                    <AlertCircle className="w-4 h-4 text-amber-700 mt-0.5 shrink-0" />
                    <p className="text-xs font-semibold text-amber-800">Trabajo extra YA realizado por el mecánico. Cóbralo (crea la cotización y márcala pagada) para que pase a venta hecha.</p>
                  </div>
                )}
                <div className="flex items-start justify-between gap-3">
                  <div className="flex-1 min-w-0">
                    <p className={`text-sm font-semibold ${hasDone ? 'text-amber-900' : 'text-blue-900'}`}>{rec.licensePlate}{rec.orderNumber ? ` · Orden ${rec.orderNumber}` : ''}</p>
                    <p className={`text-xs ${hasDone ? 'text-amber-700' : 'text-blue-700'}`}>Recomendado por {rec.createdBy} · {new Date(rec.createdAt).toLocaleDateString('es-ES')}</p>
                    <ul className="mt-1.5 space-y-1">
                      {rec.items.map((it, i) => {
                        const isDone = done.includes(it);
                        return (
                          <li key={i} className="flex items-start gap-1.5 text-sm text-gray-700">

// Editor de paquetes de mantención (Admin Global): un paquete agrupa varios
// servicios del catálogo y el vendedor los agrega todos con un clic.
function PackageManager({ onChanged }: { onChanged: () => void }) {
  const [version, setVersion] = useState(0);
  const bump = () => { setVersion(v => v + 1); onChanged(); };
  const packages = getServicePackages();
  const services = getServiceTypes();
  const [openId, setOpenId] = useState<string | null>(null);
  const [newName, setNewName] = useState('');
  const [addQuery, setAddQuery] = useState('');

  const savePkg = (id: string, patch: Partial<ServicePackage>) => {
    saveServicePackages(packages.map(p => p.id === id ? { ...p, ...patch } : p));
    bump();
  };
  const createPkg = () => {
    const name = newName.trim();
    if (!name) { toast.error('Ingrese el nombre del paquete'); return; }
    saveServicePackages([...packages, { id: `PKG-${Date.now()}`, name, services: [] }]);
    setNewName(''); bump();
  };

  return (
    <div className="bg-white rounded-lg shadow p-4 mb-6 border border-blue-100">
      <h3 className="text-lg font-semibold text-gray-900 flex items-center gap-2 mb-1">
        <Package className="w-5 h-5 text-blue-600" /> Paquetes de mantención
      </h3>
      <p className="text-sm text-gray-600 mb-3">Cada paquete agrupa varios servicios (Básica, Intermedia, Full…). El vendedor elige el paquete y se crean todas las tareas de una vez. El precio es la suma de los servicios incluidos.</p>

      <div className="flex gap-2 mb-3">
        <input value={newName} onChange={(e) => setNewName(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && createPkg()}
          placeholder="Nombre del nuevo paquete" className="flex-1 px-4 py-2.5 border border-gray-300 rounded-lg text-sm" />
        <button onClick={createPkg} className="bg-blue-600 text-white px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-blue-700 flex items-center gap-1.5">
          <Plus className="w-4 h-4" /> Crear
        </button>
      </div>

      <div className="space-y-2">
        {packages.map(p => {
          const valid = packageServices(p);
          const missing = (p.services || []).length - valid.length;
          const open = openId === p.id;
          const q = addQuery.trim().toLowerCase();
          const candidates = open && q
            ? services.filter(s => !(p.services || []).includes(s) && s.toLowerCase().includes(q)).slice(0, 8)
            : [];
          return (
            <div key={p.id} className="border border-gray-200 rounded-lg">
              <div className="flex items-center justify-between gap-2 px-3 py-2">
                <button onClick={() => { setOpenId(open ? null : p.id); setAddQuery(''); }} className="min-w-0 text-left flex-1">
                  <span className="block text-sm font-semibold text-gray-900 truncate">{p.name}</span>
                  <span className="block text-xs text-gray-500">
                    {valid.length} servicios{missing > 0 ? ` · ${missing} no existen en el catálogo` : ''} · {formatCLP(valid.reduce((s, n) => s + servicePriceOf(n), 0))}
                  </span>
                </button>
                <button onClick={() => { saveServicePackages(packages.filter(x => x.id !== p.id)); bump(); }}
                  title="Eliminar paquete" className="p-1.5 rounded-lg text-gray-400 hover:bg-red-600 hover:text-white transition-colors">
                  <Trash2 className="w-4 h-4" />
                </button>
              </div>
              {open && (
                <div className="px-3 pb-3 space-y-2 border-t border-gray-100 pt-2">
                  <label className="block">
                    <span className="block text-[11px] text-gray-500 mb-0.5">Nombre del paquete</span>
                    <input value={p.name} onChange={(e) => savePkg(p.id, { name: e.target.value })}
                      className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" />
                  </label>
                  <label className="block">
                    <span className="block text-[11px] text-gray-500 mb-0.5">Descripción (opcional)</span>
                    <input value={p.note || ''} onChange={(e) => savePkg(p.id, { note: e.target.value })}
                      className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" />
                  </label>
                  <div>
                    <span className="block text-[11px] text-gray-500 mb-1">Servicios incluidos</span>
                    <div className="space-y-1">
                      {(p.services || []).map((s, i) => {
                        const exists = services.some(x => x.trim().toLowerCase() === String(s).trim().toLowerCase());
                        return (
                          <div key={s + i} className={`flex items-center justify-between gap-2 rounded-lg px-2.5 py-1.5 ${exists ? 'bg-gray-50' : 'bg-amber-50 border border-amber-200'}`}>
                            <span className={`text-xs break-words ${exists ? 'text-gray-700' : 'text-amber-800'}`}>
                              {s}{!exists && ' · no está en el catálogo'}
                            </span>
                            <button onClick={() => savePkg(p.id, { services: (p.services || []).filter((_, idx) => idx !== i) })}
                              className="p-1 rounded text-gray-400 hover:text-red-600 shrink-0"><X className="w-3.5 h-3.5" /></button>
                          </div>
                        );
                      })}
                      {(p.services || []).length === 0 && <p className="text-xs text-gray-400">Aún sin servicios.</p>}
                    </div>
                  </div>
                  <div className="relative">
                    <input value={addQuery} onChange={(e) => setAddQuery(e.target.value)}
                      placeholder="Agregar servicio: escribe para buscar…"
                      className="w-full px-3 py-2 border border-blue-300 rounded-lg text-sm" />
                    {candidates.length > 0 && (
                      <div className="absolute z-10 left-0 right-0 mt-1 border border-gray-200 rounded-lg bg-white shadow-lg max-h-56 overflow-auto divide-y divide-gray-100">
                        {candidates.map(s => (
                          <button key={s} onClick={() => { savePkg(p.id, { services: [...(p.services || []), s] }); setAddQuery(''); }}
                            className="w-full text-left px-3 py-2 text-xs hover:bg-blue-50">
                            <span className="block text-gray-800">{s}</span>
                            <span className="block text-gray-400">{serviceMetaOf(s).group} · {serviceMetaOf(s).vehicle}</span>
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              )}
            </div>
          );
        })}
        {packages.length === 0 && <p className="text-xs text-gray-400">No hay paquetes. Crea el primero arriba.</p>}
      </div>
    </div>
  );
}

function UserManagement() {
  const currentUser = getCurrentUser();
  const [version, setVersion] = useState(0);
  const refresh = () => setVersion(v => v + 1);

  const canCreate = canCreateUsers(currentUser);
  const canToggle = canToggleUserActive(currentUser);
  const canEdit = canEditUsers(currentUser);
  const canDelete = canDeleteUsers(currentUser);

  const [showForm, setShowForm] = useState(false);
  const [name, setName] = useState('');
  const [email, setEmail] = useState('');
  const [rut, setRut] = useState('');
  const [password, setPassword] = useState('');
  const [role, setRole] = useState<User['role']>('mechanic');
  const [branch, setBranch] = useState(getBranches()[0] || '');

  // Inline edit state (support admin)
  const [editingId, setEditingId] = useState<string | null>(null);
  const [eName, setEName] = useState('');
  const [eEmail, setEEmail] = useState('');
  const [eRut, setERut] = useState('');
  const [ePassword, setEPassword] = useState('');
  const [eRole, setERole] = useState<User['role']>('mechanic');
  const [eBranch, setEBranch] = useState(getBranches()[0] || '');

  // Delete confirmation
  const [confirmDelete, setConfirmDelete] = useState<User | null>(null);
  // Bulk import (Excel)
  const [bulkDrafts, setBulkDrafts] = useState<UserDraft[] | null>(null);
  const [bulkBusy, setBulkBusy] = useState(false);
  // New branch (support admin)
  const [newBranch, setNewBranch] = useState('');
  // Services catalog (support admin)
  const [newService, setNewService] = useState('');
  const [editingService, setEditingService] = useState<string | null>(null);
  const [editServiceName, setEditServiceName] = useState('');
  // Filtros y selección múltiple del catálogo de servicios (son muchos).
  const [svcQuery, setSvcQuery] = useState('');
  const [svcGroup, setSvcGroup] = useState('');
  const [svcVehicle, setSvcVehicle] = useState('Todos');
  const [svcSel, setSvcSel] = useState<string[]>([]);
  const [svcConfirmBulk, setSvcConfirmBulk] = useState(false);
  // Listas de precios (servicios) y catálogo de productos.
  const [pricesBusy, setPricesBusy] = useState(false);
  const [productRows, setProductRows] = useState<Record<string, string>[] | null>(null);
  const [productCount, setProductCount] = useState(0);
  const [newPriceCat, setNewPriceCat] = useState('');
  const canPrices = canManagePrices(currentUser);

  const handleAddService = () => {
    const res = addServiceType(newService);
    if (!res.ok) { toast.error(res.error || 'No se pudo crear'); return; }
    toast.success(`Servicio "${newService.trim()}" agregado`);
    logAudit('Servicio', `Agregó el servicio "${newService.trim()}"`);
    setNewService('');
    refresh();
  };
  const handleSaveService = (oldName: string) => {
    const res = renameServiceType(oldName, editServiceName);
    if (!res.ok) { toast.error(res.error || 'No se pudo editar'); return; }
    toast.success('Servicio actualizado');
    logAudit('Servicio', `Renombró el servicio "${oldName}" a "${editServiceName.trim()}"`);
    setEditingService(null);
    refresh();
  };
  const handleDeleteService = (name: string) => {
    const res = deleteServiceType(name);
    if (!res.ok) { toast.error(res.error || 'No se pudo eliminar'); return; }
    toast.success(`Servicio "${name}" eliminado`);
    logAudit('Servicio', `Eliminó el servicio "${name}"`);
    refresh();
  };

  const handleAddBranch = () => {
    const res = addBranch(newBranch);
    if (!res.ok) { toast.error(res.error || 'No se pudo crear la sucursal'); return; }
    toast.success(`Sucursal "${newBranch.trim()}" creada`);
    logAudit('Sucursal', `Creó la sucursal "${newBranch.trim()}"`);
    setNewBranch('');
    refresh();
  };

  const users = getUsers();
  const activeCount = users.filter(u => u.active !== false).length;

  const [searchTerm, setSearchTerm] = useState('');
  const [filterBranch, setFilterBranch] = useState('');
  const [filterRole, setFilterRole] = useState('');

  const term = searchTerm.trim().toLowerCase();
  const filteredUsers = users.filter(u => {
    if (filterBranch && u.branch !== filterBranch) return false;
    if (filterRole && u.role !== filterRole) return false;
    if (term && !(u.name.toLowerCase().includes(term) || (u.email || '').toLowerCase().includes(term) || (u.rut || '').toLowerCase().includes(term))) return false;
    return true;
  });
  const hasFilters = !!(term || filterBranch || filterRole);

  const resetForm = () => {
    setName(''); setEmail(''); setRut(''); setPassword(''); setRole('mechanic'); setBranch(getBranches()[0] || '');
  };

  const handleCreate = () => {
    if (!name.trim() || !password.trim()) {
      toast.error('Nombre y contraseña son obligatorios');
      return;
    }
    // Las sucursales vienen de la nube: sin ellas cargadas no se puede asignar.
    if (!branch) {
      toast.error('Aún no se cargan las sucursales. Reintente en unos segundos.');
      return;
    }
    if (!email.trim() && !rut.trim()) {
      toast.error('Ingrese un correo o un RUT para poder iniciar sesión');
      return;
    }
    if (role === 'mechanic' && !rut.trim()) {
      toast.error('El RUT es obligatorio para los mecánicos');
      return;
    }
    const created = createUser({ name: name.trim(), email, rut: rut.trim(), password, role, branch });
    if (!created) {
      toast.error('Ya existe un usuario con ese correo o RUT');
      return;
    }
    toast.success(`Usuario ${created.name} creado`);
    logAudit('Usuario', `Creó al usuario ${created.name} (${getRoleLabel(created.role)}, ${created.branch})`);
    // Confirma que la fila llegó de verdad a Supabase (antes fallaba en silencio).
    const _sync: any = (window as any).FNSync;
    if (_sync && _sync.verifyRow) {
      _sync.verifyRow('users', created.id).then((r: any) => {
        if (r.ok) toast.success(`${created.name} guardado en la nube (Supabase)`);
        else toast.error(`⚠️ ${created.name} quedó solo en este dispositivo. La nube rechazó el guardado${r.error ? ': ' + r.error : ''}`);
      });
    }
    resetForm();
    setShowForm(false);
    refresh();
  };

  const handleBulkFile = async (e: React.ChangeEvent<HTMLInputElement>) => {
    const file = e.target.files?.[0];
    e.target.value = '';
    if (!file) return;
    setBulkBusy(true);
    setBulkDrafts(null);
    try {
      const buf = await file.arrayBuffer();
      const rows = await parseXlsxRows(buf);
      const drafts = usersFromWorkbookRows(rows);
      if (!drafts.length) { toast.error('No se encontraron usuarios en el archivo'); return; }
      setBulkDrafts(drafts);
    } catch (err: any) {
      toast.error('No se pudo leer el archivo: ' + (err?.message || err));
    } finally {
      setBulkBusy(false);
    }
  };

  const confirmBulk = (mode: 'replace' | 'merge') => {
    if (!bulkDrafts) return;
    const res = applyImportedUsers(bulkDrafts, mode);
    toast.success(`${res.total} usuarios en total · ${res.created} nuevos, ${res.updated} actualizados`);
    logAudit('Usuario', `Carga masiva (${mode === 'replace' ? 'reemplazo total' : 'fusión'}): ${bulkDrafts.length} filas del Excel`);
    setBulkDrafts(null);
    refresh();
  };

  // ---- Listas de precios (Excel) ----
  const handleServicePriceFile = async (e: React.ChangeEvent<HTMLInputElement>) => {
    const file = e.target.files?.[0]; e.target.value = ''; if (!file) return;
    setPricesBusy(true);
    try {
      const rows = await parseXlsxRows(await file.arrayBuffer());
      const res = importServicePricesFromRows(rows);
      if (!res.count) { toast.error('No se encontraron servicios con precio en el archivo'); return; }
      toast.success(`${res.count} servicios con precio cargados${res.added ? ` · ${res.added} nuevos` : ''}`);
      logAudit('Servicio', `Cargó lista de precios de servicios (${res.count} filas)`);
      refresh();
    } catch (err: any) { toast.error('No se pudo leer el archivo: ' + (err?.message || err)); }
    finally { setPricesBusy(false); }
  };

  const handleProductFile = async (e: React.ChangeEvent<HTMLInputElement>) => {
    const file = e.target.files?.[0]; e.target.value = ''; if (!file) return;
    setPricesBusy(true); setProductRows(null); setProductCount(0);
    try {
      const rows = await parseXlsxRows(await file.arrayBuffer());
      const count = Math.max(0, rows.length - 1);
      if (count <= 0) { toast.error('El archivo no tiene productos'); return; }
      setProductRows(rows); setProductCount(count);
    } catch (err: any) { toast.error('No se pudo leer el archivo: ' + (err?.message || err)); }
    finally { setPricesBusy(false); }
  };

  const confirmProducts = (mode: 'replace' | 'merge') => {
    if (!productRows) return;
    const res = importProductsFromRows(productRows, mode);
    toast.success(`${res.count} productos ${mode === 'replace' ? 'cargados (reemplazo total)' : 'agregados/actualizados'}${res.categories.length ? ` · categorías: ${res.categories.join(', ')}` : ''}`);
    logAudit('Servicio', `Cargó catálogo de productos (${res.count}, ${mode})`);
    setProductRows(null); setProductCount(0);
    refresh();
  };

  const addPriceCat = () => {
    const c = newPriceCat.trim(); if (!c) return;
    const list = getPriceCategories();
    if (list.some(x => x.toLowerCase() === c.toLowerCase())) { toast.error('Esa categoría ya existe'); return; }
    savePriceCategories([...list, c]); setNewPriceCat(''); refresh();
  };
  const removePriceCat = (c: string) => {
    const list = getPriceCategories().filter(x => x !== c);
    savePriceCategories(list.length ? list : DEFAULT_PRICE_CATEGORIES); refresh();
  };

  const handleToggleActive = (u: User) => {
    if (u.id === currentUser?.id) {
      toast.error('No puede desactivar su propia cuenta');
      return;
    }
    // The global admin cannot deactivate a support admin (only support manages support).
    const willActivate = u.active === false;
    if (!willActivate && u.role === 'soporte' && currentUser?.role === 'admin') {
      toast.error('El Admin Global no puede desactivar a un Administrador Central');
      return;
    }
    setUserActive(u.id, willActivate);
    toast.success(willActivate ? `${u.name} activado` : `${u.name} desactivado`);
    logAudit('Usuario', `${willActivate ? 'Activó' : 'Desactivó'} al usuario ${u.name} (${getRoleLabel(u.role)})`);
    refresh();
  };

  const startEdit = (u: User) => {
    setEditingId(u.id);
    setEName(u.name);
    setEEmail(u.email);
    setERut(u.rut || '');
    setEPassword('');
    setERole(u.role);
    setEBranch(getBranches().includes(u.branch) ? u.branch : (getBranches()[0] || ''));
    setShowForm(false);
  };

  const handleSaveEdit = (id: string) => {
    if (!eName.trim()) {
      toast.error('El nombre es obligatorio');
      return;
    }
    if (!eEmail.trim() && !eRut.trim()) {
      toast.error('Ingrese un correo o un RUT para poder iniciar sesión');
      return;
    }
    if (eRole === 'mechanic' && !eRut.trim()) {
      toast.error('El RUT es obligatorio para los mecánicos');
      return;
    }
    const res = updateUser(id, { name: eName.trim(), email: eEmail, rut: eRut.trim(), role: eRole, branch: eBranch, ...(ePassword.trim() ? { password: ePassword.trim() } : {}) });
    if (!res.ok) {
      toast.error(res.error || 'No se pudo actualizar');
      return;
    }
    toast.success('Usuario actualizado');
    logAudit('Usuario', `Editó los datos del usuario ${eName.trim()}`);
    setEditingId(null);
    refresh();
  };

  const handleConfirmDelete = () => {
    if (!confirmDelete) return;
    if (confirmDelete.id === currentUser?.id) {
      toast.error('No puede eliminar su propia cuenta');
      setConfirmDelete(null);
      return;
    }
    const res = deleteUserPermanently(confirmDelete.id);
    if (!res.ok) {
      toast.error(res.error || 'No se pudo eliminar');
    } else {
      toast.success(`${confirmDelete.name} eliminado definitivamente`);
      logAudit('Usuario', `Eliminó definitivamente al usuario ${confirmDelete.name}`);
    }
    setConfirmDelete(null);
    refresh();
  };

  const roleAvatar = (r: string) =>
    r === 'admin' ? 'bg-yellow-100 text-yellow-700'
    : r === 'soporte' ? 'bg-purple-100 text-purple-700'
    : r === 'admin2' ? 'bg-green-100 text-green-700'
    : 'bg-blue-100 text-blue-700';

  // Soporte gets two sub-sections: "Usuarios" and "Configuración" (sucursales + servicios).
  // "Precios" (listas de precios y productos) lo ven soporte y los admin de casa matriz.
  const [section, setSection] = useState<'users' | 'config' | 'prices'>('users');
  // Long user list: group by branch, collapsible (expanded when a filter is active).
  const [expandedGroups, setExpandedGroups] = useState<Record<string, boolean>>({});
  const branchKey = (u: User) => u.branch || 'Sin sucursal';
  const groupedBranches = Array.from(new Set(filteredUsers.map(branchKey)))
    .sort((a, b) => {
      const order = getBranches();
      const ia = order.indexOf(a), ib = order.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
  const isGroupOpen = (b: string) => hasFilters ? true : !!expandedGroups[b];

  return (
    <div className="p-4 pb-24">
      <div className="flex items-center justify-between mb-1">
        <h2 className="text-2xl font-bold text-gray-900">Usuarios</h2>
        {canCreate && section === 'users' && (
          <button
            onClick={() => { setShowForm(s => !s); resetForm(); setEditingId(null); }}
            className="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-blue-700 transition-colors flex items-center gap-2"
          >
            {showForm ? <X className="w-4 h-4" /> : <UserPlus className="w-4 h-4" />}
            {showForm ? 'Cerrar' : 'Nuevo'}
          </button>
        )}
      </div>
      <p className="text-sm text-gray-600 mb-2">{activeCount} de {users.length} cuentas activas</p>

      {(canEdit || canPrices) && (
        <div className="flex gap-2 mb-4">
          <button onClick={() => setSection('users')}
            className={`flex-1 py-2 rounded-lg text-sm font-medium transition-colors ${section === 'users' ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}>
            Usuarios
          </button>
          {canEdit && (
            <button onClick={() => setSection('config')}
              className={`flex-1 py-2 rounded-lg text-sm font-medium transition-colors ${section === 'config' ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}>
              Configuración
            </button>
          )}
          {canPrices && (
            <button onClick={() => setSection('prices')}
              className={`flex-1 py-2 rounded-lg text-sm font-medium transition-colors ${section === 'prices' ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}>
              Precios
            </button>
          )}
        </div>
      )}

      {section === 'users' && (
      <div className="bg-white rounded-lg shadow p-3 mb-4 space-y-3">
        <div className="relative">
          <Search className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-4 h-4" />
          <input
            type="text"
            value={searchTerm}
            onChange={(e) => setSearchTerm(e.target.value)}
            placeholder="Buscar por nombre o correo..."
            className="w-full pl-9 pr-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          />
        </div>
        <div className="grid grid-cols-2 gap-2">
          <select value={filterBranch} onChange={(e) => setFilterBranch(e.target.value)}
            className="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            <option value="">Todas las sucursales</option>
            {getBranches().map(b => <option key={b} value={b}>{b}</option>)}
          </select>
          <select value={filterRole} onChange={(e) => setFilterRole(e.target.value)}
            className="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            <option value="">Todos los roles</option>
            {ASSIGNABLE_ROLES.map(r => <option key={r.value} value={r.value}>{r.label}</option>)}
          </select>
        </div>
        {hasFilters && (
          <div className="flex items-center justify-between">
            <p className="text-xs text-gray-500">{filteredUsers.length} de {users.length} usuario(s)</p>
            <button onClick={() => { setSearchTerm(''); setFilterBranch(''); setFilterRole(''); }}
              className="text-xs text-blue-600 font-medium hover:text-blue-700">Limpiar filtros</button>
          </div>
        )}
      </div>
      )}
      {section === 'users' && canEdit && (
        <div className="bg-purple-50 border border-purple-200 rounded-lg p-3 mb-4 flex items-start gap-2">
          <Shield className="w-4 h-4 text-purple-600 mt-0.5 shrink-0" />
          <p className="text-xs text-purple-700">
            Como <span className="font-semibold">Administrador Central</span> puedes editar cualquier dato de un usuario
            (rol, contraseña, correo, sucursal) y eliminarlo definitivamente. La información que el usuario
            ingresó se conserva; su nombre quedará marcado como eliminado.
          </p>
        </div>
      )}

      {section === 'config' && canEdit && (
        <div className="bg-white rounded-lg shadow p-4 mb-6 border border-purple-100">
          <h3 className="text-lg font-semibold text-gray-900 flex items-center gap-2 mb-1">
            <MapPin className="w-5 h-5 text-purple-600" /> Sucursales
          </h3>
          <p className="text-sm text-gray-600 mb-3">Crea nuevas sucursales disponibles para usuarios, servicios y reportes.</p>
          <div className="flex gap-2 mb-3">
            <input
              type="text"
              value={newBranch}
              onChange={(e) => setNewBranch(e.target.value)}
              onKeyDown={(e) => e.key === 'Enter' && handleAddBranch()}
              placeholder="Nombre de la nueva sucursal"
              className="flex-1 px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
            />

              className="bg-purple-600 text-white px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-purple-700 transition-colors flex items-center gap-1.5">
              <Plus className="w-4 h-4" /> Crear
            </button>

                    const res = deleteBranch(b);
                    if (!res.ok) { toast.error(res.error || 'No se pudo eliminar'); return; }
                    toast.success(`Sucursal "${b}" eliminada`);
                    logAudit('Sucursal', `Eliminó la sucursal "${b}"`);

                  <X className="w-3 h-3" />
                </button>
              </span>
            ))}
          </div>
        </div>

          {(() => {
            const all = getServiceTypes();
            const metaOf = (s: string) => serviceMetaOf(s);
            const q = svcQuery.trim().toLowerCase();
            const shown = all.filter(s => {
              const m = metaOf(s);
              if (svcVehicle !== 'Todos' && m.vehicle !== svcVehicle) return false;
              if (svcGroup && m.group !== svcGroup) return false;
              if (q && !s.toLowerCase().includes(q)) return false;
              return true;

            const groupsPresent = [...new Set(all.map(s => metaOf(s).group))].sort();
            const allShownSel = shown.length > 0 && shown.every(s => svcSel.includes(s));
            const toggle = (s: string) => setSvcSel(v => v.includes(s) ? v.filter(x => x !== s) : [...v, s]);
            return (
              <>
                <div className="flex flex-wrap gap-2 mb-2">
                  <input value={svcQuery} onChange={(e) => setSvcQuery(e.target.value)} placeholder="Buscar servicio…"
                    className="flex-1 min-w-[160px] px-3 py-2 border border-gray-300 rounded-lg text-sm" />
                  <select value={svcGroup} onChange={(e) => setSvcGroup(e.target.value)}
                    className="px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white">
                    <option value="">Todas las categorías</option>
                    {groupsPresent.map(g => <option key={g} value={g}>{g}</option>)}
                  </select>
                  <select value={svcVehicle} onChange={(e) => setSvcVehicle(e.target.value)}
                    className="px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white">
                    {VEHICLE_CLASSES.map(v => <option key={v} value={v}>{v === 'Todos' ? 'Todos los vehículos' : v}</option>)}

                <div className="flex items-center justify-between mb-2 text-xs">
                  <label className="flex items-center gap-2 text-gray-600">
                    <input type="checkbox" checked={allShownSel} onChange={() => setSvcSel(allShownSel ? [] : shown)} className="rounded" />
                    Seleccionar los {shown.length} visibles
                  </label>
                  {svcSel.length > 0 && (
                    <button onClick={() => setSvcConfirmBulk(true)}
                      className="bg-red-600 text-white px-3 py-1.5 rounded-lg font-medium hover:bg-red-700 flex items-center gap-1.5">
                      <Trash2 className="w-3.5 h-3.5" /> Eliminar {svcSel.length} seleccionados
                    </button>
                  )}
                </div>
                {svcConfirmBulk && (
                  <div className="bg-red-50 border border-red-200 rounded-lg p-3 mb-2">
                    <p className="text-sm text-red-800 mb-2">¿Eliminar <span className="font-semibold">{svcSel.length}</span> servicios del catálogo? Las órdenes ya registradas conservan su texto.</p>
                    <div className="flex gap-2">
                      <button onClick={() => {
                        const res = deleteServiceTypes(svcSel);
                        if (!res.ok) { toast.error(res.error || 'No se pudo eliminar'); return; }
                        toast.success(`${res.removed} servicios eliminados`);
                        setSvcSel([]); setSvcConfirmBulk(false); refresh();
                      }} className="bg-red-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-red-700">Sí, eliminar</button>
                      <button onClick={() => setSvcConfirmBulk(false)} className="bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-sm font-medium">Cancelar</button>
                    </div>
                  </div>
                )}
                <div className="space-y-2 max-h-[28rem] overflow-auto pr-0.5">
                  {shown.map((s) => (
                    editingService === s ? (
                      <div key={s} className="flex gap-2 items-center">
                        <input
                          type="text"
                          value={editServiceName}
                          onChange={(e) => setEditServiceName(e.target.value)}
                          onKeyDown={(e) => e.key === 'Enter' && handleSaveService(s)}
                          className="flex-1 px-3 py-2 border border-purple-300 rounded-lg text-sm focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                        />
                        <button onClick={() => handleSaveService(s)} className="bg-purple-600 text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-purple-700">Guardar</button>
                        <button onClick={() => setEditingService(null)} className="bg-gray-200 text-gray-700 px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-300">Cancelar</button>
                      </div>
                    ) : (
                      <div key={s} className="bg-gray-50 rounded-lg px-3 py-2">
                        <div className="flex items-start justify-between gap-2">
                          <label className="flex items-start gap-2 min-w-0">
                            <input type="checkbox" checked={svcSel.includes(s)} onChange={() => toggle(s)} className="rounded mt-0.5" />
                            <span className="text-sm text-gray-800 break-words">{s}</span>
                          </label>
                          <div className="flex items-center gap-1 shrink-0">
                            <button
                              onClick={() => { setEditingService(s); setEditServiceName(s); }}
                              title="Editar servicio"
                              className="p-1.5 rounded-lg text-blue-600 hover:bg-blue-100 transition-colors"
                            >
                              <Pencil className="w-4 h-4" />
                            </button>
                            <button
                              onClick={() => handleDeleteService(s)}
                              title="Eliminar servicio"
                              className="p-1.5 rounded-lg text-gray-400 hover:bg-red-600 hover:text-white transition-colors"
                            >
                              <Trash2 className="w-4 h-4" />
                            </button>
                          </div>
                        </div>
                        <div className="grid grid-cols-2 gap-2 mt-2">
                          <label className="block">
                            <span className="block text-[11px] text-gray-500 mb-0.5">Categoría</span>
                            <select value={metaOf(s).group} onChange={(e) => { setServiceMeta(s, { group: e.target.value }); refresh(); }}
                              className="w-full px-2 py-1.5 border border-gray-300 rounded-lg text-xs bg-white">
                              {[...new Set([...getServiceGroups(), metaOf(s).group])].map(g => <option key={g} value={g}>{g}</option>)}
                            </select>
                          </label>
                          <label className="block">
                            <span className="block text-[11px] text-gray-500 mb-0.5">Tipo de vehículo</span>
                            <select value={metaOf(s).vehicle} onChange={(e) => { setServiceMeta(s, { vehicle: e.target.value }); refresh(); }}
                              className="w-full px-2 py-1.5 border border-gray-300 rounded-lg text-xs bg-white">
                              {VEHICLE_CLASSES.map(v => <option key={v} value={v}>{v}</option>)}
                            </select>
                          </label>
                        </div>
                        <ServicePriceInputs name={s} categories={getPriceCategories()} />
                      </div>
                    )
                  ))}
                  {shown.length === 0 && <p className="text-xs text-gray-400 py-2">Ningún servicio con estos filtros.</p>}
                </div>
              </>
            );
          })()}
        </div>
      )}

      {section === 'config' && canEdit && <PackageManager onChanged={refresh} />}

      {section === 'config' && canEdit && (
        <div className="bg-white rounded-lg shadow p-4 mb-6 border border-gray-200">
          <h3 className="text-lg font-semibold text-gray-900 flex items-center gap-2 mb-1">
            <FileText className="w-5 h-5 text-gray-600" /> Precios en los PDF
          </h3>
          <p className="text-sm text-gray-600 mb-3">Por defecto <span className="font-medium">ningún PDF muestra precios</span>. Actívalos solo si lo necesitas.</p>
          {(() => {
            const cfg = getPdfPriceCfg();
            const set = (patch: any) => { savePdfPriceCfg({ ...cfg, ...patch }); refresh(); };
            return (
              <div className="space-y-2">
                <label className="flex items-start gap-2.5 bg-gray-50 border border-gray-200 rounded-lg p-3 cursor-pointer">
                  <input type="checkbox" checked={cfg.inspection} onChange={(e) => set({ inspection: e.target.checked })} className="rounded mt-0.5" />
                  <span className="text-sm text-gray-700">Mostrar precios en el informe de inspección
                    <span className="block text-xs text-gray-500 mt-0.5">Desactivado: el PDF y el enlace/QR del cliente salen sin montos.</span>
                  </span>
                </label>
                <label className="flex items-start gap-2.5 bg-gray-50 border border-gray-200 rounded-lg p-3 cursor-pointer">
                  <input type="checkbox" checked={cfg.quote} onChange={(e) => set({ quote: e.target.checked })} className="rounded mt-0.5" />
                  <span className="text-sm text-gray-700">Mostrar precios en cotizaciones y comprobantes
                    <span className="block text-xs text-gray-500 mt-0.5">Desactivado: los montos aparecen como “—”.</span>
                  </span>
                </label>
              </div>

          })()}
        </div>
      )}

      {section === 'prices' && canPrices && (
        <div className="space-y-6">

          <div className="bg-white rounded-lg shadow p-4 border border-blue-100 space-y-3">

              <DollarSign className="w-5 h-5 text-blue-600" /> Precios de servicios
