              {isMechanic && serviceOrder ? 'Completar inspección' : 'Guardar Inspección'}
            </button>
          </div>
        </div>
      )}

      {freeOrderToInspect && (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50" onClick={() => { setFreeOrderToInspect(null); onComplete(); }}>
          <div className="bg-white rounded-lg shadow-xl p-6 w-full max-w-sm" onClick={(e) => e.stopPropagation()}>
            <h3 className="text-lg font-semibold text-gray-900 mb-2">Asignación libre</h3>
            <p className="text-sm text-gray-600 mb-4">
              El servicio quedó como <span className="font-semibold">Libre</span>, así que cualquier mecánico puede tomarlo.
              ¿Deseas realizar tú la inspección ahora?
            </p>
            <div className="flex gap-2">
              <button onClick={() => {
                  const o = freeOrderToInspect;
                  updateInspection(o.id, { mechanic: user?.name || '', mechanicId: user?.id || '' });
                  setTakenOrder({ ...o, mechanic: user?.name || '', mechanicId: user?.id || '' });
                  setFreeOrderToInspect(null);
                  setStep(3);
                }}
                className="flex-1 bg-blue-600 text-white py-2.5 rounded-lg text-sm font-medium hover:bg-blue-700 transition-colors">
                Sí, inspeccionar ahora
              </button>
              <button onClick={() => { setFreeOrderToInspect(null); onComplete(); }}
                className="flex-1 bg-gray-200 text-gray-700 py-2.5 rounded-lg text-sm font-medium hover:bg-gray-300 transition-colors">
                Dejar libre
              </button>
            </div>
          </div>
        </div>
      )}

      {zeroPwdOpen && (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50" onClick={() => setZeroPwdOpen(false)}>
          <div className="bg-white rounded-lg shadow-xl p-6 w-full max-w-sm" onClick={(e) => e.stopPropagation()}>
            <h3 className="text-lg font-semibold text-gray-900 mb-2">Autorizar servicio $0</h3>
            <p className="text-sm text-gray-600 mb-4">
              Los servicios con costo $0 están prohibidos. Solo el Admin Global puede autorizarlo
              ingresando la contraseña de autorización.
            </p>
            <input
              type="password"
              value={zeroPwd}
              onChange={(e) => setZeroPwd(e.target.value)}
              onKeyDown={(e) => e.key === 'Enter' && confirmZeroAuthorization()}
              placeholder="Contraseña de autorización"
              className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent mb-4"
              autoFocus
            />
            <div className="flex gap-2">
              <button onClick={confirmZeroAuthorization}
                className="flex-1 bg-blue-600 text-white py-2.5 rounded-lg text-sm font-medium hover:bg-blue-700 transition-colors">
                Autorizar
              </button>
              <button onClick={() => setZeroPwdOpen(false)}
                className="flex-1 bg-gray-200 text-gray-700 py-2.5 rounded-lg text-sm font-medium hover:bg-gray-300 transition-colors">
                Cancelar
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}


/* ===== SearchVehicle ===== */

function SearchVehicle({ embedded, initialPlate }: { embedded?: boolean; initialPlate?: string } = {}) {
  const user = getCurrentUser();
  const [searchPlate, setSearchPlate] = useState('');
  const [inspections, setInspections] = useState<any[]>([]);
  const [vehicle, setVehicle] = useState<any>(null);
  const [expandedId, setExpandedId] = useState<string | null>(null);
  const [shareInspection, setShareInspection] = useState<any>(null);
  const [confirmDeleteIns, setConfirmDeleteIns] = useState<any>(null);
  const [editingVehicle, setEditingVehicle] = useState(false);
  const [vForm, setVForm] = useState<any>({});
  const [matchedVehicles, setMatchedVehicles] = useState<any[]>([]);
  const df = useDateFilter();

  const loadVehicle = (plate: string) => {
    const p = plate.toUpperCase();
    let ins = getInspectionsByPlate(p);
    if (!canSeeAllBranches(user)) ins = ins.filter(i => i.branch === user?.branch);
    setInspections(ins);
    setVehicle(getVehicle(p));
    setSearchPlate(p);
    setExpandedId(null);
  };

  // Abierto desde otra pantalla (p. ej. Ventas) ya apuntando a un vehículo.
  useEffect(() => {
    if (initialPlate) loadVehicle(initialPlate);
  }, [initialPlate]);

  const startEditVehicle = () => {
    setVForm({
      licensePlate: vehicle.licensePlate,
      clientName: vehicle.clientName || '',
      phoneNumber: vehicle.phoneNumber || '',
      email: vehicle.email || '',
      vehicleModel: vehicle.vehicleModel || '',
      notes: vehicle.notes || '',
      mileage: (vehicle as any).mileage || '',
      dataConsent: !!vehicle.dataConsent,
    });
    setEditingVehicle(true);
  };

  const saveVehicleEdit = () => {
    if (!vForm.clientName?.trim()) { toast.error('El nombre del cliente es obligatorio'); return; }
    const res = updateVehicleRecord(vehicle.licensePlate, {
      licensePlate: vForm.licensePlate,
      clientName: vForm.clientName,
      phoneNumber: vForm.phoneNumber,
      email: vForm.email,
      vehicleModel: vForm.vehicleModel,
      notes: vForm.notes,
      mileage: vForm.mileage,
      dataConsent: vForm.dataConsent,
      dataConsentAt: vForm.dataConsent ? (vehicle.dataConsentAt || new Date().toISOString()) : undefined,
    });
    if (!res.ok) { toast.error(res.error || 'No se pudo actualizar'); return; }
    toast.success('Vehículo actualizado');
    setEditingVehicle(false);
    const newPlate = (vForm.licensePlate || vehicle.licensePlate).toUpperCase().trim();
    setSearchPlate(newPlate);
    setVehicle(getVehicle(newPlate));
    setInspections(getInspectionsByPlate(newPlate).filter(i => canSeeAllBranches(user) || i.branch === user?.branch));
  };

  const shownInspections = inspections.filter(i => df.match(i.serviceDate || i.date));

  const handleSearch = () => {
    const term = searchPlate.trim().toUpperCase();
    if (!term) return;
    // Search by plate OR client name; branch-scoped for non-HQ users.
    const allV = getVehicles().filter(v => canSeeAllBranches(user) || branchOfPerson(v.createdBy) === user?.branch);
    const matches = allV.filter(v =>
      v.licensePlate.toUpperCase().includes(term) || (v.clientName || '').toUpperCase().includes(term)
    );
    setMatchedVehicles(matches);
    if (matches.length === 1) {
      loadVehicle(matches[0].licensePlate);
    } else {
      // 0 or many: clear current selection (a chooser is shown when there are many)
      setVehicle(null);
      setInspections([]);
      setExpandedId(null);
    }
  };

  const handleDeleteInspection = () => {
    if (!confirmDeleteIns) return;
    deleteInspection(confirmDeleteIns.id);
    toast.success('Inspección eliminada');
    setInspections(prev => prev.filter(i => i.id !== confirmDeleteIns.id));
    setConfirmDeleteIns(null);
  };

  const toggleExpand = (id: string) => {
    setExpandedId(expandedId === id ? null : id);
  };

  return (
    <div className={embedded ? '' : 'p-4 pb-24'}>
      <h2 className="text-2xl font-bold text-gray-900 mb-6">
        {embedded
          ? (canViewAllInspections(user) ? 'Buscar Vehículo' : 'Buscar en Mis Vehículos')
          : (canViewAllInspections(user) ? 'Buscar Vehículo' : 'Mis Vehículos')}
      </h2>

      <div className="mb-6">
        <div className="flex gap-2">
          <input
            type="text"
            id="home-search-input"
            value={searchPlate}
            onChange={(e) => setSearchPlate(e.target.value.toUpperCase())}
            onKeyPress={(e) => e.key === 'Enter' && handleSearch()}
            placeholder="Patente o nombre del cliente"
            className="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent uppercase"
          />
          <button
            onClick={handleSearch}
            className="bg-blue-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-blue-700 transition-colors flex items-center gap-2"
          >
            <Search className="w-5 h-5" />
            Buscar
          </button>
        </div>
      </div>

      {matchedVehicles.length > 1 && (
        <div className="bg-white rounded-lg shadow p-4 mb-6">
          <p className="text-sm font-semibold text-gray-900 mb-1">{matchedVehicles.length} vehículos encontrados</p>
          <p className="text-xs text-gray-500 mb-3">Este cliente/búsqueda tiene más de un vehículo. Selecciona uno:</p>
          <div className="space-y-2">
            {matchedVehicles.map((mv) => (
              <button key={mv.licensePlate} onClick={() => loadVehicle(mv.licensePlate)}
                className={`w-full text-left px-3 py-2.5 rounded-lg border-2 transition-colors flex items-center justify-between ${vehicle?.licensePlate === mv.licensePlate ? 'border-blue-600 bg-blue-50' : 'border-gray-200 hover:border-blue-400'}`}>
                <span>
                  <span className="font-semibold text-gray-900">{mv.licensePlate}</span>
                  <span className="text-sm text-gray-600"> · {mv.vehicleModel || 'Modelo s/i'}</span>
                  <span className="block text-xs text-gray-500">{mv.clientName}</span>
                </span>
                <ArrowRight className="w-4 h-4 text-gray-400 shrink-0" />
              </button>
            ))}
          </div>
        </div>
      )}

      {matchedVehicles.length === 0 && searchPlate.trim() && !vehicle && (
        <div className="bg-white rounded-lg shadow p-6 mb-6 text-center text-gray-500">
          No se encontraron vehículos para "{searchPlate}".
        </div>
      )}

      {vehicle && (
        <div className="bg-white rounded-lg shadow p-4 mb-6">
          <div className="flex items-center justify-between mb-3">
            <h3 className="font-semibold text-lg text-gray-900">Información del Vehículo</h3>
            {canEditVehicles(user) && !editingVehicle && (
              <button onClick={startEditVehicle}
                className="text-sm bg-blue-50 text-blue-600 px-3 py-1.5 rounded-lg font-medium hover:bg-blue-100 transition-colors flex items-center gap-1.5">

            <p className="text-sm text-gray-500 mt-2">

      {shareInspection && vehicle && (

      {confirmDeleteIns && (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50" onClick={() => setConfirmDeleteIns(null)}>

          </div>
        </div>
      )}

}


/* ===== Alerts ===== */

function Alerts({ onCreateQuote }: { onCreateQuote?: (plate: string) => void }) {
  const user = getCurrentUser();
  const [showAddForm, setShowAddForm] = useState(false);
  const [licensePlate, setLicensePlate] = useState('');
  const [nextMaintenanceDate, setNextMaintenanceDate] = useState('');
  const [notes, setNotes] = useState('');
  const [filter, setFilter] = useState<'pending' | 'completed' | 'emails'>('pending');
  const [version, setVersion] = useState(0);
  const [expandedEmail, setExpandedEmail] = useState<string | null>(null);
  const [branchFilter, setBranchFilter] = useState('');
  const refresh = () => setVersion(v => v + 1);

  // On entry, dispatch any due "por vencer" reminders (day before expiry).
  useEffect(() => {
    const sent = processExpiringAlerts();
    if (sent > 0) {
      toast.info(`${sent} recordatorio(s) de alerta por vencer enviado(s)`);
      refresh();
    }
  }, []);

  const allAlerts = getAlerts();
  let pendingAlerts = getPendingAlerts();
  let completedAlerts = allAlerts.filter(a => a.completed);
  // "Procesos futuros" belong only in Cotizaciones — never in the Correos outbox.
  let emails = getEmails().filter(e => e.type !== 'recommendation');

  // Branch isolation: HQ sees all (and may pick a branch); others see only theirs.
  const seeAll = canSeeAllBranches(user);
  const effBranch = seeAll ? branchFilter : (user?.branch || '');
  if (effBranch) {
    pendingAlerts = pendingAlerts.filter(a => branchOfPerson(a.createdBy) === effBranch);
    completedAlerts = completedAlerts.filter(a => branchOfPerson(a.createdBy) === effBranch);
    emails = emails.filter(e => branchOfPerson(e.createdBy) === effBranch);
  }

  const df = useDateFilter();
  pendingAlerts = pendingAlerts.filter(a => df.match(a.nextMaintenanceDate));
  completedAlerts = completedAlerts.filter(a => df.match(a.nextMaintenanceDate));
  emails = emails.filter(e => df.match(e.sentAt));
  const displayedAlerts = filter === 'pending' ? pendingAlerts : completedAlerts;

  const handleAddAlert = () => {
    if (!licensePlate || !nextMaintenanceDate) {
      toast.error('Patente y fecha son obligatorios');
      return;
    }

    const alert = {
      id: `ALERT-${Date.now()}`,
      licensePlate: licensePlate.toUpperCase(),
      nextMaintenanceDate,
      notes,
      completed: false,
      createdBy: user?.name || '',
      createdAt: new Date().toISOString(),
    };

    saveAlert(alert);
    // Notify by email that the alert was created...
    const createdEmail = sendAlertEmail('created', alert);
    updateAlert(alert.id, { createdEmailSent: true });
    // ...and if it's due tomorrow, the "por vencer" reminder goes out too.
    const expSent = processExpiringAlerts();

    const recipient = createdEmail.to || createdEmail.toName;
    toast.success(`Alerta creada · correo enviado a ${recipient}`);
    if (expSent > 0) toast.info('También se envió el recordatorio por vencer');

    setShowAddForm(false);
    setLicensePlate('');
    setNextMaintenanceDate('');
    setNotes('');
    refresh();
  };

  const handleCompleteAlert = (id: string) => {
    updateAlert(id, { completed: true });
    toast.success('Alerta marcada como completada');
    refresh();
  };

  const handleUncompleteAlert = (id: string) => {
    updateAlert(id, { completed: false });
    toast.success('Alerta marcada como pendiente');
    refresh();
  };

  const isOverdue = (date: string) => {
    return new Date(date) < new Date();
  };

  return (
    <div className="p-4 pb-24">
      <div className="flex items-center justify-between mb-6">
        <h2 className="text-2xl font-bold text-gray-900">
          {canViewAllAlerts(user) ? 'Alertas de Mantenimiento' : 'Mis Alertas'}
        </h2>
        <button
          onClick={() => setShowAddForm(!showAddForm)}
          className="bg-blue-600 text-white p-2 rounded-lg hover:bg-blue-700 transition-colors"
        >
          {showAddForm ? <X className="w-5 h-5" /> : <Plus className="w-5 h-5" />}
        </button>
      </div>

      {showAddForm && (
        <div className="bg-white rounded-lg shadow p-4 mb-6 space-y-4">
          <h3 className="font-semibold text-gray-900">Nueva Alerta</h3>

          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">
              Patente <span className="text-red-500">*</span>
            </label>
            <input
              type="text"
              value={licensePlate}
              onChange={(e) => setLicensePlate(e.target.value.toUpperCase())}
              className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent uppercase"
            />
          </div>

          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">
              Fecha de Próximo Mantenimiento <span className="text-red-500">*</span>
            </label>
            <div className="grid grid-cols-2 gap-2 mb-2">
              {[
                { label: 'A fin de mes', calc: () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth() + 1, 0); } },
                { label: 'En 3 meses', calc: () => { const d = new Date(); d.setMonth(d.getMonth() + 3); return d; } },
                { label: 'En 6 meses', calc: () => { const d = new Date(); d.setMonth(d.getMonth() + 6); return d; } },
                { label: 'En 1 año', calc: () => { const d = new Date(); d.setFullYear(d.getFullYear() + 1); return d; } },
              ].map((opt) => {
                const iso = (() => { const d = opt.calc(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; })();
                const active = nextMaintenanceDate === iso;
                return (
                  <button
                    key={opt.label}
                    type="button"
                    onClick={() => setNextMaintenanceDate(iso)}
                    className={`px-3 py-2 rounded-lg border-2 text-sm font-medium transition-colors ${
                      active ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-700 border-gray-300 hover:border-blue-600'
                    }`}
                  >
                    Avísame {opt.label.toLowerCase()}
                  </button>
                );
              })}
            </div>
            <input
              type="date"
              value={nextMaintenanceDate}
              onChange={(e) => setNextMaintenanceDate(e.target.value)}
              className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            />
            <p className="text-xs text-gray-500 mt-1">Usa una selección rápida o elige una fecha en el calendario.</p>
          </div>

          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">Notas</label>
            <textarea
              value={notes}
              onChange={(e) => setNotes(e.target.value)}
              rows={3}
              className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            />
          </div>

          <div className="flex gap-2">
            <button
              onClick={() => setShowAddForm(false)}
              className="flex-1 bg-gray-200 text-gray-700 py-2 rounded-lg font-medium hover:bg-gray-300 transition-colors"
            >
              Cancelar
            </button>
            <button
              onClick={handleAddAlert}
              className="flex-1 bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 transition-colors"
            >
              Guardar
            </button>
          </div>
        </div>
      )}

      <div className="bg-blue-50 border border-blue-200 rounded-lg p-3 mb-4 flex items-start gap-2">
        <Mail className="w-4 h-4 text-blue-600 mt-0.5 shrink-0" />
        <p className="text-xs text-blue-700">
          Las alertas notifican por correo al <span className="font-semibold">Admin de Ventas</span> (al crear y el día
          anterior al vencimiento) para que contacten al cliente. Revisa los envíos en la pestaña <span className="font-semibold">Correos</span>.
        </p>
      </div>

      <select value={branchFilter} onChange={(e) => setBranchFilter(e.target.value)}
        className={`w-full mb-3 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent ${seeAll ? '' : 'hidden'}`}>
        <option value="">Todas las sucursales</option>
        {getBranches().map(b => <option key={b} value={b}>{b}</option>)}
      </select>

      <DateFilterBar f={df} />

      <div className="flex gap-2 mb-4">
        <button
          onClick={() => setFilter('pending')}
          className={`flex-1 py-2 rounded-lg text-sm font-medium transition-colors ${
            filter === 'pending'
              ? 'bg-blue-600 text-white'
              : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
          }`}
        >
          Pendientes ({pendingAlerts.length})
        </button>
        <button

/* ===== Announcements (internal communications) ===== */

const ROLE_OPTIONS_FOR_ANN: { value: string; label: string }[] = [
  { value: 'mechanic', label: 'Mecánicos' },
  { value: 'admin2', label: 'Ventas' },
  { value: 'ventas', label: 'Ventas (operativo)' },
  { value: 'soporte', label: 'Administrador Central' },
  { value: 'admin', label: 'Admin Global' },
];

function Announcements() {
  const user = getCurrentUser();
  const [version, setVersion] = useState(0);
  const refresh = () => setVersion(v => v + 1);

  const [title, setTitle] = useState('');
  const [body, setBody] = useState('');
  const [category, setCategory] = useState(ANNOUNCEMENT_CATEGORIES[0]);
  const [targetRoles, setTargetRoles] = useState<string[]>(['mechanic', 'admin2']);
  const [targetBranch, setTargetBranch] = useState('');
  const [showForm, setShowForm] = useState(false);

  const isHQ = canSeeAllBranches(user);
  // Non-HQ admins can only broadcast to (and manage) their own sucursal.
  const list = isHQ ? getAnnouncements() : getAnnouncements().filter(a => a.targetBranch === user?.branch);

  const toggleRole = (r: string) => {
    setTargetRoles(prev => prev.includes(r) ? prev.filter(x => x !== r) : [...prev, r]);
  };

  const handleCreate = () => {
    if (!title.trim() || !body.trim()) { toast.error('Escribe un título y un mensaje'); return; }
    if (targetRoles.length === 0) { toast.error('Selecciona al menos un perfil destinatario'); return; }
    // HQ branches may target all sucursales (or pick one); others are fixed to theirs.
    const branchTarget = isHQ ? targetBranch : (user?.branch || '');
    saveAnnouncement({
      id: `ANN-${Date.now()}`,
      title: title.trim(),
      body: body.trim(),
      category,
      targetRoles: [...targetRoles],
      targetBranch: branchTarget,
      createdBy: user?.name || '',
      createdAt: new Date().toISOString(),
    });
    toast.success(branchTarget ? `Comunicado publicado para ${branchTarget}` : 'Comunicado publicado para todas las sucursales');
    setTitle(''); setBody(''); setCategory(ANNOUNCEMENT_CATEGORIES[0]); setTargetRoles(['mechanic', 'admin2']); setTargetBranch('');
    setShowForm(false);
    refresh();
  };

  const catColor = (c: string) =>
    c === 'Oferta' ? 'bg-green-100 text-green-700'
    : c === 'Cambio general' ? 'bg-blue-100 text-blue-700'
    : c === 'Capacitación' ? 'bg-purple-100 text-purple-700'
    : 'bg-amber-100 text-amber-700';

  return (
    <div className="p-4 pb-24">
      <div className="flex items-center justify-between mb-1">
        <h2 className="text-2xl font-bold text-gray-900">Comunicados</h2>
        <button onClick={() => setShowForm(s => !s)}

          {showForm ? <X className="w-4 h-4" /> : <Plus className="w-4 h-4" />}
          {showForm ? 'Cerrar' : 'Nuevo'}

      </div>
      <p className="text-sm text-gray-600 mb-5">Comunicación interna para los perfiles del equipo (ofertas, cambios generales, avisos).{isHQ ? '' : ` Tus comunicados llegan solo a tu sucursal (${user?.branch}).`}</p>

      {showForm && (
        <div className="bg-white rounded-lg shadow p-4 mb-6 space-y-4 border border-blue-100">
          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">Título <span className="text-red-500">*</span></label>
            <input type="text" value={title} onChange={(e) => setTitle(e.target.value)}
              placeholder="Ej: Nueva oferta en alineación"
              className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
          </div>
          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">Categoría</label>
            <select value={category} onChange={(e) => setCategory(e.target.value)}
              className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              {ANNOUNCEMENT_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">Mensaje <span className="text-red-500">*</span></label>
            <textarea value={body} onChange={(e) => setBody(e.target.value)} rows={3}
              placeholder="Escribe el comunicado..."
              className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
          </div>
          <div>
            <label className="block text-sm font-medium text-gray-700 mb-2">Enviar a <span className="text-red-500">*</span></label>
            <div className="flex flex-wrap gap-2">
              {ROLE_OPTIONS_FOR_ANN.map(r => (
                <button key={r.value} type="button" onClick={() => toggleRole(r.value)}
                  className={`px-3 py-2 rounded-lg border-2 text-sm font-medium transition-colors ${targetRoles.includes(r.value) ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-700 border-gray-300 hover:border-blue-600'}`}>
                  {r.label}
                </button>
              ))}
            </div>
          </div>
          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">Sucursal destinataria</label>
            {isHQ ? (
              <select value={targetBranch} onChange={(e) => setTargetBranch(e.target.value)}
                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="">Todas las sucursales</option>
                {getBranches().map(b => <option key={b} value={b}>{b}</option>)}

            ) : (
              <p className="text-sm text-gray-600 bg-gray-50 border border-gray-200 rounded-lg px-3 py-2.5">Solo tu sucursal: <span className="font-medium">{user?.branch}</span></p>
            )}
          </div>
          <button onClick={handleCreate}
            className="w-full bg-green-600 text-white py-3 rounded-lg font-medium hover:bg-green-700 transition-colors flex items-center justify-center gap-2">
            <Bell className="w-5 h-5" /> Publicar comunicado
          </button>
        </div>
      )}

      {list.length === 0 ? (
        <div className="text-center py-12">
          <Bell className="w-16 h-16 text-gray-300 mx-auto mb-4" />
          <p className="text-gray-500">Aún no hay comunicados</p>
        </div>
      ) : (
        <CollapseList className="space-y-3" initial={5}>
          {list.map((a) => (
            <div key={a.id} className="bg-white rounded-lg shadow p-4">
              <div className="flex items-start justify-between gap-3">
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 mb-1 flex-wrap">
                    <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${catColor(a.category)}`}>{a.category}</span>
                    <span className="text-xs text-gray-400">{new Date(a.createdAt).toLocaleDateString('es-ES')}</span>
                  </div>
                  <p className="font-semibold text-gray-900">{a.title}</p>
                  <p className="text-sm text-gray-700 mt-1 whitespace-pre-wrap">{a.body}</p>
                  <div className="flex flex-wrap gap-1 mt-2">
                    {a.targetRoles.map(r => (
                      <span key={r} className="text-[11px] bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full">{getRoleLabel(r)}</span>
                    ))}
                    <span className="text-[11px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full">{a.targetBranch || 'Todas las sucursales'}</span>
                  </div>
                </div>
                <button onClick={() => { deleteAnnouncement(a.id); toast.success('Comunicado eliminado'); refresh(); }}
                  title="Eliminar comunicado"
                  className="p-2 rounded-lg text-gray-400 hover:bg-red-600 hover:text-white transition-colors shrink-0">
                  <Trash2 className="w-4 h-4" />

              </div>
            </div>
          ))}
        </CollapseList>
      )}
    </div>
  );
}

/* ===== SalesManagement (seller edits / cancels sales) ===== */

function SalesManagement() {
  const user = getCurrentUser();
  const [version, setVersion] = useState(0);
  const refresh = () => setVersion(v => v + 1);
  const [searchTerm, setSearchTerm] = useState('');
  const [showCancelled, setShowCancelled] = useState(true);

  const [editId, setEditId] = useState<string | null>(null);
  const [editServices, setEditServices] = useState<string[]>([]);
  const [editAmount, setEditAmount] = useState(0);

  const [cancelId, setCancelId] = useState<string | null>(null);
  const [cancelReason, setCancelReason] = useState('');
  const [branchFilter, setBranchFilter] = useState('');
  // Quote-sale edit/cancel state (separate keys; quote ids never clash with order ids)
  const [qEditId, setQEditId] = useState<string | null>(null);
  const [qEditAmount, setQEditAmount] = useState(0);
  const [qCancelId, setQCancelId] = useState<string | null>(null);
  const [qCancelReason, setQCancelReason] = useState('');
  const [sourceFilter, setSourceFilter] = useState<'all' | 'orden' | 'cotizacion'>('all');
  const [statusFilter, setStatusFilter] = useState<'all' | 'pendiente' | 'completado' | 'cancelada'>('all');

  const orderMatchesStatus = (o: Inspection) => {
    if (statusFilter === 'all') return true;
    if (statusFilter === 'cancelada') return isSaleCancelled(o);
    if (isSaleCancelled(o)) return false;
    if (statusFilter === 'completado') return o.status === 'completado';
    return o.status !== 'completado'; // pendiente
  };
  const quoteMatchesStatus = (q: Quote) => {
    if (statusFilter === 'all') return true;
    if (statusFilter === 'cancelada') return isQuoteSaleCancelled(q);
    if (statusFilter === 'pendiente') return false; // paid quotes are never "pendiente"
    return !isQuoteSaleCancelled(q); // completado = paid & active
  };

  const seeAll = canSeeAllBranches(user);
  // Non-HQ users are scoped to their own branch; HQ may pick any via the filter.
  const effBranch = seeAll ? branchFilter : (user?.branch || '');
  const df = useDateFilter();
  let orders = sourceFilter === 'cotizacion' ? [] : getInspections().filter(i => i.orderNumber).filter(i => df.match(i.serviceDate || i.date));
  const term = searchTerm.trim().toUpperCase();
  const matchesTerm = (plate: string, ref: string, client: string) =>
    !term || plate.toUpperCase().includes(term) || (ref || '').toUpperCase().includes(term) || (client || '').toUpperCase().includes(term);
  orders = orders
    .filter(o => showCancelled ? true : !isSaleCancelled(o))
    .filter(orderMatchesStatus)
    .filter(o => !effBranch || (o.branch || '') === effBranch)
    .filter(o => {
      const v = getVehicle(o.licensePlate);
      return matchesTerm(o.licensePlate, o.orderNumber || '', v?.clientName || '');
    })
    .sort((a, b) => new Date(b.serviceDate || b.date).getTime() - new Date(a.serviceDate || a.date).getTime());

  // Paid quotes become sales here, tagged "Cotización".
  let paidQuotes = sourceFilter === 'orden' ? [] : getQuotes().filter(q => q.status === 'pagada').filter(q => df.match(q.payment?.registeredAt || q.createdAt));
  paidQuotes = paidQuotes
    .filter(q => showCancelled ? true : !isQuoteSaleCancelled(q))
    .filter(quoteMatchesStatus)
    .filter(q => !effBranch || quoteBranchOf(q) === effBranch)
    .filter(q => matchesTerm(q.licensePlate, q.number, q.clientName))
    .sort((a, b) => new Date(b.payment?.registeredAt || b.createdAt).getTime() - new Date(a.payment?.registeredAt || a.createdAt).getTime());

  const totalCount = orders.length + paidQuotes.length;

  const startEdit = (o: Inspection) => {
    setEditId(o.id);
    setEditServices([...(o.serviceTypes || [])]);
    setEditAmount(o.amountCharged || 0);
  };
  const toggleService = (s: string) => {
    setEditServices(prev => prev.includes(s) ? prev.filter(x => x !== s) : [...prev, s]);
  };
  const saveEdit = (o: Inspection) => {
    editSale(o.id, { serviceTypes: editServices, amountCharged: editAmount }, user?.name || '');
    toast.success(`Venta ${o.orderNumber} actualizada`);
    setEditId(null);
    refresh();
  };
  const doCancel = (o: Inspection) => {
    if (!cancelReason.trim()) { toast.error('Indique el motivo (cancelación, devolución o cambio)'); return; }
    cancelSale(o.id, cancelReason.trim(), user?.name || '');
    toast.success(`Venta ${o.orderNumber} cancelada`);
    setCancelId(null);
    setCancelReason('');
    refresh();
  };

  return (
    <div className="p-4 pb-24 space-y-4">
      <div>
        <h2 className="text-2xl font-bold text-gray-900">Mis Ventas</h2>
        <p className="text-gray-600 text-sm">Edita o cancela ventas (cancelaciones, devoluciones o cambios).</p>
      </div>

      <div className="relative">
        <Search className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-5 h-5" />
        <input type="text" placeholder="Buscar por patente, N° de orden o cliente..." value={searchTerm}
          onChange={(e) => setSearchTerm(e.target.value)}
          className="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent uppercase" />
      </div>
      <select value={branchFilter} onChange={(e) => setBranchFilter(e.target.value)}
        className={`w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent ${seeAll ? '' : 'hidden'}`}>
        <option value="">Todas las sucursales</option>
        {getBranches().map(b => <option key={b} value={b}>{b}</option>)}
      </select>
      <div className="grid grid-cols-2 gap-2">
        <select value={sourceFilter} onChange={(e) => setSourceFilter(e.target.value as any)}
          className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          <option value="all">Todo origen</option>
          <option value="orden">Registro</option>
          <option value="cotizacion">Cotización</option>
        </select>
        <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value as any)}
          className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          <option value="all">Todo estado</option>
          <option value="pendiente">Pendiente</option>
          <option value="completado">Terminada</option>
          <option value="cancelada">Cancelada</option>
        </select>
      </div>
      <label className="flex items-center gap-2 text-sm text-gray-600">
        <input type="checkbox" checked={showCancelled} onChange={(e) => setShowCancelled(e.target.checked)} className="rounded" />
        Mostrar también las canceladas
      </label>

      <DateFilterBar f={df} className="mt-3" />

      {totalCount === 0 ? (
        <div className="text-center py-12">
          <DollarSign className="w-16 h-16 text-gray-300 mx-auto mb-4" />
          <p className="text-gray-500">No hay ventas registradas</p>
        </div>
      ) : (
        <div className="space-y-3">
          {paidQuotes.map((q) => {
            const qCancelled = isQuoteSaleCancelled(q);
            const qEditing = qEditId === q.id;
            const qCancelling = qCancelId === q.id;
            const qAmount = q.payment?.amount || quoteTotal(q);
            return (
            <div key={q.id} className={`bg-white rounded-lg shadow p-4 border-l-4 border-purple-400 ${qCancelled ? 'opacity-75' : ''}`}>
              <div className="flex items-start justify-between gap-3">
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 mb-1 flex-wrap">
                    <span className="text-xs font-semibold bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full">{q.number}</span>
                    <span className="text-xs px-2 py-0.5 rounded-full font-medium bg-purple-100 text-purple-700">Cotización</span>
                    {qCancelled
                      ? <span className="text-xs px-2 py-0.5 rounded-full font-medium bg-red-100 text-red-700">Cancelada</span>
                      : <span className="text-xs px-2 py-0.5 rounded-full font-medium bg-green-100 text-green-700">Pagada</span>}
                    {q.editedAt && !qCancelled && <span className="text-xs px-2 py-0.5 rounded-full font-medium bg-amber-100 text-amber-700">Editada</span>}
                    {!qCancelled && q.assignedMechanicId && (
                      <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${q.inspectionStatus === 'completada' ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-700'}`}>
                        {q.inspectionStatus === 'completada' ? 'Inspección completada' : 'Inspección pendiente'}
                      </span>
                    )}
                  </div>
                  <p className="font-bold text-lg text-gray-900">{q.licensePlate}</p>
                  <p className="text-gray-600 text-sm">{q.clientName}{q.vehicleModel ? ' · ' + q.vehicleModel : ''}</p>
                  <p className="text-xs text-gray-500 mt-1">{new Date(q.payment?.registeredAt || q.createdAt).toLocaleDateString('es-ES', { day: '2-digit', month: 'long', year: 'numeric' })} · {q.createdBy}</p>
                  <p className="text-sm text-gray-700 mt-1">{q.items.map(it => it.description).filter(Boolean).join(', ') || 'Sin detalle'}</p>
                  <p className={`text-sm font-semibold mt-0.5 ${qCancelled ? 'line-through text-gray-400' : 'text-gray-900'}`}>{formatCLP(qAmount)}</p>
                  <p className="text-xs mt-1 flex items-center gap-1 text-gray-500">
                    <User className="w-3.5 h-3.5" />
                    {q.assignedMechanic ? <span className="text-gray-700 font-medium">Mecánico: {q.assignedMechanic}</span> : <span className="italic">Sin mecánico asignado</span>}
                  </p>
                  {qCancelled
                    ? <p className="text-xs text-red-600 mt-1">Motivo: {q.cancelReason} · por {q.cancelledBy}</p>
                    : <p className="text-xs text-green-600 mt-1">Pago {q.payment?.method || ''} · comprobante adjunto</p>}
                </div>
              </div>

              {qEditing && (
                <div className="mt-3 border-t border-gray-200 pt-3 space-y-3">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Monto de la venta (CLP)</label>
                    <input type="number" value={qEditAmount} onChange={(e) => setQEditAmount(parseInt(e.target.value) || 0)}
                      className="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
                    <p className="text-xs text-gray-500 mt-1">Para cambiar los ítems, edita la cotización en la pestaña Cotizaciones.</p>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={() => { editQuoteSaleAmount(q.id, qEditAmount, user?.name || ''); toast.success(`Venta ${q.number} actualizada`); setQEditId(null); refresh(); }}
                      className="flex-1 bg-blue-600 text-white py-2.5 rounded-lg text-sm font-medium hover:bg-blue-700">Guardar cambios</button>
                    <button onClick={() => setQEditId(null)} className="flex-1 bg-gray-200 text-gray-700 py-2.5 rounded-lg text-sm font-medium hover:bg-gray-300">Cancelar</button>
                  </div>
                </div>
              )}

              {qCancelling && (
                <div className="mt-3 border-t border-gray-200 pt-3 space-y-3">
                  <label className="block text-sm font-medium text-gray-700">Motivo (cancelación, devolución o cambio)</label>
                  <textarea value={qCancelReason} onChange={(e) => setQCancelReason(e.target.value)} rows={2}
                    placeholder="Ej: El cliente solicitó la devolución..."
                    className="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent" />
                  <div className="flex gap-2">
                    <button onClick={() => { if (!qCancelReason.trim()) { toast.error('Indique el motivo'); return; } cancelQuoteSale(q.id, qCancelReason.trim(), user?.name || ''); toast.success(`Venta ${q.number} cancelada`); setQCancelId(null); setQCancelReason(''); refresh(); }}
                      className="flex-1 bg-red-600 text-white py-2.5 rounded-lg text-sm font-medium hover:bg-red-700">Confirmar cancelación</button>
                    <button onClick={() => { setQCancelId(null); setQCancelReason(''); }} className="flex-1 bg-gray-200 text-gray-700 py-2.5 rounded-lg text-sm font-medium hover:bg-gray-300">Volver</button>
                  </div>
                </div>
              )}

              {!qEditing && !qCancelling && (
                <div className="mt-3 space-y-2">
                  {!qCancelled && (
                    <div className="flex items-center gap-2">
                      <label className="text-xs text-gray-500 shrink-0">Asignar mecánico:</label>
                      <select value={q.assignedMechanicId || ''}
                        onChange={(e) => {
                          const m = getUsers().find(u => u.id === e.target.value);
                          updateQuote(q.id, {
                            assignedMechanic: m ? m.name : '',
                            assignedMechanicId: m ? m.id : '',
                            inspectionStatus: m ? (q.inspectionStatus || 'pendiente') : undefined,
                          });
                          toast.success(m ? `Asignada a ${m.name} · inspección pendiente` : 'Mecánico desasignado');
                          refresh();
                        }}
                        className="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="">Sin asignar</option>
                        {getUsers().filter(u => u.role === 'mechanic' && u.active !== false && (canSeeAllBranches(user) || u.branch === (quoteBranchOf(q) || user?.branch))).map(m => (
                          <option key={m.id} value={m.id}>{m.name} · {m.branch}</option>
                        ))}
                      </select>
                    </div>
                  )}
                  {!qCancelled && q.assignedMechanicId && (
                    (user?.role === 'mechanic' || user?.role === 'admin') ? (
                      q.inspectionStatus === 'completada' ? (
                        <button onClick={() => { updateQuote(q.id, { inspectionStatus: 'pendiente' }); toast.success('Inspección reabierta'); refresh(); }}
                          className="w-full bg-orange-50 text-orange-700 py-2 rounded-lg text-sm font-medium hover:bg-orange-100 transition-colors flex items-center justify-center gap-1.5">
                          <Clock className="w-4 h-4" /> Marcar inspección como pendiente
                        </button>
                      ) : (
                        <button onClick={() => { updateQuote(q.id, { inspectionStatus: 'completada' }); toast.success('Inspección marcada como completada'); refresh(); }}
                          className="w-full bg-green-50 text-green-700 py-2 rounded-lg text-sm font-medium hover:bg-green-100 transition-colors flex items-center justify-center gap-1.5">
                          <Check className="w-4 h-4" /> Marcar inspección como completada
                        </button>
                      )
                    ) : (
                      <p className="text-xs text-gray-400 italic text-center py-1">La inspección la marca como completada el mecánico asignado.</p>
                    )
                  )}
                  <div className="flex gap-2">
                  {!qCancelled ? (
                    <>
                      <button onClick={() => { setQEditId(q.id); setQEditAmount(qAmount); }} className="flex-1 bg-blue-50 text-blue-700 py-2 rounded-lg text-sm font-medium hover:bg-blue-100 transition-colors flex items-center justify-center gap-1.5">
                        <Pencil className="w-4 h-4" /> Editar
                      </button>
                      <button onClick={() => { setQCancelId(q.id); setQCancelReason(''); }} className="flex-1 bg-red-50 text-red-600 py-2 rounded-lg text-sm font-medium hover:bg-red-600 hover:text-white transition-colors flex items-center justify-center gap-1.5">
                        <X className="w-4 h-4" /> Cancelar venta
                      </button>
                    </>
                  ) : (
                    <button onClick={() => { reactivateQuoteSale(q.id); toast.success('Venta reactivada'); refresh(); }} className="flex-1 bg-green-50 text-green-700 py-2 rounded-lg text-sm font-medium hover:bg-green-100 transition-colors flex items-center justify-center gap-1.5">
                      <Power className="w-4 h-4" /> Reactivar venta
                    </button>
                  )}
                  </div>
                </div>
              )}
            </div>
            );
          })}
          {orders.map((o) => {
            const v = getVehicle(o.licensePlate);
            const cancelled = isSaleCancelled(o);
            const editing = editId === o.id;
            const cancelling = cancelId === o.id;
            return (
              <div key={o.id} className={`bg-white rounded-lg shadow p-4 ${cancelled ? 'opacity-75' : ''}`}>
                <div className="flex items-start justify-between gap-3">
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2 mb-1 flex-wrap">
                      <span className="text-xs font-semibold bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full">{o.orderNumber}</span>
                      {cancelled
                        ? <span className="text-xs px-2 py-0.5 rounded-full font-medium bg-red-100 text-red-700">Cancelada</span>
                        : (o.status === 'completado'
                            ? <span className="text-xs px-2 py-0.5 rounded-full font-medium bg-green-100 text-green-700">Completada</span>
                            : <span className="text-xs px-2 py-0.5 rounded-full font-medium bg-amber-100 text-amber-700">Pendiente</span>)}
                      {o.editedAt && !cancelled && <span className="text-xs px-2 py-0.5 rounded-full font-medium bg-amber-100 text-amber-700">Editada</span>}
                    </div>
                    <p className="font-bold text-lg text-gray-900">{o.licensePlate}</p>
                    <p className="text-gray-600 text-sm">{v?.clientName || ''} · {v?.vehicleModel || ''}</p>
                    <p className="text-xs text-gray-500 mt-1">{new Date(o.serviceDate || o.date).toLocaleDateString('es-ES', { day: '2-digit', month: 'long', year: 'numeric' })}</p>
                    <p className="text-sm text-gray-700 mt-1">{(o.serviceTypes || []).join(', ') || 'Sin servicios'}</p>
                    <p className={`text-sm font-semibold mt-0.5 ${cancelled ? 'line-through text-gray-400' : 'text-gray-900'}`}>{formatCLP(o.amountCharged || 0)}</p>
                    <p className="text-xs mt-1 flex items-center gap-1 text-gray-500">
                      <User className="w-3.5 h-3.5" />
                      {o.mechanicId === 'free'
                        ? <span className="text-blue-700 font-medium">Libre · cualquier mecánico de la sucursal</span>
                        : (o.mechanic ? <span className="text-gray-700 font-medium">Mecánico: {o.mechanic}</span> : <span className="italic">Sin mecánico asignado</span>)}
                    </p>
                    {cancelled && (
                      <p className="text-xs text-red-600 mt-1">Motivo: {o.cancelReason} · por {o.cancelledBy}</p>
                    )}
                    {!cancelled && orderNotDoneTasks(o).length > 0 && (
                      <div className="mt-2 bg-red-50 border border-red-200 rounded-lg p-2.5">
                        <p className="text-xs font-semibold text-red-700 flex items-center gap-1"><AlertCircle className="w-3.5 h-3.5" /> Servicio(s) no realizado(s) — gestionar devolución</p>
                        <ul className="mt-1 space-y-0.5">
                          {orderNotDoneTasks(o).map(t => (
                            <li key={t.id} className="text-xs text-red-700">• {t.service}{t.positions.length ? ` (${t.positions.join(', ')})` : ''}: {t.notDoneReason || 'sin motivo'}{t.notDoneBy ? ` · ${t.notDoneBy}` : ''}</li>
                          ))}
                        </ul>
                        <p className="text-[11px] text-red-500 mt-1">Usa “Cancelar venta” para registrar la devolución al cliente.</p>
                      </div>
                    )}
                  </div>
                </div>

                {editing && (
                  <div className="mt-3 border-t border-gray-200 pt-3 space-y-3">
                    <p className="text-sm font-medium text-gray-700">Editar servicios</p>
                    <ServiceMultiPicker selected={editServices} onToggle={toggleService} />
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">Monto (CLP)</label>
                      <input type="number" value={editAmount} onChange={(e) => setEditAmount(parseInt(e.target.value) || 0)}
                        className="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
                    </div>
                    <div className="flex gap-2">
                      <button onClick={() => saveEdit(o)} className="flex-1 bg-blue-600 text-white py-2.5 rounded-lg text-sm font-medium hover:bg-blue-700">Guardar cambios</button>
                      <button onClick={() => setEditId(null)} className="flex-1 bg-gray-200 text-gray-700 py-2.5 rounded-lg text-sm font-medium hover:bg-gray-300">Cancelar</button>
                    </div>
                  </div>
                )}

                {cancelling && (
                  <div className="mt-3 border-t border-gray-200 pt-3 space-y-3">
                    <label className="block text-sm font-medium text-gray-700">Motivo (cancelación, devolución o cambio)</label>
                    <textarea value={cancelReason} onChange={(e) => setCancelReason(e.target.value)} rows={2}
                      placeholder="Ej: El cliente devolvió el producto..."
                      className="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent" />
                    <div className="flex gap-2">
                      <button onClick={() => doCancel(o)} className="flex-1 bg-red-600 text-white py-2.5 rounded-lg text-sm font-medium hover:bg-red-700">Confirmar cancelación</button>
                      <button onClick={() => { setCancelId(null); setCancelReason(''); }} className="flex-1 bg-gray-200 text-gray-700 py-2.5 rounded-lg text-sm font-medium hover:bg-gray-300">Volver</button>
                    </div>
                  </div>
                )}

                {!editing && !cancelling && (
                  <div className="mt-3 space-y-2">
                    {!cancelled && o.status !== 'completado' && (
                      <div className="flex items-center gap-2">
                        <label className="text-xs text-gray-500 shrink-0">Asignar mecánico:</label>
                        <select value={o.mechanicId || ''}
                          onChange={(e) => {
                            const val = e.target.value;
                            if (val === 'free') {
                              updateInspection(o.id, { mechanic: '', mechanicId: 'free' });
                              toast.success('Marcada como libre · cualquier mecánico de la sucursal puede tomarla');
                            } else {
                              const m = getUsers().find(u => u.id === val);
                              updateInspection(o.id, { mechanic: m ? m.name : '', mechanicId: m ? m.id : '' });
                              toast.success(m ? `Asignado a ${m.name}` : 'Mecánico desasignado');
                            }
                            refresh();
                          }}
                          className="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                          <option value="">Sin asignar</option>
                          <option value="free">Libre — cualquier mecánico de la sucursal</option>
                          {getUsers().filter(u => u.role === 'mechanic' && u.active !== false && (canSeeAllBranches(user) || u.branch === (o.branch || user?.branch))).map(m => (
                            <option key={m.id} value={m.id}>{m.name} · {m.branch}</option>
                          ))}
                        </select>
                      </div>
                    )}
                    <div className="flex gap-2">
                    {!cancelled ? (
                      <>
                        <button onClick={() => startEdit(o)} className="flex-1 bg-blue-50 text-blue-700 py-2 rounded-lg text-sm font-medium hover:bg-blue-100 transition-colors flex items-center justify-center gap-1.5">
                          <Pencil className="w-4 h-4" /> Editar
                        </button>
                        <button onClick={() => { setCancelId(o.id); setCancelReason(''); }} className="flex-1 bg-red-50 text-red-600 py-2 rounded-lg text-sm font-medium hover:bg-red-600 hover:text-white transition-colors flex items-center justify-center gap-1.5">
                          <X className="w-4 h-4" /> Cancelar venta
                        </button>
                      </>
                    ) : (
                      <button onClick={() => { reactivateSale(o.id); toast.success('Venta reactivada'); refresh(); }} className="flex-1 bg-green-50 text-green-700 py-2 rounded-lg text-sm font-medium hover:bg-green-100 transition-colors flex items-center justify-center gap-1.5">
                        <Power className="w-4 h-4" /> Reactivar venta
                      </button>
                    )}
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}


/* ===== ExportPanel (Excel downloads) ===== */

function ExportPanel({ mode }: { mode: 'full' | 'quotes' | 'mechanic' }) {
  const toISO = (d: Date) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const today = toISO(new Date());
  const [from, setFrom] = useState('');
  const [to, setTo] = useState('');
  const [activePreset, setActivePreset] = useState<string>('todo');

  const applyPreset = (key: string) => {
    setActivePreset(key);
    const now = new Date();
    if (key === 'hoy') { setFrom(today); setTo(today); }
    else if (key === 'semana') { const d = new Date(); d.setDate(d.getDate() - 6); setFrom(toISO(d)); setTo(today); }
    else if (key === 'mes') { setFrom(toISO(new Date(now.getFullYear(), now.getMonth(), 1))); setTo(today); }
    else { setFrom(''); setTo(''); }
  };

  const presets = [
    { key: 'hoy', label: 'Hoy' },
    { key: 'semana', label: 'Últimos 7 días' },
    { key: 'mes', label: 'Este mes' },
    { key: 'todo', label: 'Todo' },
  ];

  return (
    <div className="bg-white rounded-lg shadow p-4 mb-6 border border-blue-100">
      <h3 className="text-lg font-semibold text-gray-900 flex items-center gap-2 mb-1">
        <Download className="w-5 h-5 text-blue-600" /> {mode === 'mechanic' ? 'Descargar evaluaciones (Excel)' : 'Descargar informes (Excel)'}
      </h3>
      <p className="text-sm text-gray-600 mb-3">
        {mode === 'full'
          ? 'Exporta inspecciones, cotizaciones y un resumen del día o del período que elijas.'
          : mode === 'mechanic'
          ? 'Exporta tus evaluaciones técnicas de vehículos (sin precios) del día o del período que elijas.'
          : 'Exporta las cotizaciones del día o del período que elijas.'}
      </p>

      <div className="flex flex-wrap gap-2 mb-3">
        {presets.map(p => (
          <button key={p.key} type="button" onClick={() => applyPreset(p.key)}
            className={`px-3 py-1.5 rounded-lg text-sm font-medium border-2 transition-colors ${
              activePreset === p.key ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-700 border-gray-300 hover:border-blue-600'
            }`}>
            {p.label}
          </button>
        ))}
      </div>

      <div className="grid grid-cols-2 gap-3 mb-3">
        <div>
          <label className="block text-xs font-medium text-gray-600 mb-1">Desde</label>
          <input type="date" value={from} onChange={(e) => { setFrom(e.target.value); setActivePreset('custom'); }}
            className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
        </div>
        <div>
          <label className="block text-xs font-medium text-gray-600 mb-1">Hasta</label>
          <input type="date" value={to} onChange={(e) => { setTo(e.target.value); setActivePreset('custom'); }}
            className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
        </div>
      </div>

      <div className="flex flex-wrap gap-2">
        {mode === 'mechanic' && (
          <button onClick={() => exportMechanicEvaluationsExcel(from, to)}
            className="bg-green-600 text-white px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-green-700 transition-colors flex items-center gap-2">
            <Download className="w-4 h-4" /> Descargar evaluaciones
          </button>
        )}
        {mode === 'full' && (

        )}
        {mode === 'full' && (
          <button onClick={() => exportInspectionsExcel(from, to)}
            className="bg-blue-50 text-blue-700 px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-blue-100 transition-colors flex items-center gap-2">
            <FileText className="w-4 h-4" /> Inspecciones
          </button>
        )}
        <button onClick={() => exportQuotesExcel(from, to)}

}


/* ===== Reports ===== */

function Reports() {
  const user = getCurrentUser();
  const allInspections = getInspections();

  const [startDate, setStartDate] = useState('');
  const [endDate, setEndDate] = useState('');
  const [selectedBranch, setSelectedBranch] = useState('');
  const [selectedMechanic, setSelectedMechanic] = useState('');
  const [showFilters, setShowFilters] = useState(false);
  const [reportTab, setReportTab] = useState<'operacion' | 'comisiones'>('operacion');

  // Branch isolation: non-HQ users only ever see their own branch's reports.
  const lockedBranch = canSeeAllBranches(user) ? '' : (user?.branch || '');
  const effSelectedBranch = lockedBranch || selectedBranch;

  const mechanics = useMemo(() => {
    const uniqueMechanics = new Set(allInspections.map(i => i.mechanic));
    return Array.from(uniqueMechanics);
  }, [allInspections]);

  const filteredInspections = useMemo(() => {
    return allInspections.filter(inspection => {
      const inspectionDate = new Date(inspection.date);
      const start = startDate ? new Date(startDate) : null;
      const end = endDate ? new Date(endDate) : null;

      if (start && inspectionDate < start) return false;
      if (end && inspectionDate > end) return false;
      if (effSelectedBranch && inspection.branch !== effSelectedBranch) return false;
      if (selectedMechanic && inspection.mechanic !== selectedMechanic) return false;

      return true;
    });
  }, [allInspections, startDate, endDate, selectedBranch, selectedMechanic]);

  const stats = useMemo(() => {
    const activeInspections = filteredInspections.filter(i => !isSaleCancelled(i));
    const cancelledInspections = filteredInspections.filter(i => isSaleCancelled(i));
    const totalRevenue = activeInspections.reduce((sum, i) => sum + i.amountCharged, 0);
    const cancelledAmount = cancelledInspections.reduce((sum, i) => sum + (i.amountCharged || 0), 0);
    const uniqueVehicles = new Set(activeInspections.map(i => i.licensePlate)).size;
    const averageTicket = activeInspections.length > 0 ? totalRevenue / activeInspections.length : 0;

    const byBranch = activeInspections.reduce((acc, i) => {
      if (!acc[i.branch]) {
        acc[i.branch] = { count: 0, revenue: 0 };
      }
      acc[i.branch].count++;
      acc[i.branch].revenue += i.amountCharged;
      return acc;
    }, {} as Record<string, { count: number; revenue: number }>);

    const byMechanic = activeInspections.reduce((acc, i) => {
      if (!acc[i.mechanic]) {
        acc[i.mechanic] = { count: 0, revenue: 0 };
      }
      acc[i.mechanic].count++;
      acc[i.mechanic].revenue += i.amountCharged;
      return acc;
    }, {} as Record<string, { count: number; revenue: number }>);

    const byServiceType = activeInspections.reduce((acc, i) => {
      i.serviceTypes.forEach(service => {
        if (!acc[service]) {
          acc[service] = { count: 0, revenue: 0 };
        }
        acc[service].count++;
        acc[service].revenue += i.amountCharged / i.serviceTypes.length; // Divide revenue among services
      });
      return acc;
    }, {} as Record<string, { count: number; revenue: number }>);

    // Productos vendidos / usados, agrupados por el código que ingresa el vendedor.
    const byProduct: Record<string, { code: string; name: string; qty: number; total: number }> = {};
    activeInspections.forEach(i => {
      (Array.isArray(i.products) ? i.products : []).forEach(p => {
        const key = ((p.code || p.name || '').toLowerCase()) || 'sin-codigo';
        if (!byProduct[key]) byProduct[key] = { code: p.code || '—', name: p.name || 'Producto', qty: 0, total: 0 };
        const q = Math.max(1, Number(p.qty) || 1);
        byProduct[key].qty += q;
        byProduct[key].total += (Number(p.unitPrice) || 0) * q;
      });
    });

    // Top sellers: who registered the sale (serviceBy on orders) + paid-quote sellers.
    const bySeller: Record<string, { count: number; revenue: number }> = {};
    activeInspections.forEach(i => {
      const s = i.serviceBy || (i.orderNumber ? 'Sin asignar' : '');
      if (!s) return;
      (bySeller[s] = bySeller[s] || { count: 0, revenue: 0 });
      bySeller[s].count++;
      bySeller[s].revenue += i.amountCharged || 0;
    });
    getQuotes().filter(q => q.status === 'pagada' && !isQuoteSaleCancelled(q)).forEach(q => {
      const d = new Date(q.payment?.registeredAt || q.createdAt);
      if (startDate && d < new Date(startDate)) return;
      if (endDate && d > new Date(endDate)) return;
      if (effSelectedBranch && quoteBranchOf(q) !== effSelectedBranch) return;
      const s = q.createdBy || 'Sin asignar';
      (bySeller[s] = bySeller[s] || { count: 0, revenue: 0 });
      bySeller[s].count++;
      bySeller[s].revenue += q.payment?.amount || quoteTotal(q);
    });

    return {
      totalRevenue,
      totalInspections: activeInspections.length,
      cancelledCount: cancelledInspections.length,
      cancelledAmount,
      cancelledList: cancelledInspections,
      uniqueVehicles,
      averageTicket,
      byBranch,
      byMechanic,
      bySeller,
      byServiceType,
      byProduct,
    };
  }, [filteredInspections, startDate, endDate, effSelectedBranch]);

  const clearFilters = () => {
    setStartDate('');
    setEndDate('');
    setSelectedBranch('');
    setSelectedMechanic('');
  };

  return (
    <div className="p-4 pb-24">
      <div className="flex items-center justify-between mb-6">
        <h2 className="text-2xl font-bold text-gray-900">Reportes</h2>
        <button
          onClick={() => setShowFilters(!showFilters)}
          className="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors flex items-center gap-2"
        >
          <Filter className="w-4 h-4" />
          Filtros
        </button>
      </div>

      <ExportPanel mode="full" />

      <div className="flex gap-2 mb-5">
        <button onClick={() => setReportTab('operacion')}
          className={`flex-1 py-2 rounded-lg text-sm font-medium transition-colors ${reportTab === 'operacion' ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}>
          Operación
        </button>
        <button onClick={() => setReportTab('comisiones')}

          Comisiones
        </button>
      </div>

      {reportTab === 'comisiones' && <CommissionReport branch={effSelectedBranch} />}

      {reportTab === 'operacion' && (
      <>
      {showFilters && (
        <div className="bg-white rounded-lg shadow p-4 mb-6 space-y-4">
          <h3 className="font-semibold text-gray-900">Filtros</h3>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1">Fecha Inicio</label>
              <input
                type="date"
                value={startDate}
                onChange={(e) => setStartDate(e.target.value)}
                className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              />
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1">Fecha Fin</label>
              <input
                type="date"
                value={endDate}
                onChange={(e) => setEndDate(e.target.value)}
                className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              />
            </div>
          </div>

          <div className={canSeeAllBranches(user) ? '' : 'hidden'}>
            <label className="block text-sm font-medium text-gray-700 mb-1">Sucursal</label>
            <select
              value={selectedBranch}
              onChange={(e) => setSelectedBranch(e.target.value)}
              className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            >
              <option value="">Todas</option>
              {getBranches().map((branch) => (
                <option key={branch} value={branch}>
                  {branch}
                </option>
              ))}
            </select>
          </div>

          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">Mecánico</label>
            <select
              value={selectedMechanic}
              onChange={(e) => setSelectedMechanic(e.target.value)}
              className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            >
              <option value="">Todos</option>
              {mechanics.map((mechanic) => (
                <option key={mechanic} value={mechanic}>
                  {mechanic}
                </option>
              ))}
            </select>
          </div>

          <button
            onClick={clearFilters}
            className="w-full bg-gray-200 text-gray-700 py-2 rounded-lg font-medium hover:bg-gray-300 transition-colors"
          >
            Limpiar Filtros
          </button>
        </div>
      )}

      <div className="grid grid-cols-2 gap-4 mb-6">
        <div className="bg-gradient-to-br from-green-500 to-green-600 text-white rounded-lg shadow p-4">
          <DollarSign className="w-8 h-8 mb-2 opacity-80" />
          <p className="text-2xl font-bold">${stats.totalRevenue.toLocaleString()}</p>
          <p className="text-sm opacity-90">Ingresos Totales</p>
        </div>

        <div className="bg-gradient-to-br from-blue-500 to-blue-600 text-white rounded-lg shadow p-4">
          <BarChart3 className="w-8 h-8 mb-2 opacity-80" />
          <p className="text-2xl font-bold">{stats.totalInspections}</p>
          <p className="text-sm opacity-90">Inspecciones</p>
        </div>

        <div className="bg-gradient-to-br from-purple-500 to-purple-600 text-white rounded-lg shadow p-4">
          <Car className="w-8 h-8 mb-2 opacity-80" />
          <p className="text-2xl font-bold">{stats.uniqueVehicles}</p>
          <p className="text-sm opacity-90">Vehículos Únicos</p>
        </div>

        <div className="bg-gradient-to-br from-orange-500 to-orange-600 text-white rounded-lg shadow p-4">
          <DollarSign className="w-8 h-8 mb-2 opacity-80" />
          <p className="text-2xl font-bold">${Math.round(stats.averageTicket).toLocaleString()}</p>
          <p className="text-sm opacity-90">Ticket Promedio</p>
        </div>
      </div>

      {stats.cancelledCount > 0 && (
        <div className="bg-white rounded-lg shadow p-4 mb-4 border-l-4 border-red-500">
          <div className="flex items-center justify-between mb-2">
            <h3 className="font-semibold text-gray-900 flex items-center gap-2">
              <X className="w-5 h-5 text-red-500" /> Cancelaciones / devoluciones
            </h3>
            <span className="text-sm font-semibold text-red-600">−${stats.cancelledAmount.toLocaleString()}</span>
          </div>
          <p className="text-sm text-gray-600 mb-2">{stats.cancelledCount} venta(s) cancelada(s), no incluidas en los ingresos.</p>
          <div className="space-y-1.5">
            {stats.cancelledList.slice(0, 8).map((c) => (
              <div key={c.id} className="flex items-start justify-between gap-2 text-sm bg-red-50 rounded-lg px-3 py-2">
                <div className="min-w-0">
                  <span className="font-medium text-gray-900">{c.orderNumber} · {c.licensePlate}</span>
                  <span className="text-gray-500"> — {c.cancelReason || 'Sin motivo'}</span>
                </div>
                <span className="text-gray-400 line-through shrink-0">${(c.amountCharged || 0).toLocaleString()}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {Object.keys(stats.byProduct).length > 0 && (
        <div className="bg-white rounded-lg shadow p-4 mb-4">
          <div className="flex items-center justify-between mb-3">
            <h3 className="font-semibold text-gray-900 flex items-center gap-2">
              <Package className="w-5 h-5 text-blue-600" /> Productos vendidos / usados
            </h3>
            <button onClick={() => {
                const list = Object.values(stats.byProduct).sort((a, b) => b.qty - a.qty);
                const rows: (string | number)[][] = [['Código', 'Producto', 'Cantidad', 'Total']];
                list.forEach(p => rows.push([p.code, p.name, p.qty, p.total]));
                rows.push(['', 'TOTAL', list.reduce((s, p) => s + p.qty, 0), list.reduce((s, p) => s + p.total, 0)]);
                downloadBlob(buildXlsx([{ name: 'Productos', rows }]), `Productos_${rangeLabel(startDate, endDate)}.xlsx`);
                toast.success('Excel de productos descargado');
              }}
              className="text-sm text-blue-600 font-medium hover:text-blue-700 flex items-center gap-1">
              <Download className="w-4 h-4" /> Excel
            </button>
          </div>
          <p className="text-xs text-gray-500 mb-3">Cantidades según el código que ingresa el vendedor, dentro del período y sucursal filtrados.</p>
          <div className="overflow-x-auto -mx-1">
            <table className="w-full text-sm">
              <thead>
                <tr className="text-left text-gray-500 border-b border-gray-200">
                  <th className="py-2 pr-2 font-medium">Código</th>
                  <th className="py-2 pr-2 font-medium">Producto</th>
                  <th className="py-2 pr-2 font-medium text-right">Cant.</th>
                  <th className="py-2 font-medium text-right">Total</th>
                </tr>
              </thead>
              <tbody>
                {Object.values(stats.byProduct).sort((a, b) => b.qty - a.qty).map((p, i) => (
                  <tr key={i} className="border-b border-gray-100">
                    <td className="py-2 pr-2 text-gray-500 font-mono text-xs">{p.code}</td>
                    <td className="py-2 pr-2 text-gray-800">{p.name}</td>
                    <td className="py-2 pr-2 text-right font-semibold text-gray-900">{p.qty}</td>
                    <td className="py-2 text-right text-green-600 font-medium">{formatCLP(p.total)}</td>

              .sort((a, b) => b[1].revenue - a[1].revenue)

}
