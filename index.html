/* ---- lucide icons as React components ---- */
const __L = window.lucide || {};
function __findIconNode(names) {
  for (const n of names) { if (__L[n]) return __L[n]; }
  return null;
}
function __makeIcon(names) {
  const node = __findIconNode(names);
  return function (props) {
    props = props || {};
    if (!node) {
      return React.createElement('svg', Object.assign({ width: 24, height: 24, viewBox: '0 0 24 24' }, props));
    }
    const attrs = node[1] || {};
    const kids = node[2] || [];
    const childEls = kids.map((ch, i) => React.createElement(ch[0], Object.assign({ key: i }, ch[1])));
    return React.createElement('svg', Object.assign({}, attrs, props), childEls);
  };
}

function __ensureToastRoot() {
  let r = document.getElementById('__toast_root');
  if (!r) {
    r = document.createElement('div');
    r.id = '__toast_root';
    r.style.cssText = 'position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;';
    document.body.appendChild(r);
  }
  return r;
}
function __showToast(message, type) {
  const root = __ensureToastRoot();
  const el = document.createElement('div');
  const colors = {
    success: ['#dcfce7', '#166534', '#86efac'],
    error: ['#fee2e2', '#991b1b', '#fca5a5'],
    info: ['#dbeafe', '#1e40af', '#93c5fd'],
  };
  const c = colors[type] || colors.info;

  el.textContent = message;
  root.appendChild(el);

    setTimeout(() => el.remove(), 250);

}

/* ---- PDF + QR libs ---- */

const QRCode = {
  toDataURL: (text, opts) => new Promise((resolve, reject) => {
    try {
      opts = opts || {};
      const qr = window.qrcode(0, 'M');
      qr.addData(text);
      qr.make();
      const count = qr.getModuleCount();
      const margin = opts.margin != null ? opts.margin : 2;
      const total = count + margin * 2;
      const target = opts.width || 300;
      const cell = Math.max(1, Math.floor(target / total));
      const size = cell * total;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const dark = (opts.color && opts.color.dark) || '#000000';
      const light = (opts.color && opts.color.light) || '#ffffff';
      ctx.fillStyle = light; ctx.fillRect(0, 0, size, size);
      ctx.fillStyle = dark;
      for (let r = 0; r < count; r++) {
        for (let col = 0; col < count; col++) {
          if (qr.isDark(r, col)) ctx.fillRect((col + margin) * cell, (r + margin) * cell, cell, cell);
        }
      }
      resolve(canvas.toDataURL('image/png'));
    } catch (e) { reject(e); }
  }),
};

// Data types

  createdAt: string;
  dataConsent?: boolean;      // el cliente autoriza el uso y guardado de sus datos
  dataConsentAt?: string;     // cuándo se registró la autorización

// A single task within a service order. Tasks are the source of truth: an order's
// amountCharged and serviceTypes are DERIVED from its tasks (see syncOrderTotals).
// Each task can be assigned to a different mechanic and is completed independently.
interface ServiceTask {
  id: string;
  service: string;            // service-type name (from getServiceTypes)
  positions: string[];        // e.g. ['Del. Izq','Tras. Der'] — empty if not position-based
  detail?: string;            // free note ("rueda de repuesto", etc.)
  qty: number;                // multiplies both prices
  servicePrice: number;       // precio de SERVICIO unitario (cuenta para comisiones)
  suppliesPrice: number;      // precio de INSUMO unitario (NO cuenta para comisiones)
  supplyCode?: string;        // código del insumo en el catálogo (autocompleta suppliesPrice)
  priceCategory?: string;     // canal / medio de pago elegido (afecta servicio e insumo)
  mechanicId: string;         // '' = sin asignar, 'free' = libre, o id de mecánico
  mechanic: string;           // nombre del mecánico asignado (cache)
  status: 'pendiente' | 'completado' | 'no_realizado';  // no_realizado = el mecánico no pudo hacerla
  completedAt?: string;
  completedBy?: string;
  notDoneReason?: string;     // por qué no se pudo realizar (para la devolución del vendedor)
  notDoneBy?: string;         // mecánico que la marcó como no realizada
  notDoneAt?: string;
}

// Un producto vendido dentro de una venta (con o sin servicio). El precio se
// autocompleta desde la lista cargada por administración, pero el vendedor puede
// ajustarlo en casos de excepción. Los productos NO cuentan para comisiones.
interface SaleProduct {
  code: string;             // código del producto (de la lista de precios)
  name: string;             // nombre del producto
  qty: number;
  unitPrice: number;        // precio unitario aplicado (editable)
  category?: string;        // categoría de precio usada (Precio web, presencial, etc.)
}

interface Inspection {
  id: string;
  licensePlate: string;
  date: string;
  mechanic: string;
  mechanicId: string;
  branch: string;
  serviceTypes: string[];     // DERIVED from tasks (unique service names)
  amountCharged: number;      // DERIVED from tasks+products: Σ (servicePrice+suppliesPrice)·qty + productos
  tasks?: ServiceTask[];      // source of truth for new orders (legacy orders may lack it)
  products?: SaleProduct[];   // productos vendidos en esta venta (con o sin servicio)
  saleType?: 'servicio' | 'productos';  // 'productos' = venta solo de productos (sin orden de mecánico)
  frontTiresCondition: number;
  rearTiresCondition: number;
  frontBrakesCondition: number;
  rearBrakesCondition: number;
  suspensionCondition: string;
  alternatorStatus: string;
  batteryStatus: string;

  fluidLevels: string;
  additionalNotes: string;

  engineOil?: string;
  orderNumber?: string;        // service-order correlative assigned by the seller (e.g. OS-0001)

  serviceBy?: string;          // who registered the commercial service (seller)
  serviceDate?: string;        // when the service order was created
  saleStatus?: 'activa' | 'cancelada';  // commercial state of the sale (seller can cancel)

const IVA_RATE = 0.19;
const quoteSubtotal = (q: Quote): number =>
  q.items.reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.unitPrice) || 0), 0);
const quoteIva = (q: Quote): number => Math.round(quoteSubtotal(q) * IVA_RATE);
const quoteTotal = (q: Quote): number => quoteSubtotal(q) + quoteIva(q);
const quoteBranchOf = (q: Quote): string => q.branch || branchOfPerson(q.createdBy);

// ---- Service tasks: math, derivation and per-mechanic helpers ----
const TASK_POSITIONS = ['Del. Izq', 'Del. Der', 'Tras. Izq', 'Tras. Der'];

const taskQty = (t: ServiceTask): number => Math.max(1, Number(t.qty) || 1);
// Full task price (servicio + insumo) × cantidad.
const taskTotal = (t: ServiceTask): number => ((Number(t.servicePrice) || 0) + (Number(t.suppliesPrice) || 0)) * taskQty(t);
// Service-only amount × cantidad (lo único que cuenta para comisiones).
const taskServiceAmount = (t: ServiceTask): number => (Number(t.servicePrice) || 0) * taskQty(t);

const orderTasks = (o: Inspection): ServiceTask[] => Array.isArray(o.tasks) ? o.tasks : [];
const orderProducts = (o: Inspection): SaleProduct[] => Array.isArray(o.products) ? o.products : [];
// Total de productos de la venta (cantidad × precio unitario). No comisionable.
const productTotal = (p: SaleProduct): number => (Number(p.unitPrice) || 0) * Math.max(1, Number(p.qty) || 1);
const orderProductsTotal = (o: Inspection): number => orderProducts(o).reduce((s, p) => s + productTotal(p), 0);
const orderTotal = (o: Inspection): number => orderTasks(o).reduce((s, t) => s + taskTotal(t), 0) + orderProductsTotal(o);
const orderServiceAmount = (o: Inspection): number => orderTasks(o).reduce((s, t) => s + taskServiceAmount(t), 0);

// Recompute the derived fields (amountCharged, serviceTypes) from the tasks + products so
// all existing reports/dashboards keep working unchanged.
const syncOrderTotals = (o: Inspection): Inspection => {
  const tasks = orderTasks(o);
  const hasProducts = orderProducts(o).length > 0;
  if (tasks.length || hasProducts) {
    o.amountCharged = orderTotal(o);
    const names = [...new Set(tasks.map(t => t.service).filter(Boolean))];
    if (!tasks.length && hasProducts) names.push('Venta de productos');
    o.serviceTypes = names;
  }
  return o;
};

// An order is completed when every task is completed (and there is at least one).
const allTasksDone = (o: Inspection): boolean => {
  const tasks = orderTasks(o);
  return tasks.length > 0 && tasks.every(t => t.status === 'completado');
};

// Tareas que el mecánico marcó como NO REALIZADAS (sin repuestos, cliente se negó, etc.).
// El vendedor las usa para gestionar la devolución correspondiente.
const orderNotDoneTasks = (o: Inspection): ServiceTask[] =>
  orderTasks(o).filter(t => t.status === 'no_realizado');

// Service-only amount of the tasks a given mechanic COMPLETED in an order.
const mechanicServiceAmount = (o: Inspection, mechanicId: string): number =>
  orderTasks(o).filter(t => t.mechanicId === mechanicId && t.status === 'completado').reduce((s, t) => s + taskServiceAmount(t), 0);

// Tasks visible to a mechanic in an order: the ones assigned to them, plus 'libre'/unassigned.
const tasksForMechanic = (o: Inspection, mechanicId: string): ServiceTask[] =>
  orderTasks(o).filter(t => t.mechanicId === mechanicId || t.mechanicId === 'free' || t.mechanicId === '');

// "Procesos futuros" recommended by the mechanic after an inspection, sent to the
// Admin de Ventas so they can prepare a quote for the client.
interface Recommendation {
  id: string;
  licensePlate: string;
  inspectionId: string;
  orderNumber?: string;
  items: string[];        // recommended future work
  doneItems?: string[];   // procesos que el mecánico YA realizó (extra pedidos por el cliente) → el vendedor debe cobrarlos
  notes: string;
  createdBy: string;      // mechanic
  createdAt: string;
  status: 'pendiente' | 'cotizada';
  quoteId?: string;
}

// TODOS los datos (usuarios, clientes, vehículos, servicios, catálogo, precios,
// sucursales, paquetes y configuración) viven en Supabase. La app no trae datos
// escritos en su código ni los guarda en el equipo: estas llaves apuntan a la
// memoria de la sesión abierta (ver almacenamiento.js), que se llena con
// lo que baja de la nube y se sincroniza hacia ella.

// Storage keys
const USERS_KEY = 'fullneumaticos_users_v3';
const QUOTES_KEY = 'fullneumaticos_quotes';
const RECOMMENDATIONS_KEY = 'fullneumaticos_recommendations';
const VEHICLES_KEY = 'fullneumaticos_vehicles';
const INSPECTIONS_KEY = 'fullneumaticos_inspections';
const ALERTS_KEY = 'fullneumaticos_alerts';
const EMAILS_KEY = 'fullneumaticos_emails';
const ANNOUNCEMENTS_KEY = 'fullneumaticos_announcements';
const ANN_READ_KEY = 'fullneumaticos_ann_read';
const AUDIT_KEY = 'fullneumaticos_audit_log';
const SUGGESTIONS_KEY = 'fullneumaticos_suggestions';
const COMMISSIONS_KEY = 'fullneumaticos_commissions';
const CURRENT_USER_KEY = 'fullneumaticos_current_user_v2';

// Initialize default data
const initializeData = () => {
  // Los USUARIOS viven en Supabase (tabla "users"), no en el código de la app.
  // Aquí no se siembra ninguna cuenta: si la nube no responde, la pantalla de
  // ingreso lo avisa y no se inventan usuarios locales.

  // Ensure the "Administración" branch exists and Nemecio Campos belongs to it
  // (HQ branches see all sucursales), even on installs seeded before this change.
  {
    const branches = JSON.parse(localStorage.getItem(BRANCHES_KEY) || 'null');
    if (Array.isArray(branches) && !branches.includes('Administración')) {
      const insertAt = Math.max(0, branches.indexOf('Oficina Central'));
      branches.splice(insertAt, 0, 'Administración');
      localStorage.setItem(BRANCHES_KEY, JSON.stringify(branches));
    }
    const usersNow = getUsers();
    const nem = usersNow.find(u => u.email.trim().toLowerCase() === 'ncampos@fullneumaticos.cl');
    if (nem && nem.branch !== 'Administración') {
      nem.branch = 'Administración';
      localStorage.setItem(USERS_KEY, JSON.stringify(usersNow));
    }
  }

  // Clientes y vehículos: se registran en la app y viven en Supabase (tabla
  // "vehicles"). En memoria parten vacíos y se llenan con lo que baja.
  if (!localStorage.getItem(VEHICLES_KEY)) {
    localStorage.setItem(VEHICLES_KEY, JSON.stringify([]));
  }

  if (!localStorage.getItem(INSPECTIONS_KEY)) {
    localStorage.setItem(INSPECTIONS_KEY, JSON.stringify([]));
  }

  if (!localStorage.getItem(ALERTS_KEY)) {
    localStorage.setItem(ALERTS_KEY, JSON.stringify([]));
  }

  // El catálogo de productos (neumáticos y baterías con sus precios) se descarga
  // de Supabase (app_kv → products). No hay catálogo escrito en la app.

  // Limpieza por única vez: elimina los registros de muestra/prueba que pudieran
  // haber quedado de las pruebas. Los usuarios, sucursales, comisiones y cualquier
  // dato real se conservan. La marca evita que vuelva a ejecutarse.
  if (!localStorage.getItem('fullneumaticos_cleanup_samples_v1')) {
    const samplePlates = ['ABC123', 'DEF456', 'GHI789', 'JKL012', 'MNO345'];
    try {
      const veh = JSON.parse(localStorage.getItem(VEHICLES_KEY) || '[]')
        .filter((v: any) => !samplePlates.includes(String(v.licensePlate || '').toUpperCase()));
      localStorage.setItem(VEHICLES_KEY, JSON.stringify(veh));

      const ins = JSON.parse(localStorage.getItem(INSPECTIONS_KEY) || '[]')
        .filter((i: any) => !samplePlates.includes(String(i.licensePlate || '').toUpperCase())
          && !/^INS-00[1-6]$/.test(String(i.id || '')));
      localStorage.setItem(INSPECTIONS_KEY, JSON.stringify(ins));

      const alr = JSON.parse(localStorage.getItem(ALERTS_KEY) || '[]')
        .filter((a: any) => !samplePlates.includes(String(a.licensePlate || '').toUpperCase())
          && !/^ALERT-00[1-4]$/.test(String(a.id || '')));
      localStorage.setItem(ALERTS_KEY, JSON.stringify(alr));
    } catch (e) { /* sin cambios si hay datos corruptos */ }
    localStorage.setItem('fullneumaticos_cleanup_samples_v1', '1');
  }

  // Migración por única vez: las órdenes antiguas (serviceTypes + amountCharged, sin
  // tasks) se convierten en una tarea sintética para que el nuevo modelo y los reportes
  // sigan funcionando. El precio antiguo queda como precio de servicio (las comisiones
  // históricas no cambian); el insumo queda en 0.
  if (!localStorage.getItem('fullneumaticos_tasks_migration_v1')) {
    try {
      const list = JSON.parse(localStorage.getItem(INSPECTIONS_KEY) || '[]');
      let changed = false;
      for (const o of list) {
        if (Array.isArray(o.tasks) && o.tasks.length) continue;
        const services = Array.isArray(o.serviceTypes) && o.serviceTypes.length ? o.serviceTypes : ['Servicio'];
        const total = Number(o.amountCharged) || 0;
        const per = Math.round(total / services.length);
        o.tasks = services.map((s: string, idx: number) => ({
          id: `T-${o.id}-${idx}`,
          service: s,
          positions: [],
          detail: '',
          qty: 1,
          servicePrice: idx === services.length - 1 ? total - per * (services.length - 1) : per,
          suppliesPrice: 0,
          mechanicId: o.mechanicId || '',
          mechanic: o.mechanic || '',
          status: o.status === 'completado' ? 'completado' : 'pendiente',
          completedAt: o.status === 'completado' ? (o.date || undefined) : undefined,
          completedBy: o.status === 'completado' ? (o.mechanic || undefined) : undefined,
        }));
        changed = true;
      }
      if (changed) localStorage.setItem(INSPECTIONS_KEY, JSON.stringify(list));
    } catch (e) { /* sin cambios si hay datos corruptos */ }
    localStorage.setItem('fullneumaticos_tasks_migration_v1', '1');
  }
};

// Commission goals: configured by the support admin per role. Each role can be
// enabled/disabled and have any number of money goals (e.g. 100%, 110%).
interface CommissionGoal { label: string; amount: number; }
interface RoleCommission { enabled: boolean; goals: CommissionGoal[]; reviewDay?: number; mode?: 'branch' | 'personal' | 'both'; sources?: { personal?: boolean; role?: boolean; branch?: boolean }; }
const COMMISSIONABLE_ROLES: { value: string; label: string }[] = [
  { value: 'mechanic', label: 'Mecánicos' },
  { value: 'admin2', label: 'Ventas' },
  { value: 'admin', label: 'Admin Global' },
];
const USER_COMMISSIONS_KEY = 'fullneumaticos_commission_users';
const getUserCommissions = (): Record<string, RoleCommission> => {
  return JSON.parse(localStorage.getItem(USER_COMMISSIONS_KEY) || '{}');
};
const saveUserCommissions = (m: Record<string, RoleCommission>) => {
  localStorage.setItem(USER_COMMISSIONS_KEY, JSON.stringify(m));
};
const getCommissionConfig = (): Record<string, RoleCommission> => {
  return JSON.parse(localStorage.getItem(COMMISSIONS_KEY) || '{}');
};
const saveCommissionConfig = (cfg: Record<string, RoleCommission>) => {
  localStorage.setItem(COMMISSIONS_KEY, JSON.stringify(cfg));
};
// Clave de configuración por sucursal + rol. branch '' = "todas las sucursales" (default).
const branchRoleKey = (branch: string | undefined, role: string): string => `${branch || ''}::${role}`;

// Config de comisión para una sucursal + rol. Orden de búsqueda:
//   1) sucursal específica + rol   2) todas las sucursales + rol   3) legado (solo rol)
const getBranchRoleCommission = (branch: string | undefined, role?: string): RoleCommission => {
  if (!role) return { enabled: false, goals: [] };
  const cfg = getCommissionConfig();
  const c = cfg[branchRoleKey(branch, role)] || cfg[branchRoleKey('', role)] || cfg[role];
  if (!c) return { enabled: false, goals: [] };
  return { enabled: !!c.enabled, goals: [...(c.goals || [])].sort((a, b) => a.amount - b.amount), reviewDay: c.reviewDay || 1 };
};

// Compat: meta "de rol" = meta de todas las sucursales para ese rol.
const getRoleCommission = (role?: string): RoleCommission => getBranchRoleCommission('', role);

// Meta SOLO de la sucursal (sin caer al rol): sirve para distinguir "por sucursal"
// de "por rol" en las excepciones por persona.
const getBranchOnlyCommission = (branch: string | undefined, role?: string): RoleCommission => {
  if (!role) return { enabled: false, goals: [] };
  const c = getCommissionConfig()[branchRoleKey(branch, role)];
  if (!c) return { enabled: false, goals: [] };
  return { enabled: !!c.enabled, goals: [...(c.goals || [])].sort((a, b) => a.amount - b.amount), reviewDay: c.reviewDay || 1 };
};

// Fuentes de comisión que aplican a una persona: personal, por rol y/o por sucursal
// (independientes). Deriva de datos antiguos con 'mode' si no hay 'sources'.
const getCommissionSources = (user: User | null): { personal: boolean; role: boolean; branch: boolean } => {
  if (!user) return { personal: false, role: false, branch: false };
  const ov = getUserCommissions()[user.id];
  if (!ov) return { personal: false, role: true, branch: true };
  if (ov.sources) return { personal: !!ov.sources.personal, role: !!ov.sources.role, branch: !!ov.sources.branch };
  const m = (ov.mode as any) || 'personal';
  return { personal: m === 'personal' || m === 'both', role: false, branch: m === 'branch' || m === 'both' };
};

// Commission settings for a specific user: a personalized override takes precedence
// over the branch+role goal (lets a vendor/mechanic have distinct goals).
const getCommissionForUser = (user: User | null): RoleCommission & { custom?: boolean } => {
  if (!user) return { enabled: false, goals: [] };
  const ov = getUserCommissions()[user.id];
  const mode = getUserCommissionMode(user);
  // 'branch' → usa la meta de sucursal+rol; 'personal'/'both' → usa la personal (para el ciclo).
  if (ov && mode !== 'branch') return { enabled: !!ov.enabled, goals: [...(ov.goals || [])].sort((a, b) => a.amount - b.amount), reviewDay: ov.reviewDay || 1, custom: true };
  return getBranchRoleCommission(user.branch, user.role);
};

// Cómo recibe comisiones una persona:
//   'branch'   = solo la meta de su sucursal+rol (default)
//   'personal' = solo su meta personalizada
//   'both'     = ambas
// Si tiene override sin 'mode' definido (datos antiguos), se asume 'personal'
// (antes la meta personalizada reemplazaba a la de rol).
const getUserCommissionMode = (user: User | null): 'branch' | 'personal' | 'both' => {
  if (!user) return 'branch';
  const ov = getUserCommissions()[user.id];
  if (!ov) return 'branch';
  if (ov.sources) {
    // Para agregados de sucursal: cuenta si recibe la fuente 'sucursal'.
    if (ov.sources.branch && ov.sources.personal) return 'both';
    if (ov.sources.branch) return 'branch';
    return 'personal';
  }
  return (ov.mode as any) || 'personal';
};

// Las "vistas" de comisión que debe ver una persona en su inicio: puede ser su meta
// personal, la de su sucursal+rol, o ambas. Cada vista trae su propio avance.
const getCommissionViews = (user: User | null): Array<{ scope: 'personal' | 'role' | 'branch'; label: string; goals: CommissionGoal[]; reviewDay: number; achieved: number }> => {
  if (!user) return [];
  const src = getCommissionSources(user);
  const views: Array<{ scope: 'personal' | 'role' | 'branch'; label: string; goals: CommissionGoal[]; reviewDay: number; achieved: number }> = [];
  if (src.personal) {
    const ov = getUserCommissions()[user.id];
    if (ov && ov.enabled && (ov.goals || []).length) {
      const reviewDay = ov.reviewDay || 1;
      views.push({ scope: 'personal', label: 'Tu meta personal', goals: [...ov.goals].sort((a, b) => a.amount - b.amount), reviewDay, achieved: rawSalesForUserInCycle(user, reviewDay) });
    }
  }
  if (src.role) {
    const rc = getRoleCommission(user.role);
    if (rc.enabled && rc.goals.length) {
      const reviewDay = rc.reviewDay || 1;
      // Meta de rol = objetivo individual del rol, medido sobre las ventas propias.
      views.push({ scope: 'role', label: `Meta de ${getRoleLabel(user.role)}`, goals: rc.goals, reviewDay, achieved: rawSalesForUserInCycle(user, reviewDay) });
    }
  }
  if (src.branch) {
    // Prefiere la meta propia de la sucursal; si no hay, cae a la de rol (comportamiento previo).
    const rc = getBranchOnlyCommission(user.branch, user.role).enabled ? getBranchOnlyCommission(user.branch, user.role) : getBranchRoleCommission(user.branch, user.role);
    if (rc.enabled && rc.goals.length) {
      const reviewDay = rc.reviewDay || 1;
      views.push({ scope: 'branch', label: `Meta de tu sucursal · ${getRoleLabel(user.role)} · ${user.branch}`, goals: rc.goals, reviewDay, achieved: salesForBranchRoleInCycle(user.branch, user.role, reviewDay).total });
    }
  }
  return views;
};

// The commission cycle is a month-long window that starts on the role's review
// day. Given a review day (1–28) it returns the current period [start, end).
const commissionPeriod = (reviewDay: number): { start: Date; end: Date; label: string } => {
  const day = Math.min(28, Math.max(1, reviewDay || 1));
  const now = new Date();
  let start = new Date(now.getFullYear(), now.getMonth(), day);
  if (now < start) start = new Date(now.getFullYear(), now.getMonth() - 1, day);
  const end = new Date(start.getFullYear(), start.getMonth() + 1, day);
  const fmt = (d: Date) => d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });
  const label = day === 1
    ? start.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' })
    : `${fmt(start)} → ${fmt(new Date(end.getTime() - 86400000))}`;
  return { start, end, label };
};

// Money a user generated within a given commission cycle (review day decides the window).
const rawSalesForUserInCycle = (user: User | null, reviewDay: number): number => {
  if (!user) return 0;
  const { start, end } = commissionPeriod(reviewDay || 1);
  const inCycle = (d: string) => { const x = new Date(d); return x >= start && x < end; };
  if (user.role === 'mechanic') {
    // Comisión del mecánico = suma del PRECIO DE SERVICIO de las tareas que ÉL completó
    // (el insumo nunca cuenta). Soporta órdenes con tareas de varios mecánicos.
    return getInspections()
      .filter(i => !isSaleCancelled(i) && inCycle(i.serviceDate || i.date))
      .reduce((s, i) => s + mechanicServiceAmount(i, user.id), 0);
  }
  // Comisión del vendedor = suma del PRECIO DE SERVICIO de las tareas que él registró.
  const orders = getInspections()
    .filter(i => i.orderNumber && i.serviceBy === user.name && !isSaleCancelled(i) && inCycle(i.serviceDate || i.date))
    .reduce((s, i) => s + (orderTasks(i).length ? orderServiceAmount(i) : (i.amountCharged || 0)), 0);
  const quotes = getQuotes()
    .filter(q => q.status === 'pagada' && q.createdBy === user.name && !isQuoteSaleCancelled(q) && inCycle(q.payment?.registeredAt || q.createdAt))
    .reduce((s, q) => s + (q.payment?.amount || quoteTotal(q)), 0);
  return orders + quotes;
};

// A user's sales in their effective (personal/branch+role) cycle.
const salesForUserInCycle = (user: User | null): number => {
  if (!user) return 0;
  return rawSalesForUserInCycle(user, getCommissionForUser(user).reviewDay || 1);
};

// Aggregate sales for a branch+role goal = sum of all active users of that role+branch
// que cuentan para la meta de sucursal (modo 'branch' o 'both'; los 'personal' quedan fuera).
const salesForBranchRoleInCycle = (branch: string, role: string, reviewDay: number): { total: number; members: number } => {
  const members = getUsers().filter(u => u.active !== false && u.role === role && u.branch === branch && getUserCommissionMode(u) !== 'personal');
  const total = members.reduce((s, u) => s + rawSalesForUserInCycle(u, reviewDay), 0);
  return { total, members: members.length };
};

// How much money a user has generated in the current commission cycle (drives the progress bar).
const currentMonthSalesForUser = (user: User | null): number => salesForUserInCycle(user);

// Per-person commission progress for the report. Returns commissionable users
// (active, role has commissions enabled) with their month total, goals, the next
// goal and how much money remains to reach it. Optionally branch-scoped.
// Commission report rows. Goals are now per BRANCH + ROLE, so the report shows one
// aggregated row per (branch, role) with an enabled goal (summing the sales of all
// non-custom people of that role+branch). People with a PERSONAL goal get their own
// row. Optionally filtered by branch/role.
const getCommissionReport = (branch?: string, role?: string) => {
  const rows: any[] = [];
  const branches = (branch ? [branch] : getBranches());
  const roles = COMMISSIONABLE_ROLES.map(r => r.value).filter(rv => !role || rv === role);

  // Aggregated branch + role goals.
  for (const b of branches) {
    for (const rv of roles) {
      const cfg = getBranchRoleCommission(b, rv);
      if (!cfg.enabled || cfg.goals.length === 0) continue;
      const { total: achieved, members } = salesForBranchRoleInCycle(b, rv, cfg.reviewDay || 1);
      if (members === 0) continue; // no people of this role in this branch → skip empty row
      const goals = cfg.goals;
      const nextGoal = goals.find(g => achieved < g.amount) || null;
      const topGoal = goals[goals.length - 1];
      const reviewDay = cfg.reviewDay || 1;
      rows.push({
        kind: 'group',
        title: `${getRoleLabel(rv)} · ${b}`,
        subtitle: `Meta de sucursal · ${members} ${members === 1 ? 'persona' : 'personas'}`,
        name: `${getRoleLabel(rv)} - ${b}`, role: rv, branch: b, custom: false,
        achieved, goals, nextGoal, reviewDay, cycleLabel: commissionPeriod(reviewDay).label,
        remaining: nextGoal ? nextGoal.amount - achieved : 0,
        reachedCount: goals.filter(g => achieved >= g.amount).length, totalGoals: goals.length,
        pct: Math.min(100, Math.round((achieved / (topGoal.amount || 1)) * 100)),
      });
    }
  }

  // Personalized (per-person) goals: solo quienes reciben meta personal ('personal' o 'both').
  getUsers()
    .filter(u => u.active !== false && getUserCommissionMode(u) !== 'branch')
    .filter(u => !branch || u.branch === branch)
    .filter(u => !role || u.role === role)
    .forEach(u => {
      const ov = getUserCommissions()[u.id];
      if (!ov || !ov.enabled || (ov.goals || []).length === 0) return;
      const goals = [...ov.goals].sort((a, b) => a.amount - b.amount);
      const reviewDay = ov.reviewDay || 1;
      const achieved = rawSalesForUserInCycle(u, reviewDay);
      const nextGoal = goals.find(g => achieved < g.amount) || null;
      const topGoal = goals[goals.length - 1];
      const both = getUserCommissionMode(u) === 'both';
      rows.push({
        kind: 'person',
        title: u.name,
        subtitle: `Meta personalizada${both ? ' (+ sucursal)' : ''} · ${getRoleLabel(u.role)} · ${u.branch}`,
        name: u.name, role: u.role, branch: u.branch, custom: true,
        achieved, goals, nextGoal, reviewDay, cycleLabel: commissionPeriod(reviewDay).label,
        remaining: nextGoal ? nextGoal.amount - achieved : 0,
        reachedCount: goals.filter(g => achieved >= g.amount).length, totalGoals: goals.length,
        pct: Math.min(100, Math.round((achieved / (topGoal.amount || 1)) * 100)),
      });
    });

  return rows.sort((a, b2) => (a.custom === b2.custom ? b2.achieved - a.achieved : (a.custom ? 1 : -1)));
};

const exportCommissionsExcel = (branch?: string, role?: string) => {
  const rows = getCommissionReport(branch, role);
  if (rows.length === 0) { toast.error('No hay comisiones configuradas'); return; }
  const maxGoals = Math.max(...rows.map(r => r.totalGoals), 0);
  const header = ['Tipo', 'Sucursal/Rol o Persona', 'Rol', 'Sucursal', 'Ciclo (revisión)', 'Acumulado del ciclo', 'Metas alcanzadas', 'Próxima meta', 'Falta para próxima meta'];
  for (let i = 0; i < maxGoals; i++) header.push(`Meta ${i + 1}`, `Meta ${i + 1} alcanzada`);
  const data: (string | number)[][] = [header];
  for (const r of rows) {
    const row: (string | number)[] = [
      r.custom ? 'Personalizada' : 'Sucursal',
      r.title, getRoleLabel(r.role), r.branch, r.cycleLabel, r.achieved,
      `${r.reachedCount} de ${r.totalGoals}`,
      r.nextGoal ? r.nextGoal.label : 'Todas alcanzadas',
      r.nextGoal ? r.remaining : 0,
    ];
    for (let i = 0; i < maxGoals; i++) {
      const g = r.goals[i];
      row.push(g ? `${g.label}: ${g.amount}` : '', g ? (r.achieved >= g.amount ? 'Sí' : 'No') : '');
    }
    data.push(row);
  }
  const monthName = new Date().toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
  downloadBlob(buildXlsx([{ name: 'Comisiones', rows: data }]), `Comisiones_${monthName.replace(/\s/g, '_')}.xlsx`);
  toast.success('Excel de comisiones descargado');
};

// Resolve a person's branch by their name (used to filter quotes/alerts by branch).
const branchOfPerson = (name?: string): string => {
  if (!name) return '';
  const u = getUsers().find(x => x.name === name);
  return u?.branch || '';
};

const saveUsers = (users: User[]) => {
  localStorage.setItem(USERS_KEY, JSON.stringify(users));
};

// Authenticate by email + password. Only active accounts may sign in.
// Normalize a Chilean RUT for comparison: drop dots, dashes and spaces, lowercase the K.
const normalizeRut = (s: string): string => (s || '').replace(/[.\-\s]/g, '').toLowerCase();

// Authenticate by RUT, EMAIL or full NAME + password. Mechanics sign in with their
// RUT. Only active accounts may sign in.
const authenticateUser = (identifier: string, password: string): User | null => {
  const target = identifier.trim().toLowerCase();
  const norm = (s: string) => (s || '').trim().toLowerCase().replace(/\s+/g, ' ');
  const t = norm(identifier);
  const rid = normalizeRut(identifier);
  const user = getUsers().find(u =>
    (
      (!!u.email && u.email.trim().toLowerCase() === target)
      || norm(u.name) === t
      || (!!u.rut && rid !== '' && normalizeRut(u.rut) === rid)
    ) && u.password === password
  );
  if (!user) return null;
  if (user.active === false) return null;
  return user;
};

// Create a new user (global admin only). Returns the created user or null if the
// email or RUT already exists.
const createUser = (data: Omit<User, 'id' | 'active'>): User | null => {
  const users = getUsers();
  const email = (data.email || '').trim();
  const rut = (data.rut || '').trim();
  if (email && users.some(u => (u.email || '').trim().toLowerCase() === email.toLowerCase())) return null;
  if (rut && users.some(u => u.rut && normalizeRut(u.rut) === normalizeRut(rut))) return null;
  const nextId = String(users.reduce((max, u) => Math.max(max, parseInt(u.id) || 0), 0) + 1);
  const user: User = { ...data, email, rut, id: nextId, active: true };
  users.push(user);
  saveUsers(users);
  return user;
};

// Toggle a user's active flag (global admin only).
const setUserActive = (id: string, active: boolean) => {
  const users = getUsers();
  const idx = users.findIndex(u => u.id === id);
  if (idx >= 0) {
    users[idx] = { ...users[idx], active };
    saveUsers(users);
  }
};

// Re-tag the name snapshots that historical records store, so the information a
// user entered is preserved but consistently reflects their new/deleted name.
const retagUserName = (oldName: string, newName: string) => {
  if (!oldName || oldName === newName) return;
  const inspections = getInspections();
  let changed = false;
  for (const ins of inspections) {
    if (ins.mechanic === oldName) { ins.mechanic = newName; changed = true; }
  }
  if (changed) localStorage.setItem(INSPECTIONS_KEY, JSON.stringify(inspections));

  for (const key of [VEHICLES_KEY, ALERTS_KEY, EMAILS_KEY]) {
    const list = JSON.parse(localStorage.getItem(key) || '[]');
    let did = false;
    for (const r of list) {
      if (r.createdBy === oldName) { r.createdBy = newName; did = true; }
    }
    if (did) localStorage.setItem(key, JSON.stringify(list));
  }
};

// Edit any field of a user (support admin). Keeps email unique and keeps the
// name consistent across the data this user has entered.
const updateUser = (id: string, updates: Partial<User>): { ok: boolean; error?: string } => {
  const users = getUsers();
  const idx = users.findIndex(u => u.id === id);
  if (idx < 0) return { ok: false, error: 'Usuario no encontrado' };

  if (updates.email !== undefined) {
    const target = updates.email.trim().toLowerCase();
    if (target) {
      const clash = users.some(u => u.id !== id && (u.email || '').trim().toLowerCase() === target);
      if (clash) return { ok: false, error: 'Ya existe otro usuario con ese correo' };
    }
    updates = { ...updates, email: updates.email.trim() };
  }
  if (updates.rut !== undefined) {
    const r = normalizeRut(updates.rut);
    if (r) {
      const clash = users.some(u => u.id !== id && u.rut && normalizeRut(u.rut) === r);
      if (clash) return { ok: false, error: 'Ya existe otro usuario con ese RUT' };
    }
    updates = { ...updates, rut: updates.rut.trim() };
  }

  const oldName = users[idx].name;
  users[idx] = { ...users[idx], ...updates };
  saveUsers(users);

  if (updates.name !== undefined && updates.name !== oldName) {
    retagUserName(oldName, updates.name);
  }
  return { ok: true };
};

// Permanently delete a user (support admin). The data they entered is kept; their
// name is re-tagged everywhere to show the account was deleted, and the account
// record is removed so it can no longer sign in.
const deleteUserPermanently = (id: string): { ok: boolean; error?: string } => {
  const users = getUsers();
  const user = users.find(u => u.id === id);
  if (!user) return { ok: false, error: 'Usuario no encontrado' };
  const markedName = `${user.name} (Usuario eliminado)`;
  retagUserName(user.name, markedName);
  saveUsers(users.filter(u => u.id !== id));
  return { ok: true };
};

// ---- Bulk user import from an .xlsx workbook (support admin) ----
const _stripAccents = (s: string): string => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
const _roleFromCargo = (cargo: string): User['role'] => {
  const c = (cargo || '').toLowerCase();
  if (/global/.test(c)) return 'admin';
  if (/central/.test(c)) return 'soporte';
  if (/mec/.test(c)) return 'mechanic';
  if (/admin\s*2|admin2/.test(c)) return 'admin2';
  if (/venta/.test(c)) return 'admin2';
  return 'mechanic';
};
const _branchFromCell = (suc: string): string => {
  const s = _stripAccents(suc);
  const hit = getBranches().find(b => _stripAccents(b) === s);
  if (hit) return hit;
  if (!suc || /^\d/.test(String(suc).trim())) return getBranches()[0] || 'Oficina Central';
  return String(suc).trim();
};
const _looksRut = (s: string): boolean => /^\d{7,8}-?[0-9kK]$/.test((s || '').replace(/\./g, ''));
const _cleanCell = (v: any): string => { let x = (v == null ? '' : String(v)).trim(); if (/^\d+\.0$/.test(x)) x = x.replace(/\.0$/, ''); return x; };

// Unzip + parse the first worksheet of an .xlsx into an array of { col: value } rows.
async function parseXlsxRows(arrayBuffer: ArrayBuffer): Promise<Record<string, string>[]> {
  const buf = new Uint8Array(arrayBuffer);
  const dv = new DataView(buf.buffer);
  let eocd = -1;
  for (let i = buf.length - 22; i >= 0; i--) { if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; } }
  if (eocd < 0) throw new Error('El archivo no es un .xlsx válido');
  const cdOffset = dv.getUint32(eocd + 16, true);
  const cdCount = dv.getUint16(eocd + 10, true);
  const files: Record<string, { method: number; compSize: number; localOff: number }> = {};
  let p = cdOffset;
  for (let n = 0; n < cdCount; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const compSize = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const commentLen = dv.getUint16(p + 32, true);
    const localOff = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(buf.subarray(p + 46, p + 46 + nameLen));
    files[name] = { method, compSize, localOff };
    p = p + 46 + nameLen + extraLen + commentLen;
  }
  const inflate = async (sub: Uint8Array): Promise<Uint8Array> => {
    const ds = new (window as any).DecompressionStream('deflate-raw');
    const w = ds.writable.getWriter(); w.write(sub); w.close();
    const r = ds.readable.getReader(); const chunks: Uint8Array[] = []; let t = 0;
    while (true) { const { done, value } = await r.read(); if (done) break; chunks.push(value); t += value.length; }
    const out = new Uint8Array(t); let o = 0; for (const c of chunks) { out.set(c, o); o += c.length; } return out;
  };
  const readEntry = async (name: string): Promise<string | null> => {
    const f = files[name]; if (!f) return null;
    const lh = f.localOff;
    const nl = dv.getUint16(lh + 26, true); const el = dv.getUint16(lh + 28, true);
    const start = lh + 30 + nl + el;
    const sub = buf.subarray(start, start + f.compSize);
    const data = f.method === 0 ? sub : await inflate(sub);
    return new TextDecoder().decode(data);
  };
  const ssXml = (await readEntry('xl/sharedStrings.xml')) || '';
  const strings = [...ssXml.matchAll(/<si>([\s\S]*?)<\/si>/g)].map(m =>
    [...m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x => x[1]).join('')
      .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'"));
  const sheetName = Object.keys(files).find(n => /xl\/worksheets\/sheet1\.xml$/.test(n))
    || Object.keys(files).find(n => /xl\/worksheets\/sheet\d+\.xml$/.test(n));
  const sheet = sheetName ? ((await readEntry(sheetName)) || '') : '';
  const rows: Record<string, string>[] = [];
  for (const rm of sheet.matchAll(/<row[^>]*>([\s\S]*?)<\/row>/g)) {
    const cells: Record<string, string> = {};
    for (const cm of rm[1].matchAll(/<c r="([A-Z]+)\d+"(?:[^>]*?\st="([^"]+)")?[^>]*>([\s\S]*?)<\/c>/g)) {
      const col = cm[1], type = cm[2], inner = cm[3]; let val = '';
      const v = inner.match(/<v>([\s\S]*?)<\/v>/); const is = inner.match(/<t[^>]*>([\s\S]*?)<\/t>/);
      if (type === 'inlineStr' && is) val = is[1];
      else if (v) { val = type === 's' ? (strings[parseInt(v[1])] ?? '') : v[1]; }
      cells[col] = val.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
    }
    rows.push(cells);
  }
  return rows;
}

type UserDraft = Omit<User, 'id' | 'active'>;

// Map parsed workbook rows (with a header row) into normalized user drafts.
function usersFromWorkbookRows(rows: Record<string, string>[]): UserDraft[] {
  if (!rows.length) return [];
  const header = rows[0];
  const colByName: Record<string, string> = {};
  for (const col of Object.keys(header)) {
    const h = _stripAccents(header[col]);
    if (/(nombre|apellido)/.test(h) && !colByName.name) colByName.name = col;
    else if (/mail|correo|email/.test(h) && !colByName.email) colByName.email = col;
    else if (/rut/.test(h) && !colByName.rut) colByName.rut = col;
    else if (/(contrase|clave|password)/.test(h) && !colByName.pass) colByName.pass = col;
    else if (/(cargo|rol)/.test(h) && !colByName.role) colByName.role = col;
    else if (/(sucursal|local|tienda)/.test(h) && !colByName.branch) colByName.branch = col;
  }
  const recognized = !!colByName.name;
  const get = (r: Record<string, string>, key: string, fallbackCol: string) => r[colByName[key] || fallbackCol];
  const usedEmail = new Set<string>();
  const out: UserDraft[] = [];
  const startRow = recognized ? 1 : 0;
  for (let i = startRow; i < rows.length; i++) {
    const r = rows[i];
    const name = _cleanCell(get(r, 'name', 'A'));
    if (!name || _stripAccents(name) === 'nombre y apellido') continue;
    let email = _cleanCell(get(r, 'email', 'B')); if (!email.includes('@')) email = '';
    let rut = _cleanCell(get(r, 'rut', 'C'));
    let pass = _cleanCell(get(r, 'pass', 'D'));
    if (rut && !_looksRut(rut) && !pass) { pass = rut; rut = ''; }
    if (rut && !_looksRut(rut)) rut = '';
    if (!pass) pass = '1111';
    if (email) { const k = email.toLowerCase(); if (usedEmail.has(k)) email = ''; else usedEmail.add(k); }
    out.push({ name, email, rut, password: pass, role: _roleFromCargo(get(r, 'role', 'E')), branch: _branchFromCell(get(r, 'branch', 'F')) });
  }
  return out;
}

// Replace or merge the user base with imported drafts. Returns a summary.
function applyImportedUsers(drafts: UserDraft[], mode: 'replace' | 'merge'): { created: number; updated: number; total: number } {
  const users: User[] = mode === 'replace' ? [] : getUsers();
  let nextId = users.reduce((m, u) => Math.max(m, parseInt(u.id) || 0), 0);
  const byEmail = new Map(users.filter(u => u.email).map(u => [u.email.trim().toLowerCase(), u]));
  const byRut = new Map(users.filter(u => u.rut).map(u => [normalizeRut(u.rut!), u]));
  let created = 0, updated = 0;
  for (const d of drafts) {
    let existing: User | undefined;
    if (mode === 'merge') {
      if (d.email && byEmail.has(d.email.trim().toLowerCase())) existing = byEmail.get(d.email.trim().toLowerCase());
      else if (d.rut && byRut.has(normalizeRut(d.rut))) existing = byRut.get(normalizeRut(d.rut));
    }
    if (existing) {
      Object.assign(existing, d);
      updated++;
    } else {
      nextId++;
      users.push({ ...d, id: String(nextId), active: true });
      created++;
    }
  }
  saveUsers(users);
  return { created, updated, total: users.length };
}

// Edit a vehicle record. If the plate changes, re-key it across inspections,
// alerts and quotes so the history stays linked. Returns ok/error.
const updateVehicleRecord = (oldPlate: string, updates: Partial<Vehicle>): { ok: boolean; error?: string } => {
  const vehicles = getVehicles();
  const idx = vehicles.findIndex(v => v.licensePlate === oldPlate);
  if (idx < 0) return { ok: false, error: 'Vehículo no encontrado' };

  const newPlate = (updates.licensePlate || oldPlate).toUpperCase().trim();
  if (!newPlate) return { ok: false, error: 'La patente no puede estar vacía' };
  if (newPlate !== oldPlate && vehicles.some(v => v.licensePlate === newPlate)) {
    return { ok: false, error: 'Ya existe un vehículo con esa patente' };
  }

  vehicles[idx] = { ...vehicles[idx], ...updates, licensePlate: newPlate };
  localStorage.setItem(VEHICLES_KEY, JSON.stringify(vehicles));

  if (newPlate !== oldPlate) {
    const inspections = getInspections();
    inspections.forEach(i => { if (i.licensePlate === oldPlate) i.licensePlate = newPlate; });
    localStorage.setItem(INSPECTIONS_KEY, JSON.stringify(inspections));

    const alerts = getAlerts();
    alerts.forEach(a => { if (a.licensePlate === oldPlate) a.licensePlate = newPlate; });
    localStorage.setItem(ALERTS_KEY, JSON.stringify(alerts));

    const quotes = JSON.parse(localStorage.getItem(QUOTES_KEY) || '[]');
    quotes.forEach((q: any) => { if (q.licensePlate === oldPlate) q.licensePlate = newPlate; });
    localStorage.setItem(QUOTES_KEY, JSON.stringify(quotes));
  }
  return { ok: true };
};

// Sube a Supabase Storage las fotos que estén en base64 y devuelve el objeto
// de fotos con URLs públicas. Las que ya son URL se dejan igual; si una subida
// falla, conserva el base64 como respaldo para no perder la foto.
// Reescala una foto (data URL) a un lado máximo y la recomprime como JPEG.
// Se aplica al CAPTURAR para que lo guardado/sincronizado sea liviano (las
// cámaras entregan imágenes de varios MB) y el guardado no se sienta lento.
const compressPhoto = (dataUrl: string, maxDim = 1600, quality = 0.82): Promise<string> =>
  new Promise((resolve) => {
    try {
      if (typeof dataUrl !== 'string' || dataUrl.indexOf('data:') !== 0) { resolve(dataUrl); return; }
      const im = new Image();
      im.onload = () => {
        try {
          const w = im.naturalWidth, h = im.naturalHeight;
          const scale = Math.min(1, maxDim / Math.max(w, h));
          const cw = Math.max(1, Math.round(w * scale));
          const ch = Math.max(1, Math.round(h * scale));
          const c = document.createElement('canvas');
          c.width = cw; c.height = ch;
          c.getContext('2d')!.drawImage(im, 0, 0, cw, ch);
          resolve(c.toDataURL('image/jpeg', quality));
        } catch (e) { resolve(dataUrl); }
      };
      im.onerror = () => resolve(dataUrl);
      im.src = dataUrl;
    } catch (e) { resolve(dataUrl); }
  });

// Sube a Supabase Storage las fotos que estén en base64 y devuelve el objeto
// de fotos con URLs públicas. Las que ya son URL se dejan igual; si una subida
// falla, conserva el base64 como respaldo para no perder la foto.
const uploadInspectionPhotos = async (
  inspId: string,
  photos: Record<string, string>
): Promise<Record<string, string>> => {
  const out: Record<string, string> = {};
  const sync: any = (window as any).FNSync;
  const keys = Object.keys(photos || {});
  // De 3 en 3: en celular, muchas subidas simultáneas se atascan y fallan todas.
  const runOne = async (key: string) => {
    const val = photos[key];
    if (typeof val === 'string' && val.indexOf('data:') === 0 && sync && sync.uploadPhoto) {
      try {
        out[key] = await sync.uploadPhoto(`${inspId}/${key}.jpg`, val);
      } catch (e) {
        console.error('Error subiendo foto', key, e);
        // La foto NO se pierde: queda en la cola persistente y se reintenta sola.
        if (sync.queuePhoto) { try { await sync.queuePhoto(inspId, key, val); } catch (_) {} }
        out[key] = val;
      }
    } else {
      out[key] = val;
    }
  };
  for (let i = 0; i < keys.length; i += 3) {
    await Promise.all(keys.slice(i, i + 3).map(runOne));
  }
  return out;
};

// Marca el resultado del envío sobre el mensaje ya guardado en el buzón.
const markEmailDelivery = (id: string, delivery: string, deliveryError?: string) => {
  const list = getEmails();
  const i = list.findIndex(e => e.id === id);
  if (i < 0) return;

// Envío real por Resend, a través de la función serverless /api/send-email
// (la clave de Resend vive en Vercel, nunca en el navegador). Si el envío no
// está configurado o falla, el mensaje queda en el buzón y se puede abrir con
// el cliente de correo (mailto), como antes: nunca se pierde.
const deliverEmail = (email: EmailMsg) => {
  if (!email.to || !/.+@.+\..+/.test(email.to)) return;
  fetch('api/send-email.php', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ to: email.to, cc: email.cc, subject: email.subject, text: email.body }),
  })
    .then(async (r) => {
      const d = await r.json().catch(() => ({}));
      if (r.ok && d.ok) markEmailDelivery(email.id, 'sent');
      else markEmailDelivery(email.id, 'failed', d.error || ('HTTP ' + r.status));
    })
    .catch((e) => markEmailDelivery(email.id, 'failed', String(e && e.message || e)));
};

// Compose + record an alert notification email. Per the workflow, alert
// notifications go to the Admin de Ventas (sales team) — they decide when to
// contact the client — NOT directly to the client.
const getSalesRecipients = (): { primary: string; primaryName: string; cc?: string } => {
  const sellers = getUsers().filter(u => (u.role === 'admin2' || u.role === 'ventas') && u.active !== false);
  const emails = sellers.map(s => s.email).filter(Boolean);
  return {
    primary: emails[0] || '',
    primaryName: sellers[0]?.name || 'Admin de Ventas',
    cc: emails.slice(1).join(',') || undefined,
  };
};

const sendAlertEmail = (type: 'created' | 'expiring', alert: Alert): EmailMsg => {
  const vehicle = getVehicle(alert.licensePlate);
  const sales = getSalesRecipients();
  const clientName = vehicle?.clientName || 'Cliente';
  const clientContact = [vehicle?.phoneNumber, vehicle?.email].filter(Boolean).join(' · ') || 'sin datos de contacto';
  const fecha = formatDateEs(alert.nextMaintenanceDate);

  // The notification is addressed to the sales admin (responsible creator first).
  const creator = getUsers().find(u => u.name === alert.createdBy);
  const creatorIsSeller = creator && (creator.role === 'admin2' || creator.role === 'ventas') && creator.active !== false;
  const to = creatorIsSeller ? creator!.email : sales.primary;
  const toName = creatorIsSeller ? creator!.name : sales.primaryName;
  const ccSet = new Set<string>();
  if (sales.cc) sales.cc.split(',').forEach(e => ccSet.add(e));
  if (sales.primary && sales.primary !== to) ccSet.add(sales.primary);
  ccSet.delete(to);
  const cc = [...ccSet].join(',') || undefined;

  let subject = '';
  let body = '';
  if (type === 'created') {
    subject = `Nueva alerta de mantenimiento · ${alert.licensePlate}`;
    body = `Estimado/a ${toName} (Admin de Ventas):\n\n`
      + `Se ha registrado una alerta de mantenimiento. Por favor contactar al cliente para coordinar el servicio.\n\n`
      + `Patente: ${alert.licensePlate}\n`
      + `Cliente: ${clientName}\n`
      + `Contacto: ${clientContact}\n`
      + `Próximo mantenimiento: ${fecha}.\n`
      + (alert.notes ? `Nota: ${alert.notes}\n` : '')
      + `\nFull Neumáticos\nGenerado por: ${alert.createdBy}`;
  } else {
    subject = `Mantenimiento por vencer mañana · ${alert.licensePlate}`;
    body = `Estimado/a ${toName} (Admin de Ventas):\n\n`
      + `El mantenimiento del vehículo ${alert.licensePlate} vence mañana (${fecha}). `
      + `Por favor contactar al cliente a la brevedad.\n\n`
      + `Cliente: ${clientName}\n`
      + `Contacto: ${clientContact}\n`
      + (alert.notes ? `Nota: ${alert.notes}\n` : '')
      + `\nFull Neumáticos\nGenerado por: ${alert.createdBy}`;
  }

  const email: EmailMsg = {
    id: `MAIL-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
    type,
    alertId: alert.id,
    licensePlate: alert.licensePlate,
    to,
    toName,
    cc,
    subject,
    body,
    createdBy: alert.createdBy,
    sentAt: new Date().toISOString(),
  };
  saveEmail(email);
  return email;
};

// Fire the "por vencer" email for any pending alert whose maintenance date is
// exactly tomorrow (the day before it expires). Runs once per alert.
const processExpiringAlerts = (): number => {
  const alerts = getAlerts();
  const startOfToday = new Date();
  startOfToday.setHours(0, 0, 0, 0);
  let sent = 0;
  for (const a of alerts) {
    if (a.completed || a.expiringEmailSent) continue;
    const due = new Date(a.nextMaintenanceDate + 'T00:00:00');
    const days = Math.round((due.getTime() - startOfToday.getTime()) / 86400000);
    if (days === 1) {
      sendAlertEmail('expiring', a);
      updateAlert(a.id, { expiringEmailSent: true });
      sent++;
    }
  }
  return sent;
};

const buildMailtoHref = (email: EmailMsg): string => {
  const params = new URLSearchParams();
  params.set('subject', email.subject);
  params.set('body', email.body);
  if (email.cc) params.set('cc', email.cc);
  return `mailto:${email.to}?${params.toString()}`;
};

/* ===== Excel (.xlsx) export ===== */

const __crcTable = (() => {
  const t: number[] = [];
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
const __crc32 = (bytes: Uint8Array): number => {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = __crcTable[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
};
const __enc = (str: string): Uint8Array => new TextEncoder().encode(str);

// Build a ZIP archive (store / no compression) from a list of files.
const __zip = (files: { name: string; data: Uint8Array }[]): Uint8Array => {
  const u16 = (n: number) => [n & 0xFF, (n >>> 8) & 0xFF];
  const u32 = (n: number) => [n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF];
  const chunks: Uint8Array[] = [];
  const central: { header: Uint8Array; name: Uint8Array }[] = [];
  let offset = 0;
  for (const f of files) {
    const nameBytes = __enc(f.name);
    const crc = __crc32(f.data);
    const size = f.data.length;
    const local = new Uint8Array(([] as number[]).concat(
      u32(0x04034b50), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(crc), u32(size), u32(size), u16(nameBytes.length), u16(0)
    ));
    chunks.push(local, nameBytes, f.data);
    const cen = new Uint8Array(([] as number[]).concat(
      u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(crc), u32(size), u32(size), u16(nameBytes.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset)
    ));
    central.push({ header: cen, name: nameBytes });
    offset += local.length + nameBytes.length + size;
  }
  let centralSize = 0;
  const centralChunks: Uint8Array[] = [];
  for (const c of central) { centralChunks.push(c.header, c.name); centralSize += c.header.length + c.name.length; }
  const end = new Uint8Array(([] as number[]).concat(
    u32(0x06054b50), u16(0), u16(0), u16(central.length), u16(central.length), u32(centralSize), u32(offset), u16(0)
  ));
  const all = [...chunks, ...centralChunks, end];
  let total = 0; for (const a of all) total += a.length;
  const out = new Uint8Array(total);
  let p = 0; for (const a of all) { out.set(a, p); p += a.length; }
  return out;
};

const __xmlEsc = (s: any): string => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const __colLetter = (n: number): string => { let s = ''; n++; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };

// Build a multi-sheet .xlsx Blob. sheets: [{ name, rows: (string|number)[][] }]
const buildXlsx = (sheets: { name: string; rows: (string | number)[][] }[]): Blob => {
  const sheetXml = (rows: (string | number)[][]) => {
    const rowsXml = rows.map((row, ri) => {
      const cells = row.map((val, ci) => {
        const ref = `${__colLetter(ci)}${ri + 1}`;
        if (typeof val === 'number' && isFinite(val)) return `<c r="${ref}"><v>${val}</v></c>`;
        return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${__xmlEsc(val)}</t></is></c>`;
      }).join('');
      return `<row r="${ri + 1}">${cells}</row>`;
    }).join('');
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${rowsXml}</sheetData></worksheet>`;
  };
  const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`;
  const rootRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
  const wbRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}</Relationships>`;
  const workbook = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s, i) => `<sheet name="${__xmlEsc(s.name).slice(0, 31)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>`;
  const files = [
    { name: '[Content_Types].xml', data: __enc(contentTypes) },
    { name: '_rels/.rels', data: __enc(rootRels) },
    { name: 'xl/workbook.xml', data: __enc(workbook) },
    { name: 'xl/_rels/workbook.xml.rels', data: __enc(wbRels) },
    ...sheets.map((s, i) => ({ name: `xl/worksheets/sheet${i + 1}.xml`, data: __enc(sheetXml(s.rows)) })),
  ];
  return new Blob([__zip(files)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
};

const downloadBlob = (blob: Blob, filename: string) => {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
};

// Date-range filter (inclusive). from/to are 'yyyy-mm-dd' or ''.
const inDateRange = (dateStr: string, from: string, to: string): boolean => {
  if (!dateStr) return false;
  const d = new Date(dateStr).getTime();
  const f = from ? new Date(from + 'T00:00:00').getTime() : -Infinity;
  const t = to ? new Date(to + 'T23:59:59').getTime() : Infinity;
  return d >= f && d <= t;
};

const buildSummarySheet = (list: Inspection[]) => {
  const active = list.filter(i => !isSaleCancelled(i));
  const cancelled = list.filter(i => isSaleCancelled(i));
  const totalRev = active.reduce((s, i) => s + (i.amountCharged || 0), 0);
  const cancelledAmt = cancelled.reduce((s, i) => s + (i.amountCharged || 0), 0);
  const rows: (string | number)[][] = [
    ['Resumen del período'], [],
    ['Inspecciones / órdenes activas', active.length],
    ['Ingresos totales (sin canceladas)', totalRev],
    ['Ticket promedio', active.length ? Math.round(totalRev / active.length) : 0],
    ['Ventas canceladas', cancelled.length],
    ['Monto cancelado / devuelto', cancelledAmt],
    [],
    ['Por sucursal', 'Cantidad', 'Ingresos'],
  ];
  const byBranch: Record<string, { c: number; r: number }> = {};
  for (const i of active) { const b = i.branch || 'Sin sucursal'; (byBranch[b] = byBranch[b] || { c: 0, r: 0 }); byBranch[b].c++; byBranch[b].r += i.amountCharged || 0; }
  Object.entries(byBranch).sort((a, b) => b[1].r - a[1].r).forEach(([b, d]) => rows.push([b, d.c, d.r]));
  rows.push([], ['Por mecánico', 'Cantidad', 'Ingresos']);
  const byMech: Record<string, { c: number; r: number }> = {};
  for (const i of active) { const m = i.mechanic || 'Sin asignar'; (byMech[m] = byMech[m] || { c: 0, r: 0 }); byMech[m].c++; byMech[m].r += i.amountCharged || 0; }
  Object.entries(byMech).sort((a, b) => b[1].r - a[1].r).forEach(([m, d]) => rows.push([m, d.c, d.r]));
  if (cancelled.length) {
    rows.push([], ['Cancelaciones / devoluciones', 'Patente', 'Monto', 'Motivo']);
    cancelled.forEach(c => rows.push([c.orderNumber || '', c.licensePlate, c.amountCharged || 0, c.cancelReason || '']));
  }
  return { name: 'Resumen', rows };
};

const exportMechanicEvaluationsExcel = (from: string, to: string, mechanicName?: string) => {

const DEFAULT_SERVICE_TYPES: string[] = [];

// Service metadata inferred from the name (the stored list is plain strings, so we
// infer behaviour with patterns instead of changing the storage shape).
const serviceUsesPositions = (name: string): boolean => /neum|llanta|balanceo|alineaci|freno|rueda|amortig|suspensi/i.test(name || '');
const serviceIsFullInspection = (name: string): boolean => /inspecci[oó]n\s+(completa|general)/i.test(name || '');
// Which technical-checklist field groups are relevant to a given service.
const serviceChecklistGroups = (name: string): string[] => {
  const n = name || '';
  if (serviceIsFullInspection(n)) return ['tires', 'brakes', 'suspension', 'battery', 'alternator', 'lights', 'belt', 'fluids'];
  const g: string[] = [];
  if (/neum|llanta|balanceo|alineaci|rueda/i.test(n)) g.push('tires');
  if (/freno/i.test(n)) g.push('brakes');
  if (/suspensi|eje|amortig/i.test(n)) g.push('suspension');
  if (/bater/i.test(n)) g.push('battery');
  if (/alternador|carga/i.test(n)) g.push('alternator');
  if (/luz|luces|iluminaci/i.test(n)) g.push('lights');
  if (/correa/i.test(n)) g.push('belt');
  if (/aceite|filtro|fluido|nivel/i.test(n)) g.push('fluids');
  return g;
};
// Union of relevant checklist groups across all of an order's tasks.
const checklistGroupsForTasks = (tasks: ServiceTask[]): Set<string> => {
  const out = new Set<string>();
  for (const t of (tasks || [])) for (const g of serviceChecklistGroups(t.service)) out.add(g);
  return out;
};

//  Listas de precios (servicios) y cat\u00e1logo de productos
//  Cargadas por administradores centrales / Nemecio v\u00eda Excel; el
//  vendedor obtiene el precio autom\u00e1ticamente al registrar la venta.
// ============================================================
const SERVICE_PRICES_KEY = 'fullneumaticos_service_prices';
const PRODUCTS_KEY = 'fullneumaticos_products';
const PRICE_CATEGORIES_KEY = 'fullneumaticos_price_categories';
// Columnas de precio del catálogo: Supabase (app_kv → price_categories).
const DEFAULT_PRICE_CATEGORIES: string[] = [];

// Mapa { nombreServicio -> precio } usado para autocompletar el precio de servicio.
const getServicePrices = (): Record<string, number> => {
  try { const o = JSON.parse(localStorage.getItem(SERVICE_PRICES_KEY) || '{}'); return o && typeof o === 'object' ? o : {}; }
  catch (e) { return {}; }
};
const saveServicePrices = (map: Record<string, any>) => localStorage.setItem(SERVICE_PRICES_KEY, JSON.stringify(map));
// Precio de un servicio para una categoría/canal. Soporta el formato antiguo (un
// número plano que aplica a todos los canales) y el nuevo ({ categoría -> precio }).
const servicePriceOf = (name: string, category?: string): number => {
  const v = getServicePrices()[name] as any;
  if (v == null) return 0;
  if (typeof v === 'number') return Number(v) || 0;
  if (typeof v === 'object') {
    // Si se pide una categoría concreta, se respeta su valor tal cual (incluido 0,
    // p.ej. un montaje gratuito). Solo cuando NO se pide categoría se usa como
    // referencia la primera con precio > 0.
    if (category) return Number(v[category]) || 0;
    const first = Object.values(v).find(x => Number(x) > 0);
    return Number(first) || 0;
  }
  return 0;
};
// Fija el precio de un servicio para una categoría/canal (lo edita el admin central
// en la misma sección donde crea o elimina servicios).
const setServicePriceFor = (name: string, category: string, price: number) => {
  const map = getServicePrices() as Record<string, any>;
  let entry = map[name];
  if (entry == null || typeof entry !== 'object') {
    const legacy = typeof entry === 'number' ? entry : 0;
    entry = {};
    if (legacy) for (const c of getPriceCategories()) entry[c] = legacy;
  }
  entry[category] = Math.max(0, Math.round(price) || 0);
  map[name] = entry;
  saveServicePrices(map);
};

// Categor\u00edas de precio de los productos (Precio web, presencial, medio de pago, etc.).
const getPriceCategories = (): string[] => {
  try { const a = JSON.parse(localStorage.getItem(PRICE_CATEGORIES_KEY) || 'null'); if (Array.isArray(a) && a.length) return a; } catch (e) {}
  return DEFAULT_PRICE_CATEGORIES;
};
const savePriceCategories = (list: string[]) => localStorage.setItem(PRICE_CATEGORIES_KEY, JSON.stringify(list));

// Cat\u00e1logo de productos: [{ code, name, prices: { categoria -> precio } }].
const getProducts = (): { code: string; name: string; prices: Record<string, number> }[] => {
  try { const a = JSON.parse(localStorage.getItem(PRODUCTS_KEY) || '[]'); if (Array.isArray(a) && a.length) return a; } catch (e) {}
  return [];
};
const saveProducts = (list: { code: string; name: string; prices: Record<string, number> }[]) => localStorage.setItem(PRODUCTS_KEY, JSON.stringify(list));
const findProductByCode = (code: string) => {
  const c = (code || '').trim().toLowerCase();
  return getProducts().find(p => (p.code || '').trim().toLowerCase() === c) || null;
};
// Precio de un producto en la categor\u00eda dada (cae a la primera categor\u00eda con precio si falta).
const productPriceOf = (p: { prices: Record<string, number> } | null, category: string): number => {
  if (!p) return 0;
  if (p.prices && p.prices[category] != null) return Number(p.prices[category]) || 0;
  const firstWithPrice = Object.values(p.prices || {}).find(v => Number(v) > 0);
  return Number(firstWithPrice) || 0;
};

// Busca en el catálogo (servicios + productos) un precio para un texto libre, por
// nombre exacto. Sirve para autollenar el precio en cotizaciones igual que en ventas.
const lookupCatalogPrice = (desc: string): number => {
  const q = (desc || '').trim().toLowerCase();
  if (!q) return 0;
  const svc = getServicePrices();
  for (const name of Object.keys(svc)) {
    if (name.trim().toLowerCase() === q) { const p = servicePriceOf(name); if (p > 0) return p; }
  }
  const cats = getPriceCategories();
  const prod = getProducts().find(p => (p.name || '').trim().toLowerCase() === q);
  if (prod) { const p = productPriceOf(prod, cats[0] || ''); if (p > 0) return p; }
  return 0;
};

// Qui\u00e9n puede cargar/editar las listas de precios: Administradores Centrales (soporte)
// y los administradores de casa matriz (Nemecio en \u201cAdministraci\u00f3n\u201d, Oficina Central).
const canManagePrices = (user: User | null): boolean =>
  !!user && (user.role === 'soporte' || (user.role === 'admin' && HQ_BRANCHES.includes(user.branch)));

const _num = (v: any): number => {
  let x = String(v == null ? '' : v).replace(/[^0-9.,-]/g, '').trim();
  if (!x) return 0;
  // Formato chileno: 1.234.567,89 \u2192 quitar puntos de miles, coma decimal a punto.
  if (/,\d{1,2}$/.test(x)) x = x.replace(/\./g, '').replace(',', '.');
  else x = x.replace(/,/g, '');
  return Math.round(Number(x) || 0);
};

// Importa una lista de precios de SERVICIOS desde filas de Excel (Servicio | Precio).
// Devuelve { added, updated } y agrega los servicios nuevos a la lista de tipos.
const importServicePricesFromRows = (rows: Record<string, string>[]): { count: number; added: number } => {
  if (!rows.length) return { count: 0, added: 0 };
  const header = rows[0];
  let nameCol = '', priceCol = '';
  for (const col of Object.keys(header)) {
    const h = _stripAccents(header[col]);
    if (/servicio|nombre|detalle/.test(h) && !nameCol) nameCol = col;
    else if (/precio|valor|monto/.test(h) && !priceCol) priceCol = col;
  }
  const recognized = !!nameCol;
  if (!nameCol) nameCol = 'A';
  if (!priceCol) priceCol = 'B';
  const map = getServicePrices();
  const types = getServiceTypes();
  let count = 0, added = 0;
  for (let i = recognized ? 1 : 0; i < rows.length; i++) {
    const name = _cleanCell(rows[i][nameCol]);
    if (!name || _stripAccents(name) === 'servicio') continue;
    const price = _num(rows[i][priceCol]);
    map[name] = price;
    count++;
    if (!types.some(s => s.toLowerCase() === name.toLowerCase())) { types.push(name); added++; }
  }
  saveServicePrices(map);
  saveServiceTypes(types);
  return { count, added };
};

// Importa el cat\u00e1logo de PRODUCTOS desde filas de Excel.
// Columnas: C\u00f3digo | Producto | <una o m\u00e1s columnas de precio>. Cada columna de
// precio extra se vuelve una categor\u00eda (Precio web, Precio presencial, etc.).
const importProductsFromRows = (rows: Record<string, string>[], mode: 'replace' | 'merge'): { count: number; categories: string[] } => {
  if (!rows.length) return { count: 0, categories: [] };
  const header = rows[0];
  let codeCol = '', nameCol = '';
  const priceCols: { col: string; label: string }[] = [];
  for (const col of Object.keys(header)) {
    const raw = _cleanCell(header[col]);
    const h = _stripAccents(raw);
    if (!h) continue;
    if (/codigo|sku|cod\b/.test(h) && !codeCol) codeCol = col;
    else if (/(producto|nombre|descrip|articulo|item)/.test(h) && !nameCol) nameCol = col;
    else if (/precio|valor|monto|web|presencial|efectivo|tarjeta|debito|credito|transferencia|pago/.test(h)) priceCols.push({ col, label: raw });
  }
  // Sin encabezados reconocibles: asume A=c\u00f3digo, B=producto, C=precio.
  const recognized = !!(codeCol || nameCol || priceCols.length);
  if (!recognized) { codeCol = 'A'; nameCol = 'B'; priceCols.push({ col: 'C', label: 'Precio' }); }
  if (!nameCol && codeCol) { nameCol = codeCol; codeCol = ''; }

  const cats = priceCols.map(p => p.label);
  const existing = mode === 'merge' ? getProducts() : [];
  const byCode: Record<string, { code: string; name: string; prices: Record<string, number> }> = {};
  for (const p of existing) byCode[(p.code || p.name).toLowerCase()] = p;
  let count = 0;
  for (let i = recognized ? 1 : 0; i < rows.length; i++) {
    const r = rows[i];
    const code = codeCol ? _cleanCell(r[codeCol]) : '';
    const name = _cleanCell(r[nameCol]);
    if (!name && !code) continue;
    if (_stripAccents(name) === 'producto' || _stripAccents(code) === 'codigo') continue;
    const prices: Record<string, number> = {};
    for (const pc of priceCols) prices[pc.label] = _num(r[pc.col]);
    const key = (code || name).toLowerCase();
    byCode[key] = { code: code || name, name: name || code, prices };
    count++;
  }
  saveProducts(Object.values(byCode));
  // Combina categor\u00edas nuevas con las existentes (conserva las que el admin agreg\u00f3).
  const merged = [...new Set([...(mode === 'merge' ? getPriceCategories() : []), ...cats])].filter(Boolean);
  if (merged.length) savePriceCategories(merged);
  return { count, categories: cats };
};

  saveServiceTypes([...list, clean]);

// Rename a service everywhere it's referenced so historical orders stay consistent.
const renameServiceType = (oldName: string, newName: string): { ok: boolean; error?: string } => {
  const clean = newName.trim();
  if (!clean) return { ok: false, error: 'El nombre no puede estar vacío' };
  const list = getServiceTypes();
  if (oldName === clean) return { ok: true };
  if (list.some(s => s.toLowerCase() === clean.toLowerCase())) return { ok: false, error: 'Ese servicio ya existe' };
  saveServiceTypes(list.map(s => s === oldName ? clean : s));
  const inspections = getInspections();
  let changed = false;
  for (const i of inspections) {
    if (Array.isArray(i.serviceTypes) && i.serviceTypes.includes(oldName)) {
      i.serviceTypes = i.serviceTypes.map(s => s === oldName ? clean : s);
      changed = true;
    }
  }
  if (changed) localStorage.setItem(INSPECTIONS_KEY, JSON.stringify(inspections));
  return { ok: true };
};
const deleteServiceType = (name: string): { ok: boolean; error?: string } => {
  const list = getServiceTypes();
  if (list.length <= 1) return { ok: false, error: 'Debe existir al menos un servicio' };
  saveServiceTypes(list.filter(s => s !== name));
  return { ok: true };
};
// Borrado en lote: con catálogos de 80+ servicios, borrar de uno en uno es inviable.
const deleteServiceTypes = (names: string[]): { ok: boolean; error?: string; removed?: number } => {
  const kill = new Set(names);
  const list = getServiceTypes();
  const left = list.filter(s => !kill.has(s));
  if (left.length === 0) return { ok: false, error: 'Debe quedar al menos un servicio' };
  saveServiceTypes(left);
  return { ok: true, removed: list.length - left.length };
};

// Deduce grupo y tipo de vehículo desde el nombre del servicio.
const guessServiceVehicle = (name: string): string => {
  const n = (name || '').toUpperCase();
  if (/GAMA ALTA/.test(n)) return 'Gama alta';
  if (/\bBUS\b/.test(n)) return 'Bus';
  if (/4X4|4X2|CAMIONETA|SUV/.test(n)) return 'Camioneta / SUV / 4x4';
  if (/CITY|SEDAN|SEDÁN/.test(n)) return 'City car / Sedán';
  return 'Todos';
};
const guessServiceGroup = (name: string): string => {
  const n = (name || '').toUpperCase();
  if (/MANTENCI[OÓ]N/.test(n)) return 'Mantenciones';
  if (/RECTIFICAD/.test(n)) return 'Rectificados';
  if (/FRENO|CALIPER|FLEXIBLE/.test(n)) return 'Frenos';
  if (/ALINEACI|CUADRATURA/.test(n)) return 'Alineación y cuadratura';
  if (/NEUM[AÁ]TICO|NEUMATICO|LLANTA|BALANCEO|MONTAJE|ROTACION DE NEUM/.test(n)) return 'Neumáticos y balanceo';
  if (/TREN DELANTERO|TERMINAL|AXIAL|ROTULA|RÓTULA|MC PHERSON|BANDEJA|RODAMIENTO MAZA|AMORTIGUA|SUSPENSI/.test(n)) return 'Tren delantero y suspensión';
  if (/EMBRAGUE|HOMOCINETICA|HOMOCINÉTICA|CAJA M\/T|DIFERENCIAL|TRANSFER/.test(n)) return 'Transmisión y embrague';
  if (/ACEITE|BUJIA|BUJÍA|FILTRO|MOTOR|RKM|VOLANTE/.test(n)) return 'Motor y lubricación';
  if (/INSPECCI/.test(n)) return 'Inspección';
  if (/BATERIA|BATERÍA/.test(n)) return 'Baterías';
  if (/INSUMO/.test(n)) return 'Insumos';
  return 'Otros';
};

const getServiceMetaMap = (): Record<string, ServiceMeta> => {
  try { const o = JSON.parse(localStorage.getItem(SERVICE_META_KEY) || '{}'); return o && typeof o === 'object' ? o : {}; }

const serviceMetaOf = (name: string): ServiceMeta => {
  const saved = getServiceMetaMap()[name];
  if (saved && saved.group) return { group: saved.group, vehicle: saved.vehicle || guessServiceVehicle(name) };
  return { group: guessServiceGroup(name), vehicle: guessServiceVehicle(name) };

const REMINDER_PRESETS = [
  { label: 'En 3 meses', months: 3 },
  { label: 'En 6 meses', months: 6 },
  { label: 'En 1 año', months: 12 },
  { label: 'Fin de mes', isEndOfMonth: true },
];

const calculateReminderDate = (preset: typeof REMINDER_PRESETS[0]): string => {
  const date = new Date();

  if (preset.isEndOfMonth) {
    const lastDay = new Date(date.getFullYear(), date.getMonth() + 1, 0);
    return lastDay.toISOString().split('T')[0];
  }

  date.setMonth(date.getMonth() + preset.months);
  return date.toISOString().split('T')[0];
};

const HQ_BRANCHES = ['Oficina Central', 'Administración'];
const canSeeAllBranches = (user: User | null): boolean => {
  return !!user && HQ_BRANCHES.includes(user.branch);
};

// Editing a registered vehicle's data (name, contact, plate, etc.): registrants + admin.
const canEditVehicles = (user: User | null): boolean => {
  return user?.role === 'admin' || user?.role === 'admin2' || user?.role === 'ventas';
};

const canEditInspection = (user: User | null, inspectionMechanicId: string): boolean => {
  if (user?.role === 'admin') return true;
  return user?.id === inspectionMechanicId;
};

const canViewAllAlerts = (user: User | null): boolean => {
  return user?.role === 'admin' || user?.role === 'admin2' || user?.role === 'ventas';
};

// Access to the Usuarios screen: global admin manages accounts; support admin
// edits and deletes them.
const canManageUsers = (user: User | null): boolean => {
  return user?.role === 'admin' || user?.role === 'soporte';
};

// Creating accounts belongs to the support admin only. The global admin can no
// longer create users — only deactivate/activate existing ones.
const canCreateUsers = (user: User | null): boolean => {
  return user?.role === 'soporte';
};
const canToggleUserActive = (user: User | null): boolean => {
  return user?.role === 'admin' || user?.role === 'soporte';
};

// Editing any field of another user and permanently deleting users are the
// distinctive powers of the support admin.
const canEditUsers = (user: User | null): boolean => {
  return user?.role === 'soporte';
};
const canDeleteUsers = (user: User | null): boolean => {
  return user?.role === 'soporte';
};

// Deleting inspections is reserved for the global admin.
const canDeleteInspections = (user: User | null): boolean => {
  return user?.role === 'admin';
};

// Editing / cancelling commercial sales: the seller (and global admin).
const canManageSales = (user: User | null): boolean => {
  return user?.role === 'admin2' || user?.role === 'ventas' || user?.role === 'admin';

// Internal announcements: created by the global admin and support admin. HQ

const canManageAnnouncements = (user: User | null): boolean => {
  return user?.role === 'admin' || user?.role === 'soporte';
};

const canRegisterVehicles = (user: User | null): boolean => {
  return user?.role === 'admin' || user?.role === 'admin2' || user?.role === 'ventas';
};
